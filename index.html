":"数据治理","scope":"征集说明·新编模拟题","q":"下列属于 DCMM 八大能力域的有（ ）。","options":[{"k":"A","v":"数据战略"},{"k":"B","v":"数据架构"},{"k":"C","v":"数据质量"},{"k":"D","v":"数据生存周期"},{"k":"E","v":"数据可视化"}],"answer":"ABCD","ref":"","exp":"八大能力域：数据战略、数据治理、数据架构、数据应用、数据安全、数据质量、数据标准、数据生存周期。数据可视化是数据应用中的具体技术手段，不单列为能力域。","source":"GB/T 36073—2018《数据管理能力成熟度评估模型》","tip":"","dup":"","batch":"base"},{"id":"XM26","bank":"mock","no":4,"type":"multi","typeName":"不定项选择题","topic":"数据治理","scope":"征集说明·新编模拟题","q":"企业数据治理体系通常包括的核心内容有（ ）。","options":[{"k":"A","v":"数据标准与数据模型管理"},{"k":"B","v":"元数据与主数据管理"},{"k":"C","v":"数据质量监控与问题闭环"},{"k":"D","v":"数据安全与分类分级管理"},{"k":"E","v":"仅采购一套数据库软件"}],"answer":"ABCD","ref":"","exp":"数据治理是「组织、制度、流程、技术」四位一体的体系：明确归口部门与数据责任人（Owner），建立标准、模型、元数据、主数据、质量、安全、生命周期等管理域并形成闭环。E 只是工具采购，不能替代治理体系。","source":"数据治理通用框架 / 公司数据管理制度体系","tip":"","dup":"","batch":"base"},{"id":"XM27","bank":"mock","no":5,"type":"multi","typeName":"不定项选择题","topic":"数据安全与合规","scope":"征集说明·新编模拟题","q":"依据《数据安全法》等法规，数据处理者应落实的数据安全保护义务包括（ ）。","options":[{"k":"A","v":"建立健全全流程数据安全管理制度"},{"k":"B","v":"开展数据安全教育培训"},{"k":"C","v":"采取技术手段保障数据安全"},{"k":"D","v":"加强风险监测，发现缺陷漏洞立即补救并按规定报告事件"},{"k":"E","v":"重要数据处理者定期开展风险评估并报送报告"}],"answer":"ABCDE","ref":"","exp":"五项均为法定义务要点：全流程制度 + 教育培训 + 技术措施构成基础，风险监测与事件处置（补救、告知、报告）构成动态要求，重要数据处理者还须定期风险评估并向主管部门报送报告。","source":"《中华人民共和国数据安全法》第二十七条、第二十九条、第三十条","tip":"","dup":"","batch":"base"},{"id":"XM28","bank":"mock","no":6,"type":"multi","typeName":"不定项选择题","topic":"人工智能","scope":"征集说明·新编模拟题","q":"生成式人工智能在电力企业落地时，需要重点关注的合规与安全要点有（ ）。","options":[{"k":"A","v":"训练语料与知识库来源合法、涉及个人信息应取得合法基础"},{"k":"B","v":"涉及重要数据、核心数据与敏感业务数据应做好分类分级与出域管控"},{"k":"C","v":"生成内容应可核验、关键业务结论须人工复核"},{"k":"D","v":"对外提供具有舆论属性或社会动员能力的服务应履行备案与安全评估"},{"k":"E","v":"模型输出可无条件直接用于调度指令与对外披露"}],"answer":"ABCD","ref":"","exp":"语料合法、数据分级管控、输出可核验与人工复核、备案与安全评估都是必备要求。E 错误：调度、继电保护、对外披露等高风险环节必须有人类审核与责任闭环，模型输出不得直接作为最终决策依据。","source":"《生成式人工智能服务管理暂行办法》《数据安全法》及企业AI应用安全实践","tip":"","dup":"","batch":"base"},{"id":"XM29","bank":"mock","no":7,"type":"multi","typeName":"不定项选择题","topic":"人工智能","scope":"征集说明·新编模拟题","q":"下列属于大语言模型在电力业务中较成熟、可落地的应用场景有（ ）。","options":[{"k":"A","v":"制度规程问答与工单知识检索（RAG）"},{"k":"B","v":"设备巡检报告、缺陷文本的结构化抽取与归类"},{"k":"C","v":"客服问答辅助与营业厅业务指引"},{"k":"D","v":"调度操作票、检修方案的辅助拟写（人工复核）"},{"k":"E","v":"直接替代继电保护定值的自动整定与执行"}],"answer":"ABCD","ref":"","exp":"知识检索、文本结构化、客服辅助、文稿辅助属于「辅助增效 + 人工把关」的成熟场景。E 涉及电网安全稳定，属于强实时强确定性的控制类任务，应由确定性算法与专业系统闭环，不宜交由概率式生成模型直接执行。","source":"电力行业人工智能应用实践","tip":"","dup":"","batch":"base"},{"id":"XM30","bank":"mock","no":8,"type":"multi","typeName":"不定项选择题","topic":"新一代信息技术","scope":"征集说明·新编模拟题","q":"实现跨主体数据「可用不可见」的常见技术或机制包括（ ）。","options":[{"k":"A","v":"联邦学习"},{"k":"B","v":"多方安全计算 / 可信执行环境"},{"k":"C","v":"数据沙箱与使用控制"},{"k":"D","v":"隐私计算结合区块链存证与审计"},{"k":"E","v":"把双方原始数据库互相开放全部读写权限"}],"answer":"ABCD","ref":"","exp":"前四项分别对应联合建模不交换明文、密态计算与隔离执行、受控使用策略、以及全流程存证与审计，共同构成数据流通利用的可信管控能力。E 是全量明文开放，与「可用不可见」背道而驰。","source":"可信数据空间 / 隐私计算技术体系","tip":"","dup":"","batch":"base"},{"id":"XM31","bank":"mock","no":9,"type":"multi","typeName":"不定项选择题","topic":"新一代信息技术","scope":"征集说明·新编模拟题","q":"下列技术中，属于支撑数字电网建设的新一代信息技术有（ ）。","options":[{"k":"A","v":"物联网与边缘计算"},{"k":"B","v":"云计算与微服务架构"},{"k":"C","v":"数字孪生"},{"k":"D","v":"区块链（存证与可信协同）"},{"k":"E","v":"机械式继电器"}],"answer":"ABCD","ref":"","exp":"感知（物联网、边缘）、算力与架构（云、微服务）、映射与仿真（数字孪生）、可信协同（区块链存证）共同构成数字电网技术底座。E 属于传统一次/二次设备，不是新一代信息技术。","source":"数字电网 / 新一代信息技术通用框架","tip":"","dup":"","batch":"base"},{"id":"XM32","bank":"mock","no":10,"type":"multi","typeName":"不定项选择题","topic":"生产运行与新兴业务","scope":"征集说明·新编模拟题","q":"下列能体现「电力数据要素化」价值的应用场景有（ ）。","options":[{"k":"A","v":"基于用电数据的「电力看经济」、行业景气度分析"},{"k":"B","v":"电碳耦合测算与企业碳排画像"},{"k":"C","v":"以用电行为辅助中小微企业信用评估（授权前提下）"},{"k":"D","v":"聚合分布式资源参与需求响应与虚拟电厂"},{"k":"E","v":"把用户明细用电数据未经脱敏直接对外售卖"}],"answer":"ABCD","ref":"","exp":"前四项都是在合法合规、授权与脱敏前提下把电力数据转化为产品或决策能力，服务政府治理、双碳、金融与电网调节。E 违反《个人信息保护法》《数据安全法》，不属于合规的价值化路径。","source":"数据要素×绿色低碳 / 电力数据增值服务实践","tip":"","dup":"","batch":"base"},{"id":"XM33","bank":"mock","no":11,"type":"multi","typeName":"不定项选择题","topic":"数据要素政策","scope":"征集说明·新编模拟题","q":"《关于加快公共数据资源开发利用的意见》与配套文件推动建立的机制包括（ ）。","options":[{"k":"A","v":"公共数据资源登记"},{"k":"B","v":"公共数据授权运营"},{"k":"C","v":"公共数据资源授权运营实施规范与信息公开"},{"k":"D","v":"公共数据产品和服务定价与收益分配机制"},{"k":"E","v":"要求所有公共数据无条件免费向全社会开放原始数据"}],"answer":"ABCD","ref":"","exp":"政策围绕「登记—授权运营—产品服务—定价与收益分配」构建制度链条，鼓励在安全合规前提下开发公共数据产品。E 错误：涉及国家秘密、工作秘密、个人信息、重要数据的公共数据不得无条件开放，需分类分级、脱敏与授权运营。","source":"《关于加快公共数据资源开发利用的意见》及公共数据资源授权运营配套文件","tip":"","dup":"","batch":"base"},{"id":"XM34","bank":"mock","no":12,"type":"multi","typeName":"不定项选择题","topic":"数据安全与合规","scope":"征集说明·新编模拟题","q":"依据现行规则，个人信息出境的合法路径及豁免情形包括（ ）。","options":[{"k":"A","v":"通过国家网信部门组织的数据出境安全评估"},{"k":"B","v":"订立个人信息出境标准合同并备案"},{"k":"C","v":"经专业机构进行个人信息保护认证"},{"k":"D","v":"符合《促进和规范数据跨境流动规定》所列情形可免予申报（如为订立、履行个人作为一方当事人的合同所必需）"},{"k":"E","v":"只要境外接收方承诺保密即可自由出境"}],"answer":"ABCD","ref":"","exp":"法定路径为安全评估、标准合同、认证三条，并配套规定了豁免情形（如跨境购物、汇款、机票酒店等履行合同所必需、跨境人力资源管理所必需、紧急情况保护自然人生命健康与财产安全等）。E 的「承诺即可」不是法定路径。","source":"《个人信息保护法》第三十八条、《促进和规范数据跨境流动规定》","tip":"","dup":"","batch":"base"},{"id":"XJ35","bank":"mock","no":1,"type":"judge","typeName":"判断题","topic":"数据要素政策","scope":"征集说明·新编模拟题","q":"「数据二十条」提出建立数据资源持有权、数据加工使用权、数据产品经营权等分置的产权运行机制。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。政策淡化了「所有权」争议，聚焦使用与流通，以三权分置落实数据产权结构性分置，是后续确权、授权运营与收益分配制度设计的基础。","source":"《关于构建数据基础制度更好发挥数据要素作用的意见》","tip":"","dup":"","batch":"base"},{"id":"XJ36","bank":"mock","no":2,"type":"judge","typeName":"判断题","topic":"数据资产","scope":"征集说明·新编模拟题","q":"企业只要拥有大量数据，就可以把全部数据资源确认为无形资产并计入资产负债表。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。入表须满足资产确认条件（拥有或控制、预期带来经济利益、成本可可靠计量），且区分内部使用（无形资产）与对外出售（存货）；研究阶段支出、权属不清或无法产生经济利益的数据不得资本化。","source":"《企业数据资源相关会计处理暂行规定》","tip":"","dup":"","batch":"base"},{"id":"XJ37","bank":"mock","no":3,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"征集说明·新编模拟题","q":"数据分类分级结果一经确定即可长期沿用，无需随业务变化和目录调整复核更新。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。分类分级是动态过程：数据级别随业务场景、聚合规模、加工深度、法规与重要数据目录变化而变化，需要定期复核、动态调整并留存变更记录，重要数据目录也应动态更新。","source":"GB/T 43697—2024《数据安全技术 数据分类分级规则》","tip":"","dup":"","batch":"base"},{"id":"XJ38","bank":"mock","no":4,"type":"judge","typeName":"判断题","topic":"人工智能","scope":"征集说明·新编模拟题","q":"检索增强生成（RAG）引入企业知识库后，可以从根本上消除大模型幻觉，输出无需人工复核。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。RAG 只能降低知识性幻觉概率；检索漏召回、知识库过期、文档本身错误、模型仍可能脱离上下文编造，都会导致错误输出。制度问答、报表解读、调度辅助等场景仍须保留引用溯源与人工复核。","source":"大语言模型应用工程通用实践","tip":"","dup":"","batch":"base"},{"id":"XJ39","bank":"mock","no":5,"type":"judge","typeName":"判断题","topic":"人工智能","scope":"征集说明·新编模拟题","q":"生成式人工智能服务提供者应当依法承担网络信息内容安全责任，并建立投诉举报与内容标识等机制。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。提供者须对训练数据合法性、生成内容安全、用户权益保护负责，落实内容标识、违法内容处置、投诉举报受理、算法备案与安全评估等义务。","source":"《生成式人工智能服务管理暂行办法》《人工智能生成合成内容标识办法》","tip":"","dup":"","batch":"base"},{"id":"XJ40","bank":"mock","no":6,"type":"judge","typeName":"判断题","topic":"新一代信息技术","scope":"征集说明·新编模拟题","q":"联邦学习要求参与方把各自的原始数据集中上传到中心节点后再统一训练模型。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。联邦学习的核心是「数据不动模型动」：各方在本地训练，仅交换模型参数或梯度（并可结合安全聚合、差分隐私加以保护），原始数据不出域。","source":"隐私计算 / 联邦学习技术原理","tip":"","dup":"","batch":"base"},{"id":"XJ41","bank":"mock","no":7,"type":"judge","typeName":"判断题","topic":"新一代信息技术","scope":"征集说明·新编模拟题","q":"数据沙箱结合使用控制策略，可以在限定时间、限定用途、限定操作的前提下实现「数据可用不可见」。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。数据沙箱提供隔离计算环境，使用控制按预设策略实时监测并动态决定数据操作的许可或拒绝，配合存证审计，实现「可用不可见、可控可计量」。","source":"可信数据空间可信管控能力相关技术文件","tip":"","dup":"","batch":"base"},{"id":"XJ42","bank":"mock","no":8,"type":"judge","typeName":"判断题","topic":"公司战略与数字化","scope":"征集说明·新编模拟题","q":"数字化转型的核心是用新一代信息系统替换原有系统，组织流程与管理模式可以保持不变。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。数字化转型是战略、业务、组织、技术与数据的系统性变革：以数据驱动流程再造与组织扁平化协同化，仅做系统替换属于「信息化」而非「数字化」。","source":"数字化转型通用认识 / 公司数字化转型行动方案","tip":"","dup":"","batch":"base"},{"id":"XJ43","bank":"mock","no":9,"type":"judge","typeName":"判断题","topic":"生产运行与新兴业务","scope":"征集说明·新编模拟题","q":"虚拟电厂需要新建实体发电机组，本质上是一种集中式电厂。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。虚拟电厂依托软件平台聚合分布式光伏、储能、充电桩、可调负荷等分散资源，通过量测、通信与控制形成可调节能力，没有新建实体机组。","source":"虚拟电厂 / 新型电力系统行业共识","tip":"","dup":"","batch":"base"},{"id":"XJ44","bank":"mock","no":10,"type":"judge","typeName":"判断题","topic":"数据治理","scope":"征集说明·新编模拟题","q":"数据质量管理的有效做法包括设定质量规则、持续监测、问题定位到责任人并闭环整改，而不是一次性清洗。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。数据质量是持续运营过程：定义规则与指标 → 监测与稽核 → 根因分析 → 责任到人的整改 → 复核与考核，形成闭环；一次性清洗无法解决源头录入和系统改造带来的新问题。","source":"DCMM 数据质量能力域","tip":"","dup":"","batch":"base"},{"id":"XJ45","bank":"mock","no":11,"type":"judge","typeName":"判断题","topic":"数据要素政策","scope":"征集说明·新编模拟题","q":"数据要素具有可复制、非排他、边际成本趋近于零等特点，因此无需考虑数据安全与个人信息保护。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。正因为易复制、易扩散、可关联还原，泄露后的影响更难以撤回，反而要求更严格的分类分级、访问控制、脱敏、审计与合规管理。数据要素化必须在安全合规前提下推进。","source":"《数据安全法》《个人信息保护法》","tip":"","dup":"","batch":"base"},{"id":"XJ46","bank":"mock","no":12,"type":"judge","typeName":"判断题","topic":"人工智能","scope":"征集说明·新编模拟题","q":"模型参数规模越大，在具体电力业务场景中的效果就一定越好、性价比也一定越高。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。业务效果取决于领域数据质量、场景适配（提示工程/RAG/微调）、推理成本、时延与合规要求。电力垂类场景常采用「通用底座 + 领域知识库/微调 + 小模型协同」以取得更优的性价比与可控性。","source":"大模型工程化落地通用认识","tip":"","dup":"","batch":"base"},{"id":"XS47","bank":"mock","no":1,"type":"short","typeName":"简答题","topic":"数据要素政策","scope":"征集说明·新编模拟题","q":"简述「数据二十条」提出的数据产权「三权分置」运行机制及其意义。","options":[],"answer":"","ref":"（1）机制内容：建立数据资源持有权、数据加工使用权、数据产品经营权等分置的产权运行机制，淡化传统「所有权」争议，分别界定数据持有、加工使用、产品经营环节各主体的权利边界；在保护个人隐私与商业秘密前提下，鼓励依法依规采集、加工、使用与流通。（2）配套制度：建立数据产权结构性分置、数据要素流通和交易、数据要素收益分配、数据要素安全治理四项基础制度，完善合规高效的数据要素流通和交易制度，建设规范的数据交易市场。（3）意义：破解数据权属不清导致的「不敢共享、不愿流通」难题；推动收益向数据价值和使用价值的创造者合理倾斜；在安全可控前提下放大数据要素的放大、叠加、倍增效应，支撑全国统一数据市场建设。","exp":"答题思路：先答「三权」名称（资源持有权、加工使用权、产品经营权）→ 再答配套四项基础制度 → 最后答意义（确权破局、收益分配、流通与安全并重）。评分要点一般在三权名称与「淡化所有权、强化使用权」这一核心创新上；易错点是把三权写成所有权/使用权/收益权，或漏答安全治理制度。","source":"《关于构建数据基础制度更好发挥数据要素作用的意见》（数据二十条）","tip":"","dup":"","batch":"base"},{"id":"XS48","bank":"mock","no":2,"type":"short","typeName":"简答题","topic":"数据治理","scope":"征集说明·新编模拟题","q":"结合企业实际，简述开展数据分类分级工作的主要步骤与配套管理要求。","options":[],"answer":"","ref":"（1）组织与制度准备：明确归口管理部门、数据责任人与工作机制，制定分类分级制度与细则，依据《数据安全法》及 GB/T 43697—2024《数据安全技术 数据分类分级规则》确定分类维度与分级规则。（2）资产盘点：梳理数据资源目录、系统台账、数据流向与处理活动，识别数据来源、规模、精度、覆盖度与共享范围。（3）分类：按业务属性/主题（如生产运行、经营管理、客户服务、个人信息等）划分类别与子类。（4）分级：按一旦泄露、篡改、非法利用可能危害的对象与程度，划分为一般数据、重要数据、核心数据（企业内部可再细化），多维命中时就高从严定级，形成重要数据目录并按要求备案。（5）落地管控：按级别差异化配置访问控制、加密脱敏、审计、出境与共享审批、销毁与留存策略，并在系统中打标。（6）动态复核：随业务变化、目录调整、法规更新定期复核与变更，开展培训、检查与考核，留存定级与变更记录。","exp":"答题按「组织制度 → 盘点 → 分类 → 分级 → 管控落地 → 动态复核」六步展开，最容易拿分的是「就高从严定级」「形成重要数据目录并备案」「差异化管控」「动态更新」四个点。易错点：只讲技术加密、不讲组织与目录管理；把分类与分级混为一谈。","source":"《数据安全法》第二十一条、GB/T 43697—2024、《能源行业数据安全管理办法（试行）》","tip":"","dup":"","batch":"base"},{"id":"XS49","bank":"mock","no":3,"type":"short","typeName":"简答题","topic":"人工智能","scope":"征集说明·新编模拟题","q":"简述在电力企业部署大模型应用时，需要重点关注的数据安全与合规要点。","options":[],"answer":"","ref":"（1）数据分级与边界：对训练语料、知识库与提示词中涉及的生产运行数据、重要数据、核心数据、个人信息与商业秘密先分类分级；重要/核心数据原则上不出域，禁止将涉密与敏感数据上传公网模型或第三方API。（2）语料合规：训练数据来源合法，涉及个人信息须具备合法处理基础并取得相应同意，涉及知识产权的内容应取得授权；按《生成式人工智能服务管理暂行办法》及 GB/T 45652—2025 等落实语料安全、标注安全与可追溯要求。（3）技术防护：私有化/本地化部署、访问权限最小化、租户与知识库隔离、提示词与日志脱敏、调用留痕审计、模型与知识库版本管理。（4）输出治理：关键结论引用溯源、显式标注「AI 生成、需人工核验」，制度问答/报表解读/操作票辅助等必须人工复核，高风险生产控制环节不得由生成式模型直接决策。（5）对外服务合规：面向公众提供且具有舆论属性或社会动员能力的服务，履行算法备案、安全评估、内容标识与投诉举报机制。（6）运营机制：建立 AI 应用准入评估、上线前安全测试、持续监测与事件应急、定期复评与人员培训。","exp":"评分热点在四个层次：输入侧（数据分级、语料合法）、模型侧（私有化部署、隔离与审计）、输出侧（可溯源 + 人工复核、不得直控生产）、治理侧（备案评估、准入与应急）。结合电力场景举出 1—2 个例子（如调度操作票辅助、制度问答知识库）能明显加分。","source":"《生成式人工智能服务管理暂行办法》《数据安全法》《个人信息保护法》、GB/T 45652—2025、GB/T 45674—2025","tip":"","dup":"","batch":"base"},{"id":"XS50","bank":"mock","no":4,"type":"short","typeName":"简答题","topic":"新一代信息技术","scope":"征集说明·新编模拟题","q":"简述可信数据空间如何实现「数据可用不可见」，并说明其对电力数据流通利用的价值。","options":[],"answer":"","ref":"（1）基本定位：可信数据空间是基于共识规则、连接多方主体、实现数据资源共享共用的数据流通利用基础设施，是国家数据基础设施流通利用设施层中的业务节点。（2）实现机制：①接入认证体系保证身份可信、权责清晰；②连接器部署在数据提供方可信环境，原始数据不出域；③隐私计算（联邦学习、多方安全计算、可信执行环境）、数据沙箱与使用控制实现「可用不可见、可控可计量」，按预设控制策略动态决定数据操作许可或拒绝；④合约与履约行为存证、区块链存证与全程审计实现可追溯；⑤统一标识、目录与接口实现跨主体互认与跨空间互联互通。（3）对电力的价值：在保护电网运行数据、用户用电信息等敏感数据的前提下，与政府、能源上下游、金融机构开展联合建模与数据产品开发（电力看经济、电碳耦合、绿色金融、供应链协同），把「不敢共享」变为「可控共享」，释放数据要素价值并满足分类分级、出境与个人信息保护合规要求。","exp":"答题三层：定位（是什么）→ 机制（怎么做到可用不可见，务必点名连接器部署位置、隐私计算、使用控制、存证审计）→ 价值（电力场景举例 + 合规）。易错点：把可信数据空间等同于「数据集中存储平台」，或只答技术不提共识规则与运营机制。","source":"《可信数据空间发展行动计划（2024—2028年）》《国家数据基础设施建设指引》《可信数据空间标准体系建设指南（2025年版）》","tip":"","dup":"","batch":"base"},{"id":"XS51","bank":"mock","no":5,"type":"short","typeName":"简答题","topic":"数据资产","scope":"征集说明·新编模拟题","q":"简述企业数据资源「入表」的基本条件、会计处理路径与管理意义。","options":[],"answer":"","ref":"（1）依据与适用范围：财政部《企业数据资源相关会计处理暂行规定》自 2024 年 1 月 1 日起施行，适用于企业按照会计准则确认为无形资产或存货的数据资源，以及虽未满足确认条件但由企业合法拥有或控制的数据资源相关披露。（2）基本条件：由企业拥有或控制（权属清晰）；预期会带来经济利益流入；相关成本或支出能够可靠计量；并需完成数据资源盘点、权属梳理、成本归集与业务模式判断。（3）会计路径：企业内部使用、用于持续提供服务或支撑经营管理的数据资源，符合条件确认为无形资产，按使用寿命摊销并做减值测试；企业持有以备出售（如对外提供的数据产品、数据集）的数据资源，符合条件确认为存货，按成本与可变现净值孰低计量；研究阶段支出、无法带来经济利益或成本无法归集的支出费用化。（4）管理意义：推动企业从「数据资源」向「数据资产」管理升级，倒逼建立数据台账、成本核算、质量与权属治理、价值评估与收益核算体系；为数据产品定价、授权运营、融资与交易提供财务基础，对内赋能数字化转型、对外服务数据要素市场。需注意入表不等于所有数据都能资本化，须遵循谨慎性原则。","exp":"答题务必区分「无形资产（内部使用）」与「存货（持有待售）」两条路径，并写出四个确认条件。评分易失分点：漏「成本可靠计量」、误以为所有数据都能入表、漏答披露要求或谨慎性原则。管理意义部分写出「盘点—成本—质量—权属—价值评估」闭环即可拿满。","source":"财政部《企业数据资源相关会计处理暂行规定》、《企业会计准则第6号——无形资产》《企业会计准则第1号——存货》","tip":"","dup":"","batch":"base"},{"id":"XS52","bank":"mock","no":6,"type":"short","typeName":"简答题","topic":"生产运行与新兴业务","scope":"征集说明·新编模拟题","q":"结合新型电力系统建设，简述电力数据要素化的典型应用场景及其价值（至少列举 4 类）。","options":[],"answer":"","ref":"（1）电网运行与生产：基于量测、气象、设备状态数据开展负荷预测、新能源功率预测、设备缺陷识别与状态检修、故障研判与自愈，提升可观可测可控水平与安全运行效率。（2）政府治理与宏观经济：以脱敏聚合的用电数据形成「电力看经济」「电力看复工复产」「产业景气指数」，为经济运行监测与政策制定提供高频客观依据。（3）双碳与绿色低碳：电碳耦合测算、企业碳排放画像、绿电溯源与绿证服务，服务能耗双控向碳排放双控转变及「数据要素×绿色低碳」行动。（4）金融与信用服务：在取得授权、脱敏与合规评估前提下，以用电稳定性等数据辅助中小微企业信用评估、绿色金融与保险定价。（5）需求响应与新兴业态：聚合分布式光伏、储能、充电桩、可调负荷形成虚拟电厂，参与辅助服务与市场交易；支撑需求响应、分时电价与能效服务。（6）客户服务与内部运营：客户画像与精准服务、台区线损治理、反窃电分析、供应链与物资优化。（7）前提与边界：所有场景须落实分类分级、最小必要、脱敏与授权、可追溯审计及个人信息保护要求，涉重要/核心数据不得违规出域或出境。","exp":"按「生产运行—政府治理—双碳—金融—新兴业态—客户服务」分条列举，每条给出「数据 + 场景 + 价值」三要素比只写名词更容易得分。结尾务必补一句合规前提（分类分级、授权脱敏、不得违规出域），这是电力行业阅卷的常见加分点。","source":"《「数据要素×」三年行动计划（2024—2026年）》、新型电力系统与数字电网建设相关实践","tip":"","dup":"","batch":"base"},{"id":"XS53","bank":"mock","no":23,"type":"single","typeName":"单选题","topic":"六网协同","scope":"2026 下半年专题","q":"党中央、国务院部署统筹推进的「六张网」是指（ ）。","options":[{"k":"A","v":"水网、新型电网、算力网、新一代通信网、城市地下管网、物流网"},{"k":"B","v":"水网、电网、油气管网、交通网、通信网、互联网"},{"k":"C","v":"输电网、配电网、微电网、储能网、充电网、算力网"},{"k":"D","v":"政务网、能源网、交通网、水网、物流网、金融网"}],"answer":"A","ref":"","exp":"「六张网」指水网、新型电网、算力网、新一代通信网、城市地下管网、物流网，是国家在「十五五」开局作出的基础设施协同优化部署。南方电网以电网为枢纽，与其余五网深度协同。B 混入了油气管网/互联网，C 把电网内部层级当成六网，D 混入了政务网、金融网，均不符合官方表述。","source":"南方电网公司官网《南方电网公司提速服务「六网」协同高质量发展》2026-08-18；新华网《第七届新型电力系统国际论坛在海口举行》2026-11-03","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS54","bank":"mock","no":24,"type":"single","typeName":"单选题","topic":"六网协同","scope":"2026 下半年专题","q":"2026 年 8 月，南方电网创新提出以（ ）为关键抓手，全域推进「六网」协同发展。","options":[{"k":"A","v":"五个一批（研究、实施、前期、储备、谋划一批）"},{"k":"B","v":"三型两网、世界一流"},{"k":"C","v":"1611 工作思路"},{"k":"D","v":"四流耦合、四网融合"}],"answer":"A","ref":"","exp":"「五个一批」即研究一批、实施一批、前期一批、储备一批、谋划一批，是覆盖理论研究、工程落地、技术验证与长远布局的全生命周期推进体系，确保梯次推进、滚动发展。B 是国家电网早年战略表述，C「1611」是 11 月白皮书提出的「十五五」推进思路，D「四流耦合」是协同机理而非工作抓手。","source":"南方电网公司官网 2026-08-18；《在协同发展中拓展新空间》2026-08-18","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS55","bank":"mock","no":25,"type":"single","typeName":"单选题","topic":"六网协同","scope":"2026 下半年专题","q":"《南方电网推进「六网」协同发展白皮书》发布于（ ）。","options":[{"k":"A","v":"2026 年 11 月 2 日，第七届新型电力系统国际论坛暨第二十二届中国南方电网国际技术论坛（海口）"},{"k":"B","v":"2026 年 8 月，南方电网公司年中工作会议"},{"k":"C","v":"2026 年 9 月，中国国际大数据产业博览会（贵阳）"},{"k":"D","v":"2025 年 12 月，公司「十四五」总结大会"}],"answer":"A","ref":"","exp":"2026 年 11 月 2 日，以「向新而行 绿动未来」为主题的第七届新型电力系统国际论坛暨第二十二届中国南方电网国际技术论坛在海南海口开幕，论坛上发布《南方电网推进「六网」协同发展白皮书》及「大瓦特」新一代人工智能创新平台等成果。8 月是「五个一批」提出时间，9 月是电碳算三份专项文件与数博会相关报道时间。","source":"新华网 2026-11-03、中国新闻网广东 2026-11-02、中国日报网海南 2026-11-02","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS56","bank":"mock","no":26,"type":"single","typeName":"单选题","topic":"六网协同","scope":"2026 下半年专题","q":"按白皮书「1611」工作思路，国土空间「一张图」主要用于（ ）。","options":[{"k":"A","v":"统筹「六张网」规划建设，强化土地、能源等要素共享共用"},{"k":"B","v":"统一核定全网销售电价"},{"k":"C","v":"替代企业数据中台的技术底座"},{"k":"D","v":"统计五省区新能源装机数据"}],"answer":"A","ref":"","exp":"「1611」即以国土空间「1」张图统筹「六张网」规划建设、打造「1」批综合场景、夯实「1」个技术底座（「6」对应六张网），目的是打通跨行业规划壁垒、实现通道/杆塔/管廊/站址资源共享。B、C、D 均与规划统筹无关。","source":"中国新闻网广东 2026-11-02；新华网广东 2026-11-02","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS57","bank":"mock","no":27,"type":"single","typeName":"单选题","topic":"六网协同","scope":"2026 下半年专题","q":"依据白皮书，电网向多网输出的四大能力是（ ）。","options":[{"k":"A","v":"广泛连接、绿色电力、数字感知、标准验证"},{"k":"B","v":"电价定价、电量计量、设备制造、金融结算"},{"k":"C","v":"特高压输电、抽蓄调峰、直流组网、继电保护"},{"k":"D","v":"数据交易、算力租赁、碳资产核算、物流配送"}],"answer":"A","ref":"","exp":"白皮书提出坚持「以电联通多网、以电赋能多网、以电测控多网、以电中试多网」，向外输出广泛连接、绿色电力、数字感知、标准验证四大能力。B/C 属于传统电网业务能力，D 是衍生服务而非白皮书概括的四大输出能力。","source":"《南方电网推进「六网」协同发展白皮书》，新华网/中国日报网 2026-11-02","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS58","bank":"mock","no":28,"type":"single","typeName":"单选题","topic":"六网协同","scope":"2026 下半年专题","q":"南方电网「14511」六网协同推进体系中，系统发挥的「四大效应」是（ ）。","options":[{"k":"A","v":"以电联通、以电赋能、以电测控、以电中试多网"},{"k":"B","v":"以电代煤、以电代油、以电代气、以电代柴"},{"k":"C","v":"源网荷储、多能互补、供需协同、灵活智能"},{"k":"D","v":"规划协同、建设协同、调度协同、交易协同"}],"answer":"A","ref":"","exp":"四大效应概括了电网作为协同枢纽的独特作用：联网（连接）、赋能（绿电与能源）、测控（全域感知）、中试（标准验证）。C 是新型电力系统特征/运行要求，D 是电碳算协同的四个维度。","source":"南方电网公司官网 2026-08-18","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS59","bank":"mock","no":29,"type":"single","typeName":"单选题","topic":"六网协同","scope":"2026 下半年专题","q":"《中国能源报》2026 年 9 月刊文提出「四流耦合」，其中作为跨网互联核心纽带、破除信息孤岛的是（ ）。","options":[{"k":"A","v":"数据流"},{"k":"B","v":"能量流"},{"k":"C","v":"算力流"},{"k":"D","v":"物质流"}],"answer":"A","ref":"","exp":"四流耦合中：能量流是基础运行保障，数据流是跨网互联的核心纽带、破除信息孤岛，算力流是系统优化的引擎、实现动态调度，物质流是实体运行载体、保障产业链供应链稳定。故破除信息孤岛对应数据流。","source":"《中国能源报》2026-09-07 第 04 版，南方电网数字化部副总经理禤亮《「六网」协同推动电算价值共创》","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS60","bank":"mock","no":30,"type":"single","typeName":"单选题","topic":"六网协同","scope":"2026 下半年专题","q":"广州 220 千伏棠下变电站「多站合一」示范工程公开报道的成效是（ ）。","options":[{"k":"A","v":"集成变电站、数据中心、光伏、储能、充电、5G 及北斗基站等功能，节约用地约 30%—40%、降低综合成本约 10%—20%"},{"k":"B","v":"完全取消变电站，改建为纯数据中心"},{"k":"C","v":"把供电可靠性提升至 100%，不再需要检修"},{"k":"D","v":"实现全市物流车辆无人化调度"}],"answer":"A","ref":"","exp":"「多站合一、多杆合一」是集约建设模式，通过一站多用盘活电网存量站址资源，公开报道给出的量化成效为节约用地 30%—40%、降低综合成本 10%—20%。B/C/D 均为夸大或无依据表述。","source":"南方电网公司官网 2026-08-18；棠下「多站合一」入选零碳中国标准试点","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS61","bank":"mock","no":31,"type":"single","typeName":"单选题","topic":"电碳算协同","scope":"2026 下半年专题","q":"2026 年 9 月南方电网密集印发的三份电碳算专项文件中，聚焦市场运行、创新交易场景的是（ ）。","options":[{"k":"A","v":"《电碳算协同市场体系建设方案》"},{"k":"B","v":"《电碳算协同行动计划实施方案》"},{"k":"C","v":"《电碳算产业发展推进实施方案》"},{"k":"D","v":"《企业数据资源相关会计处理暂行规定》"}],"answer":"A","ref":"","exp":"三份方案形成「顶层规划、产业培育、市场运行」三位一体：行动计划实施方案统筹技术、基建、示范工程全链条；产业发展推进实施方案聚焦算力运营、电碳服务、装备研发培育产业集群；市场体系建设方案创新三类交易场景、搭建要素市场化配置平台。D 是财政部文件，与电碳算无关。","source":"《南方电网报》《电碳算融合筑新基 能源数智开新局》2026-09-01","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS62","bank":"mock","no":32,"type":"single","typeName":"单选题","topic":"电碳算协同","scope":"2026 下半年专题","q":"南方电网建成的国内首个行业级电碳算一体化协同运营系统，把碳排放量测算精度（ ）。","options":[{"k":"A","v":"从月度级压缩至分钟级"},{"k":"B","v":"从年度级压缩至季度级"},{"k":"C","v":"从日级压缩至小时级"},{"k":"D","v":"没有变化，仍为月度级"}],"answer":"A","ref":"","exp":"该系统打通电力运行、碳排放监测、算力负荷调度之间的数据壁垒，将碳排放量测算精度从月度级压缩至分钟级，以电价、绿电、电碳因子等信息引导算力任务编排调度，已在广东、广西、云南、贵州、海南五省区规模化落地。","source":"《南方电网报》《电力AI自主创未来 电碳算协同筑底座》2026-07-21","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS63","bank":"mock","no":33,"type":"single","typeName":"单选题","topic":"人工智能+与电力大模型","scope":"2026 下半年专题","q":"《公司推动「人工智能+」高质量发展行动意见》部署的七项重点任务是（ ）。","options":[{"k":"A","v":"算力筑基、模型领航、数据汇源、场景闭环、安全为底、人才固本、生态聚力"},{"k":"B","v":"规划协同、建设协同、调度协同、交易协同、安全协同、人才协同、生态协同"},{"k":"C","v":"研究一批、实施一批、前期一批、储备一批、谋划一批、验收一批、推广一批"},{"k":"D","v":"数据供给、模型研发、算力整合、场景贡献、生态运营、市场交易、国际合作"}],"answer":"A","ref":"","exp":"《意见》确立模型研发、数据供给、算力整合、场景贡献、生态运营「五方」核心定位（对应 D 的前五项），并部署算力筑基、模型领航、数据汇源、场景闭环、安全为底、人才固本、生态聚力七项重点任务。B 是电碳算四维协同的扩展，C 是六网协同「五个一批」的变形。","source":"南方电网公司官网《南方电网印发「人工智能+」高质量发展行动意见》2026-08-21","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS64","bank":"mock","no":34,"type":"single","typeName":"单选题","topic":"人工智能+与电力大模型","scope":"2026 下半年专题","q":"关于「大瓦特」系列模型，下列表述正确的是（ ）。","options":[{"k":"A","v":"「大瓦特—多模态 2.0」是电力行业首款通过中国信通院工业大模型成熟度评测的行业专属大模型"},{"k":"B","v":"「大瓦特」是通用聊天大模型，不涉及电力专业机理"},{"k":"C","v":"「大瓦特·云睿」是面向居民的电费账单查询机器人"},{"k":"D","v":"「天权」是新一代电力多模态大模型"}],"answer":"A","ref":"","exp":"「大瓦特—多模态 2.0」融合文本、设备图像、时序负荷、电网拓扑等多源数据，内嵌电网安全规程与设备机理，设备缺陷识别准确率超 90%、现场违章识别超 80%。「大瓦特·云睿」是 AI 原生配电网规划智能体（获 2026 人工智能向善全球峰会优秀案例奖），「天权」是全自主可控电力求解器，均非 C/D 所述。","source":"《南方电网报》2026-07-21；新华网/中国日报网 2026-11-02","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS65","bank":"mock","no":35,"type":"single","typeName":"单选题","topic":"可信数据空间与数据要素","scope":"2026 下半年专题","q":"南方能源行业可信数据空间实现「可用不可见、可控可计量」主要依托（ ）。","options":[{"k":"A","v":"数据沙箱隔离、全流程流通管控，配套身份认证、合约履约与日志存证"},{"k":"B","v":"把各方原始数据集中到统一数据库后开放查询"},{"k":"C","v":"仅依靠签署纸质保密协议"},{"k":"D","v":"将所有数据脱敏后公开发布"}],"answer":"A","ref":"","exp":"该空间在身份认证、数据发布发现、合约履约、日志存证、安全管控等核心环节达到国家 年专题","q":"据 2026 年 7 月公开报道，南方能源行业可信数据空间的建设成效包括（ ）。","options":[{"k":"A","v":"通过中国信通院首批可信数据空间可信能力测评，跻身全国首批获认证的行业级可信数据空间"},{"k":"B","v":"2024 年启动建设、2025 年上线运行，2026 年进入全域互联互通成熟运营阶段"},{"k":"C","v":"集聚 580 余家生态合作主体、落地 62 个能源数字化应用场景、上架 340 余款能源数据产品"},{"k":"D","v":"入选国家数据局可信数据空间创新发展试点、国家数据基础设施第二批先行先试项目"},{"k":"E","v":"已实现能源数据无需授权即可向境外自由流动"}],"answer":"ABCD","ref":"","exp":"前四项均为公开报道事实。E 错误：数据跨境须遵守《数据安全法》《个人信息保护法》《促进和规范数据跨境流动规定》等，可信数据空间提供的是合规可控的流通底座，不等于自由出境。","source":"南方电网公司官网 2026-07-28；《中国能源报》2026-09-07","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XM73","bank":"mock","no":19,"type":"multi","typeName":"不定项选择题","topic":"竞赛背景与考试说明","scope":"2026 下半年专题","q":"《技能竞赛理论考试题目征集说明表》列明的考核范围包括（ ）。","options":[{"k":"A","v":"公司经营管理、生产运行、新兴业务等"},{"k":"B","v":"国家数字经济、数据要素、大数据战略及政策等"},{"k":"C","v":"公司主要战略、数字化转型、数字化相关制度、数据资产管理、数据治理、数据应用、数据安全"},{"k":"D","v":"技术标准、人工智能、新一代信息技术等"},{"k":"E","v":"仅考核 SQL 与编程实操"}],"answer":"ABCD","ref":"","exp":"征集说明用「包括但不限于」列出了上述四大类范围，覆盖战略—制度—治理—安全—技术—AI 全链条。E 错误：理论笔试为综合性业务与政策考核，编程实操并非征集说明列明的考核范围。","source":"《2、理论业务考试笔试题库（参考版）》sheet「理论考试考题征集说明」","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XM74","bank":"mock","no":20,"type":"multi","typeName":"不定项选择题","topic":"电碳算协同","scope":"2026 下半年专题","q":"支撑「算力跟着绿电走」的关键机制包括（ ）。","options":[{"k":"A","v":"以电价、绿电消纳、碳成本等信号引导算力任务跨地域、跨时段迁移"},{"k":"B","v":"建设电碳算协同运营系统，开展算力负荷预测与电算映射建模"},{"k":"C","v":"把数据中心、通信基站等算力负荷作为柔性资源参与需求响应与虚拟电厂"},{"k":"D","v":"新能源富集区域就地消纳富余绿电，配套移动算力车等灵活部署方式"},{"k":"E","v":"要求每个算力中心自建燃煤备用电源以保障供电"}],"answer":"ABCD","ref":"","exp":"前四项分别对应调度信号、系统平台、负荷侧互动与就地消纳，是电碳算协同的核心机制。公开披露算力负荷预测准确率超 90%，非实时任务转移后用能综合成本下降 48%。E 与绿色低碳方向相悖，实际做法是创新新型储能共享备用电设计替代传统柴发。","source":"《南方电网报》2026-07-21、2026-09-01；人民网贵州频道《「瓦特」与「比特」如何融合》2026-08-28","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XJ75","bank":"mock","no":13,"type":"judge","typeName":"判断题","topic":"六网协同","scope":"2026 下半年专题","q":"「六网」协同的本质是多张网络的功能简单叠加，追求「1+1=2」的物理累加。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。官方表述强调「协同绝非简单功能叠加」，本质是把能源、数据、算力等要素跨网优化配置，破除信息孤岛，实现「1+1\u003e2」的协同倍增效应与价值逻辑重构。","source":"《中国能源报》2026-09-07；《在协同发展中拓展新空间》2026-08-18","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XJ76","bank":"mock","no":14,"type":"judge","typeName":"判断题","topic":"电碳算协同","scope":"2026 下半年专题","q":"2026 年，「算电协同」首次写入《政府工作报告》，上升为国家战略层面的新基建方向。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。报道明确指出今年「算电协同」首次写入《政府工作报告》，与超大规模智算集群等共同构成新基建部署，是南网推进电碳算协同的重要政策背景。","source":"《南方电网报》2026-07-21","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XJ77","bank":"mock","no":15,"type":"judge","typeName":"判断题","topic":"六网协同","scope":"2026 下半年专题","q":"南方电网计划 2026 年底完成「六网」协同顶层设计和首批示范布局，2027 年底推动从示范探索转向规模复制，2030 年基本建成覆盖南方五省区重点城市、重点园区、重点产业集群的协同服务体系。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。这是「五个一批」推进体系公开的三级时间表；「十五五」时期被定位为由示范试点迈向规模复制、由单点突破走向系统集成的关键窗口期。","source":"南方电网公司官网 2026-08-18","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XJ78","bank":"mock","no":16,"type":"judge","typeName":"判断题","topic":"电碳算协同","scope":"2026 下半年专题","q":"电碳算一体化协同运营系统已在广东、广西、云南、贵州、海南五省区规模化落地。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。系统打通电力运行、碳排放监测与算力负荷调度的数据壁垒，在南方五省区规模化落地，提升算力负荷绿电供给占比，支撑「东数西算」与西电东送清洁电力通道协同。","source":"《南方电网报》2026-07-21","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XJ79","bank":"mock","no":17,"type":"judge","typeName":"判断题","topic":"人工智能+与电力大模型","scope":"2026 下半年专题","q":"《公司推动「人工智能+」高质量发展行动意见》提出，到 2028 年标准化 AI 应用场景建设不少于 800 个，新一代智能终端及智能体应用普及率超过 80%。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。《意见》同时提出到 2028 年建成完备的电力 AI 数据知识底座、迭代形成「大瓦特」电力科学计算与具身智能模型矩阵、搭建一体化 AI 平台，并高标准建设运营国家人工智能应用中试基地。","source":"南方电网公司官网 2026-08-21","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XJ80","bank":"mock","no":18,"type":"judge","typeName":"判断题","topic":"竞赛背景与考试说明","scope":"2026 下半年专题","q":"依据征集说明，本次理论笔试中不定项选择题共 20 题、每题 1.5 分，合计 30 分。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。不定项 20 题×1.5 分 = 30 分，是客观题中单题分值最高的题型；漏选、多选均不得分，备考时应重点训练「全选/部分选」的判断依据。","source":"《2、理论业务考试笔试题库（参考版）》sheet「理论考试考题征集说明」","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XJ81","bank":"mock","no":19,"type":"judge","typeName":"判断题","topic":"重大新闻与成果","scope":"2026 下半年专题","q":"世界数据组织能源专业委员会于 2026 年 11 月海口论坛揭牌，其宗旨包括推动能源数据可信流通、行业标准共建与成果价值转化。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。该委员会以推动能源数据国际合作、助力全球能源数智化转型、赋能能源普惠发展为宗旨，锚定释放能源数据要素价值主线，构建多层次广覆盖的能源数据合作生态。","source":"中国日报网海南 2026-11-02、新华网 2026-11-03","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XJ82","bank":"mock","no":20,"type":"judge","typeName":"判断题","topic":"六网协同","scope":"2026 下半年专题","q":"在「六网」协同中，电网只承担向其他五网供电的角色，不输出数字感知与标准验证能力。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。白皮书明确电网向外输出广泛连接、绿色电力、数字感知、标准验证四大能力，依托全域感知网络与电鸿生态赋能多网物联需求，并提供中试验证环境，远不止「供电」。","source":"《南方电网推进「六网」协同发展白皮书》，新华网 2026-11-03","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS83","bank":"mock","no":7,"type":"short","typeName":"简答题","topic":"六网协同","scope":"2026 下半年专题","q":"简述「六网」协同提出的背景与内涵，说明南方电网推进该战略的四大效应（或白皮书四大能力输出）、「五个一批」抓手与时间表。","options":[],"answer":"","ref":"（1）背景与内涵：党中央、国务院立足「十五五」开局，部署统筹推进水网、新型电网、算力网、新一代通信网、城市地下管网、物流网「六张网」建设。单一网络沿原路径扩张的边际效益递减，跨网协同可推动资源、功能、数据在跨网间自由流通与优化配置，释放「1+1\u003e2」的协同倍增效应；其本质不是多网相加，而是价值逻辑重构。（2）四大效应 / 四大能力：以电联通多网、以电赋能多网、以电测控多网、以电中试多网；对应向外输出广泛连接、绿色电力、数字感知、标准验证四大能力。可补充「四流耦合」：能量流为基础保障、数据流为跨网互联纽带、算力流为优化引擎、物质流为实体载体。（3）推进抓手：2026 年 8 月提出「五个一批」——研究一批、实施一批、前期一批、储备一批、谋划一批；配套「14511」推进体系（国土空间规划统筹、四大效应、重点场景、统一数字底座、一批多站合一与城市级试点）与「1611」思路（国土空间一张图统筹六张网规划建设、打造一批综合场景、夯实一个技术底座）。（4）时间表：2026 年底完成顶层设计和首批示范布局；2027 年底从示范探索转向规模复制；2030 年基本建成覆盖南方五省区重点城市、重点园区、重点产业集群的「六网」协同服务体系。（5）典型场景：水风光储算一体化、电碳算协同、多站合一、城市地下生命线、绿色物流能源设施、低空基础设施能源保障等。","exp":"答题按「背景 → 内涵 → 效应/能力 → 抓手 → 时间表 → 场景」六层展开，最容易得分的是六张网的准确名称、四大效应（四句「以电…多网」）、五个一批的五项内容、以及 2026/2027/2030 三级时间表。易错点：把「六网」写成电网内部六个层级、把「五个一批」与「七项重点任务」混淆、漏答 2030 年目标。","source":"南方电网公司官网 2026-08-18；《中国能源报》2026-09-07；《南方电网推进「六网」协同发展白皮书》（新华网/中国日报网 2026-11-02）","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS84","bank":"mock","no":8,"type":"short","typeName":"简答题","topic":"电碳算协同","scope":"2026 下半年专题","q":"简述南方电网 2026 年电碳算协同「三位一体」制度体系，以及「规划—建设—调度—交易」四维协同的主要做法与成效。","options":[],"answer":"","ref":"（1）制度体系：2026 年 9 月密集印发《电碳算协同行动计划实施方案》《电碳算产业发展推进实施方案》《电碳算协同市场体系建设方案》，形成顶层规划、产业培育、市场运行三位一体；确立「充裕、高效、清洁」三类瓦特匹配「规模、能效、绿色」三类比特，核心逻辑是「以电碳牵引算力、以算力赋能电网」，「十五五」按产业培育、产业壮大、生态引领三步走，按「单体数据中心—算力集群—区域算力网—全国一体化算力网」四级梯次推进。（2）规划协同：一体化统筹电力与算力基建，优化审批、预装电源配套，破解「算力等电」与重复投资，实现电算同频。（3）建设协同：盘活变电站等存量资源打造「多站合一」电算储新模式，整合算力、储能、北斗、充电等功能；以新型储能共享备用电替代传统柴发；推广移动算力车等灵活部署。（4）调度协同：建成国内首个行业级电碳算一体化协同运营系统，打通电力运行、碳排监测、算力负荷调度数据壁垒，碳排放测算精度由月度级压缩至分钟级；开发电算映射模型，算力负荷预测准确率超 90%，引导视频渲染等非实时算力任务跨地域、跨时段迁移至绿电富集低价区域，用能综合成本下降 48%；算力集群亦可作为柔性负荷参与需求响应。（5）交易协同：创新交易场景、搭建要素市场化配置平台，探索响应电价、绿电与碳成本的算力任务分配机制，发展绿电服务、碳减排、柔性负荷等商业模式。（6）落地成效：系统已在广东、广西、云南、贵州、海南五省区规模化落地，支撑「东数西算」「西电东送」与「算力跟着绿电走」。","exp":"评分要点在「三份文件名 + 三个定位」「四类瓦特/比特匹配」「四维协同各举 1—2 个做法」以及关键量化成效（分钟级、90%、48%、五省区）。易错点：把三份方案与「人工智能+」行动意见混淆、把「算电协同首次写入政府工作报告」的时间记错、只答技术不答市场机制。","source":"《南方电网报》2026-09-01、2026-07-21；《中国能源报》2026-09-07；人民网贵州频道 2026-08-28","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS85","bank":"mock","no":9,"type":"short","typeName":"简答题","topic":"人工智能+与电力大模型","scope":"2026 下半年专题","q":"结合《公司推动「人工智能+」高质量发展行动意见》，简述电力企业规模化落地「人工智能+」需要夯实的六方面能力，并说明对「电力数据智能应用」类竞赛的启示。","options":[],"answer":"","ref":"（1）顶层框架：《意见》（2026 年 8 月）确立模型研发、数据供给、算力整合、场景贡献、生态运营「五方」核心定位，部署算力筑基、模型领航、数据汇源、场景闭环、安全为底、人才固本、生态聚力七项重点任务；目标到 2028 年建成完备电力 AI 数据知识底座、形成「大瓦特」电力科学计算与具身智能模型矩阵、一体化 AI 平台，智能终端与智能体应用普及率超 80%、标准化 AI 应用场景不少于 800 个。（2）六方面能力：①算力——适度超前建设高可靠智算基础设施、统一算力资源池化调度、全链路国产算力适配；②模型——通用底座与专用模型协同（电力 NLP/CV/多模态、「派克工程」科学计算模型、具身智能），形成「算力底座—行业大模型—场景智能体—现场终端」全栈闭环；③数据——依托可信数据空间把电网运行、企业用电、碳排、气象等多源数据治理为高质量数据集，保障语料合法、分级分类、可追溯；④场景——以业务痛点牵引，覆盖规划、调度、生产、营销，形成可复制的标准化场景清单；⑤安全——模型与数据安全、内容可核验、关键业务人工复核、重要数据不出域；⑥人才与生态——复合型队伍、中试基地、产业链协同与标准共建。（3）对竞赛的启示：理论考试范围明确包含人工智能、新一代信息技术、数据治理与数据安全；备考不能只会算法名词，要能说清「数据—模型—算力—场景—安全」的闭环，并会用电力场景（设备缺陷识别、新能源功率预测、配电网规划智能体、智能客服、负荷预测）举例说明数据如何产生业务价值；同时应关注高质量数据集、标注安全、语料合规、幻觉治理与人工复核等合规要点。","exp":"按「顶层框架 → 六能力逐条展开 → 结合竞赛与电力场景举例」三段作答最稳。加分点：写出 2028 年两个量化目标、「五方」与「七项任务」的区分、以及「关键业务必须人工复核、高风险生产控制不得由生成式模型直接决策」这一安全底线。","source":"南方电网公司官网 2026-08-21；《南方电网报》2026-07-21；人民网贵州频道 2026-08-28；宣贯材料《理论考试考题征集说明》","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"XS86","bank":"mock","no":10,"type":"short","typeName":"简答题","topic":"竞赛背景与考试说明","scope":"2026 下半年专题","q":"结合本次「电力数据智能应用技能竞赛」理论考试征集说明，说明备考应重点覆盖的知识板块，并举例阐述「数据智能应用」在电力业务中的落地场景与价值。","options":[],"answer":"","ref":"（1）考试结构：单选 40 题×1 分（40 分）、不定项 20 题×1.5 分（30 分）、判断 10 题×1 分（10 分）、简答 2 题×10 分（20 分），合计 100 分；客观题占 80 分，简答重在要点分层与依据准确。（2）考核范围（「包括但不限于」）：①公司经营管理、生产运行、新兴业务；②国家数字经济、数据要素、大数据战略及政策（数据二十条、数据要素×、数字中国、公共数据授权运营、数据资产入表、数据出境与安全法规）；③公司主要战略、数字化转型、数字化相关制度、数据资产管理、数据治理、数据应用、数据安全、技术标准（DCMM、GB/T 43697 分类分级、可信数据空间、高质量数据集）；④人工智能与新一代信息技术（大模型/RAG、隐私计算、数字孪生、物联网与边缘计算、云计算）。⑤近半年公司重大部署：六网协同与白皮书、电碳算协同三份方案、「人工智能+」行动意见、南方能源行业可信数据空间通过首批可信能力测评等。（3）落地场景举例：①生产运行——设备缺陷识别、状态检修、新能源功率预测与负荷预测、配电网规划智能体「云睿」；②经营管理——电力看经济、台区线损治理、反窃电、供应链优化；③新兴业务与双碳——电碳算协同、电碳服务与碳排画像、虚拟电厂与需求响应、绿电溯源、充电桩智能选址、电力气象；④客户服务——智能客服、能效诊断与综合用能管家「小赫兹」。（4）价值与边界：以数据要素放大、叠加、倍增效应降本增效、提升供电可靠性与新能源消纳；但所有场景须落实分类分级、最小必要、授权脱敏、可追溯审计，重要/核心数据不得违规出域或出境，关键业务结论须人工复核。","exp":"答题务必先写准分值结构（很多考生漏掉不定项 1.5 分/题），再按四大类范围列举知识点，最后用「数据 + 场景 + 价值 + 合规边界」四要素写场景。把近半年公司重大部署（六网协同、电碳算、人工智能+、可信数据空间）写进答案，能明显体现对竞赛背景的掌握。","source":"宣贯材料《技能竞赛理论考试题目征集说明表》；南方电网公司官网 2026-07 至 2026-11 公开报道","tip":"时政专题：依据 2026 年下半年公开报道整理，具体数据与表述以公司官方最新发布为准。","dup":"","batch":"news2026h2"},{"id":"LAGGS01","bank":"legacy","no":1,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"2024 年 8 月，国家发展改革委、国家能源局等部门联合印发《加快构建新型电力系统行动方案（2024—2027 年）》。其中提出的新型电力系统基本特征不包括（　）。","options":[{"k":"A","v":"清洁低碳"},{"k":"B","v":"安全充裕"},{"k":"C","v":"经济高效"},{"k":"D","v":"集中统一"}],"answer":"D","ref":"","exp":"新型电力系统的基本特征为“清洁低碳、安全充裕、经济高效、供需协同、灵活智能”，共五个方面，不包括“集中统一”。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LAGGS02","bank":"legacy","no":2,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"《关于构建数据基础制度更好发挥数据要素作用的意见》（“数据二十条”）提出的数据产权结构性分置制度是（　）。","options":[{"k":"A","v":"数据所有权、使用权、收益权“三权分置”"},{"k":"B","v":"数据资源持有权、数据加工使用权、数据产品经营权“三权分置”"},{"k":"C","v":"数据采集权、存储权、处分权“三权分置”"},{"k":"D","v":"数据公有权、经营权、监管权“三权分置”"}],"answer":"B","ref":"","exp":"“数据二十条”明确建立数据资源持有权、数据加工使用权、数据产品经营权等分置的产权运行机制，即通常所说的“三权分置”，淡化所有权、强调使用权。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LAGGS03","bank":"legacy","no":3,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"财政部《企业数据资源相关会计处理暂行规定》自（　）起施行，标志着数据资源“入表”进入实操阶段。","options":[{"k":"A","v":"2021 年 1 月 1 日"},{"k":"B","v":"2022 年 1 月 1 日"},{"k":"C","v":"2024 年 1 月 1 日"},{"k":"D","v":"2025 年 1 月 1 日"}],"answer":"C","ref":"","exp":"该规定 2023 年 8 月发布，自 2024 年 1 月 1 日起施行，明确企业数据资源可按无形资产、存货等科目进行会计处理，是数据资产化的重要制度基础。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LAGGS04","bank":"legacy","no":4,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"数据从原始形态到成为生产要素的演进路径，通常概括为（　）。","options":[{"k":"A","v":"资源化 → 资产化 → 价值化"},{"k":"B","v":"采集 → 存储 → 分析"},{"k":"C","v":"标准化 → 规范化 → 制度化"},{"k":"D","v":"数字化 → 网络化 → 智能化"}],"answer":"A","ref":"","exp":"资源化解决“有没有、好不好用”，资产化解决“算不算资产、值多少钱”，价值化解决“如何通过场景应用产生经济与社会效益”，三者层层递进。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LAGGS05","bank":"legacy","no":5,"type":"single","topic":"数据治理与标准","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"《数据管理能力成熟度评估模型》（DCMM）的国家标准编号是（　）。","options":[{"k":"A","v":"GB/T 36073-2018"},{"k":"B","v":"GB/T 37988-2019"},{"k":"C","v":"GB/T 22239-2019"},{"k":"D","v":"GB/T 43697-2024"}],"answer":"A","ref":"","exp":"DCMM 为 GB/T 36073-2018；GB/T 37988-2019 是 DSMM（数据安全能力成熟度模型）；GB/T 22239-2019 是网络安全等级保护基本要求；GB/T 43697-2024 是数据分类分级规则。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LAGGS06","bank":"legacy","no":6,"type":"single","topic":"数据安全与合规","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"电力监控系统安全防护的总体原则（俗称“十六字方针”）是（　）。","options":[{"k":"A","v":"安全分区、网络专用、横向隔离、纵向认证"},{"k":"B","v":"分区防御、纵深防护、动态感知、主动免疫"},{"k":"C","v":"分级保护、分域防护、统一管理、重点保障"},{"k":"D","v":"物理隔离、逻辑隔离、边界防护、终端管控"}],"answer":"A","ref":"","exp":"依据《电力监控系统安全防护规定》，坚持“安全分区、网络专用、横向隔离、纵向认证”，生产控制大区与管理信息大区之间须部署正、反向物理隔离装置。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LAGGS07","bank":"legacy","no":7,"type":"single","topic":"数据安全与合规","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"根据《数据安全法》，关系国家安全、国民经济命脉、重要民生、重大公共利益等数据，属于（　）。","options":[{"k":"A","v":"一般数据"},{"k":"B","v":"重要数据"},{"k":"C","v":"国家核心数据"},{"k":"D","v":"个人敏感信息"}],"answer":"C","ref":"","exp":"《数据安全法》第二十一条规定，关系国家安全、国民经济命脉、重要民生、重大公共利益等数据属于国家核心数据，实行更加严格的管理制度。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LAGGS08","bank":"legacy","no":8,"type":"single","topic":"数据安全与合规","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"按网络安全等级保护 2.0 要求，电力调度控制类系统通常应达到的保护等级为（　）。","options":[{"k":"A","v":"第一级"},{"k":"B","v":"第二级"},{"k":"C","v":"第三级及以上"},{"k":"D","v":"不做要求"}],"answer":"C","ref":"","exp":"电力生产控制类系统涉及公共利益与社会秩序，通常不低于第三级；纳入关键信息基础设施的还须按《关键信息基础设施安全保护条例》实行重点保护。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LAGGS09","bank":"legacy","no":9,"type":"single","topic":"数据治理与标准","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"电网企业推进企业级数据治理，负责统筹决策定位、标准审定与跨部门协调的顶层组织通常是（　）。","options":[{"k":"A","v":"数据治理委员会（数据管理委员会）"},{"k":"B","v":"变电运维班组"},{"k":"C","v":"内部审计部门"},{"k":"D","v":"物资采购中心"}],"answer":"A","ref":"","exp":"数据治理需要“一把手工程”式的顶层组织保障，一般设立数据治理委员会作为决策层，下设数据管理归口部门与各业务域数据责任人，形成“决策—管理—执行”三级架构。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LAGGS10","bank":"legacy","no":10,"type":"single","topic":"数据治理与标准","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"衡量数据质量时，“同一指标在不同系统、不同报表中取值应当相同”属于数据质量的（　）维度。","options":[{"k":"A","v":"完整性"},{"k":"B","v":"一致性"},{"k":"C","v":"及时性"},{"k":"D","v":"唯一性"}],"answer":"B","ref":"","exp":"一致性指数据在跨系统、跨表、跨时点之间不存在矛盾；完整性强凋记录与字段不缺失；及时性强调数据在需要时可获得且时效满足要求。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LAGGS11","bank":"legacy","no":11,"type":"single","topic":"数据治理与标准","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"对变电站、线路、台区、计量点等对象建立统一编码和唯一标识，属于（　）管理的范畴。","options":[{"k":"A","v":"主数据管理"},{"k":"B","v":"元数据管理"},{"k":"C","v":"数据血缘管理"},{"k":"D","v":"数据脱敏管理"}],"answer":"A","ref":"","exp":"主数据是跨系统共享、相对稳定、标识业务实体的核心数据（如设备、客户、组织），统一编码是主数据管理的核心内容，是跨专业数据贯通的前提。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LAGGS12","bank":"legacy","no":12,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"新能源大规模接入背景下，电力系统的“双高”特征是指（　）。","options":[{"k":"A","v":"高电压等级、高负荷密度"},{"k":"B","v":"高比例新能源、高比例电力电子设备"},{"k":"C","v":"高电价水平、高运营成本"},{"k":"D","v":"高供电可靠性、高自动化水平"}],"answer":"B","ref":"","exp":"“双高”即高比例可再生能源、高比例电力电子设备，带来惯量下降、抗扰动能力减弱、宽频振荡等新型稳定问题，需要源网荷储协同与新型调度体系支撑。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LAGGS13","bank":"legacy","no":13,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"在“原始数据不出域”的前提下实现多方联合训练模型，最典型的技术路线是（　）。","options":[{"k":"A","v":"建设集中式数据仓库"},{"k":"B","v":"ETL 数据抽取汇聚"},{"k":"C","v":"联邦学习"},{"k":"D","v":"数据可视化分析"}],"answer":"C","ref":"","exp":"联邦学习通过“数据不动模型动”，各方在本地训练、仅交换模型参数或梯度，配合安全聚合可进一步防止参数泄露，是跨主体数据可信流通的主流技术之一。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LAGGS14","bank":"legacy","no":14,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"电力需求响应的本质是（　）。","options":[{"k":"A","v":"新增发电装机容量"},{"k":"B","v":"通过价格信号或激励补偿引导用户调整用电行为，实现削峰填谷"},{"k":"C","v":"对用户实施拉闸限电"},{"k":"D","v":"建设抽水蓄能电站"}],"answer":"B","ref":"","exp":"需求响应是需求侧资源参与电力平衡的市场化手段，通过分时电价、可中断负荷补偿等机制引导用户主动改变用电时序与用量，属于“源网荷储”中的“荷”侧调节。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LAGGS15","bank":"legacy","no":15,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"“数据要素×”三年行动计划（2024—2026 年）的核心部署是（　）。","options":[{"k":"A","v":"在 12 个重点行业和领域推动数据要素高水平应用、释放数据要素乘数效应"},{"k":"B","v":"全面建设全国统一电力市场"},{"k":"C","v":"大规模推进特高压输电通道建设"},{"k":"D","v":"全面推行居民阶梯电价"}],"answer":"A","ref":"","exp":"该行动计划由国家数据局等 17 部门联合印发，选取工业制造、现代农业、商贸流通、交通运输、金融服务、科技创新、文化旅游、医疗健康、应急管理、气象服务、城市治理、绿色低碳等 12 个领域重点突破。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LAGGM01","bank":"legacy","no":1,"type":"multi","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"构建新型电力系统的关键举措包括（　）。","options":[{"k":"A","v":"大规模开发利用新能源，推动能源结构转型"},{"k":"B","v":"提升系统调节能力，发展抽水蓄能与新型储能"},{"k":"C","v":"建设智慧化调度体系，提升源网荷储协同互动水平"},{"k":"D","v":"推动新能源、配电网、微电网等领域的示范工程建设"}],"answer":"ABCD","ref":"","exp":"四项均为《加快构建新型电力系统行动方案（2024—2027 年）》部署的重点方向，核心是提升系统的绿色化、柔性化与智能化水平。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LAGGM02","bank":"legacy","no":2,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"“数据二十条”确立的数据产权“三权分置”具体指（　）。","options":[{"k":"A","v":"数据资源持有权"},{"k":"B","v":"数据加工使用权"},{"k":"C","v":"数据产品经营权"},{"k":"D","v":"数据绝对所有权"}],"answer":"ABC","ref":"","exp":"“三权分置”强调淡化所有权、强化使用权，通过持有权、加工使用权、产品经营权分置，解决数据“确权难、流通难”问题。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LAGGM03","bank":"legacy","no":3,"type":"multi","topic":"数据安全与合规","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"电力企业开展数据安全合规工作，需要遵循的法律法规与制度包括（　）。","options":[{"k":"A","v":"《中华人民共和国网络安全法》"},{"k":"B","v":"《中华人民共和国数据安全法》"},{"k":"C","v":"《中华人民共和国个人信息保护法》"},{"k":"D","v":"《关键信息基础设施安全保护条例》"}],"answer":"ABCD","ref":"","exp":"上述构成我国数据合规的基础法律框架，此外还需遵循《电力监控系统安全防护规定》《电力行业网络安全管理办法》及数据分类分级相关标准。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LAGGM04","bank":"legacy","no":4,"type":"multi","topic":"数据安全与合规","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"关于电力数据分类分级，下列说法正确的有（　）。","options":[{"k":"A","v":"应依据国家数据分类分级规则及电力行业相关要求开展"},{"k":"B","v":"涉及用户个人信息的数据应单独识别并采取更严格的保护措施"},{"k":"C","v":"重要数据目录由企业自行确定，无须向主管部门报备"},{"k":"D","v":"分类分级结果应随业务变化和政策要求动态调整"}],"answer":"ABD","ref":"","exp":"C 项错误。重要数据目录需按规定向行业主管部门报送或备案，并接受监管；分类分级不是一次性工作，需建立动态更新机制。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LAGGM05","bank":"legacy","no":5,"type":"multi","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"构建高质量数据集必须完成的环节包括（　）。","options":[{"k":"A","v":"明确业务目标、标注规范与验收标准"},{"k":"B","v":"开展数据清洗、去重、缺失值处理与一致性校验"},{"k":"C","v":"建立数据血缘、版本管理与可追溯机制"},{"k":"D","v":"不以场景需求为导向，单纯追求数据规模最大化"}],"answer":"ABC","ref":"","exp":"D 项错误。高质量不等于大规模，脱离场景的“堆数据”会引入噪声、抬高成本，反而降低数据集可用性。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LAGGM06","bank":"legacy","no":6,"type":"multi","topic":"数据治理与标准","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"企业数据治理体系的典型内容构成包括（　）。","options":[{"k":"A","v":"数据战略、数据架构与数据标准"},{"k":"B","v":"数据质量度量、监控与持续改进"},{"k":"C","v":"元数据、主数据与数据血缘管理"},{"k":"D","v":"数据安全分级、权限管控与审计"}],"answer":"ABCD","ref":"","exp":"参照 DCMM 的八个能力域（数据战略、数据治理、数据架构、数据应用、数据安全、数据质量、数据标准、数据生存周期），上述均属核心内容。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LAGGM07","bank":"legacy","no":7,"type":"multi","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"关于虚拟电厂，说法正确的有（　）。","options":[{"k":"A","v":"聚合可调节负荷、分布式电源、用户侧储能等分散资源参与电网互动"},{"k":"B","v":"可参与需求响应、辅助服务市场及现货市场交易"},{"k":"C","v":"必须自建大型发电机组才能运行"},{"k":"D","v":"依赖高级量测、通信网络与聚合调控平台的支撑"}],"answer":"ABD","ref":"","exp":"C 项错误。虚拟电厂的本质是“资源的聚合与优化调控”，不依赖自建机组，其核心能力在于感知、预测、聚合与指令分解执行。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LAGGM08","bank":"legacy","no":8,"type":"multi","topic":"可信数据空间与隐私计算","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"可信数据空间的主要特征包括（　）。","options":[{"k":"A","v":"多方主体共同参与、共建共治"},{"k":"B","v":"基于共识规则与技术手段实现数据“可用不可见、可控可计量”"},{"k":"C","v":"通过身份互认、访问控制与审计实现主体间互信"},{"k":"D","v":"要求所有参与方数据必须集中存储到同一平台"}],"answer":"ABC","ref":"","exp":"D 项错误。可信数据空间强调“分布式”而非集中汇聚，通过规则+技术实现跨主体数据的安全流通与价值共创。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LAGGJ01","bank":"legacy","no":1,"type":"judge","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"在新型电力系统建设进程中，新能源将逐步成为装机主体和电量主体。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。这是新型电力系统“清洁低碳”特征的核心体现，也是系统形态与运行机理发生深刻变化的根本原因。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LAGGJ02","bank":"legacy","no":2,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据只要完成确权登记，就一定能够实现资产入表。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。入表须同时满足会计准则关于资产确认的条件（由过去交易形成、企业拥有或控制、很可能带来经济利益流入、成本能可靠计量），确权只是前提之一。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LAGGJ03","bank":"legacy","no":3,"type":"judge","topic":"数据安全与合规","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"电力监控系统生产控制大区与管理信息大区之间必须部署正向和反向物理隔离装置。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。这是“横向隔离”的强制要求，用以阻断来自管理信息大区乃至互联网方向的攻击渗透路径。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LAGGJ04","bank":"legacy","no":4,"type":"judge","topic":"数据安全与合规","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据经过脱敏处理后，就一定不再属于个人信息，可以自由使用。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。脱敏数据仍存在通过关联、碰撞实现重标识的风险，尤其是高维数据；是否属于个人信息应按“可识别性”实质判断，并履行相应合规义务。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LAGGJ05","bank":"legacy","no":5,"type":"judge","topic":"数据安全与合规","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"重要数据的处理者应当按照规定对其数据处理活动定期开展风险评估，并向有关主管部门报送风险评估报告。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。《数据安全法》第三十条对此有明确规定，风险评估应覆盖数据种类、数量、处理方式、风险隐患及应对措施等。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LAGGJ06","bank":"legacy","no":6,"type":"judge","topic":"数据安全与合规","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"个人信息向境外提供，须满足通过安全评估、个人信息保护认证或订立标准合同等法定条件之一。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。这是《个人信息保护法》第三十八条确立的出境路径；涉及重要数据或达到规定数量的，还必须申报数据出境安全评估。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LAGGJ07","bank":"legacy","no":7,"type":"judge","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"电力气象服务仅用于新能源发电功率预测，与电网调度运行、设备运维和用户侧服务无关。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。电力气象广泛应用于负荷预测、灾害预警（覆冰、舞动、山火、雷击）、输电通道监测、抢修复电决策及用户侧用能服务等全链条场景。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LAGGJ08","bank":"legacy","no":8,"type":"judge","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"“六网协同”强调以电网为纽带，推动电力与交通、通信、水务、燃气、热力等网络型基础设施的数据融合与协同运行。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。多网融合的本质是打通不同网络型基础设施的数据与业务壁垒，在规划、建设、运行、服务层面实现协同，是交能融合、产业融合的基础。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LAGGJ09","bank":"legacy","no":9,"type":"judge","topic":"数据治理与标准","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据质量提升主要依靠技术工具即可完成，不需要业务部门深度参与。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。数据质量问题大多源于业务规则不清、录入不规范、流程断点，必须由业务部门定义标准、确认口径并承担源头治理责任，技术只是支撑手段。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LAGGE01","bank":"legacy","no":1,"type":"short","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·通用","paper":"卷一（综合基础卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"四、简答题","q":"结合“数据资源化—资产化—价值化”的演进路径，阐述电力企业推进数据要素价值释放面临的主要障碍，并提出相应解决措施。（10 分）","options":[],"answer":"","ref":"答题要点（分三层作答，每层“障碍+措施”对应得分）：\n① 资源化层：障碍——数据源分散、标准不一、口径冲突，历史数据质量差，跨专业数据难以贯通。措施——建立企业级数据标准与主数据体系，统一设备、客户、组织编码；建设数据中台/湖仓一体底座，开展数据盘点与质量专项治理，形成“可发现、可理解、可信任”的数据资源目录。\n② 资产化层：障碍——权属边界不清、成本归集困难、价值计量缺乏方法，入表后存在减值与审计风险。措施——完善数据权属与授权链条，落实“三权分置”；建立数据成本归集与分摊规则，探索成本法、收益法、市场法相结合的价值评估；开展数据资产登记与合规审计，先试点后推广。\n③ 价值化层：障碍——应用场景挖掘不足、供需错配、跨主体流通不畅、收益分配机制缺失。措施——以业务痛点牵引场景清单（如电力看经济、电力+金融、电力+气象）；依托可信数据空间、隐私计算实现“可用不可见”的跨主体流通；建立数据产品目录与运营机制，明确多方收益分配与责任划分，形成“供给—治理—流通—应用—反哺”的闭环。\n加分点：提及组织保障（数据治理委员会）、人才队伍、安全合规底线、评价指标（数据调用率、场景覆盖率、单位数据创效）。","exp":"评分要点：答题要点（分三层作答，每层“障碍+措施”对应得分）：；① 资源化层：；② 资产化层：；③ 价值化层：；加分点：。按要点分层作答，结合电力业务场景举例可加分。","source":"","tip":"","dup":"","typeName":"简答题"},{"id":"LASSS01","bank":"legacy","no":1,"type":"single","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"企业希望大模型在回答专业问题时引用内部制度与规程、降低“幻觉”，最常用且落地成本最低的技术路线是（　）。","options":[{"k":"A","v":"扩大提示词长度，把全部文档塞进上下文"},{"k":"B","v":"检索增强生成（RAG）"},{"k":"C","v":"从零开始全量预训练"},{"k":"D","v":"对输出结果做可视化包装"}],"answer":"B","ref":"","exp":"RAG 通过“检索—增强—生成”将企业知识库与模型结合，具备知识可更新、来源可追溯、成本可控的优势，是行业大模型落地的主流范式。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LASSS02","bank":"legacy","no":2,"type":"single","topic":"数据治理与标准","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"元数据管理最核心的价值是（　）。","options":[{"k":"A","v":"描述数据的数据，支撑数据发现、理解、追溯与管控"},{"k":"B","v":"压缩数据存储体积"},{"k":"C","v":"提升网络传输带宽"},{"k":"D","v":"对数据进行加密存储"}],"answer":"A","ref":"","exp":"元数据分为技术元数据、业务元数据和管理元数据，是实现“数据找得到、看得懂、信得过”的基础，也是数据目录与数据血缘的底座。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LASSS03","bank":"legacy","no":3,"type":"single","topic":"数据治理与标准","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"数据血缘分析主要解决的问题是（　）。","options":[{"k":"A","v":"数据从哪里来、经过哪些加工、影响到哪些下游应用"},{"k":"B","v":"如何降低存储成本"},{"k":"C","v":"如何美化数据看板"},{"k":"D","v":"如何提升数据库并发性能"}],"answer":"A","ref":"","exp":"数据血缘刻画数据实体间的加工与流转关系，是影响分析、问题定位、变更评估与合规审计的关键能力。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LASSS04","bank":"legacy","no":4,"type":"single","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"构建电力设备缺陷识别图像数据集时，对模型效果影响最关键的质量控制环节是（　）。","options":[{"k":"A","v":"标注规范统一，并采用多人交叉标注与抽检复核"},{"k":"B","v":"图片数量越多越好，无需筛选"},{"k":"C","v":"统一转换为灰度图以降低计算量"},{"k":"D","v":"只保留最高分辨率的样本"}],"answer":"A","ref":"","exp":"标注一致性直接决定监督信号的可靠性；缺陷样本还存在长尾分布问题，需通过分层抽样、难例挖掘与类别均衡保障数据集代表性。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LASSS05","bank":"legacy","no":5,"type":"single","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"数据集“数据卡片（Datasheet）”的主要作用是（　）。","options":[{"k":"A","v":"记录数据来源、构成、标注方法、适用范围与已知局限，支撑可信使用"},{"k":"B","v":"作为数据产品的计费凭证"},{"k":"C","v":"用于数据加密密钥管理"},{"k":"D","v":"替代数据质量检测报告"}],"answer":"A","ref":"","exp":"数据卡片是数据集“说明书”，是高质量数据集可追溯、可复现、可审计的重要载体，也是对外流通与交易时的必备材料。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LASSS06","bank":"legacy","no":6,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"设计一款电力数据产品，首先应明确的是（　）。","options":[{"k":"A","v":"技术架构与开发语言选型"},{"k":"B","v":"目标用户、业务场景与要解决的核心问题"},{"k":"C","v":"数据库类型与部署方式"},{"k":"D","v":"界面配色与交互风格"}],"answer":"B","ref":"","exp":"数据产品遵循“场景先行、价值导向”，先回答“为谁解决什么问题、创造什么价值”，再确定数据、算法与技术方案，否则易沦为“有数据无场景”。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LASSS07","bank":"legacy","no":7,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"数据产品运营中，“数据调用量、活跃用户数、业务渗透率”属于（　）指标。","options":[{"k":"A","v":"运营类指标"},{"k":"B","v":"财务类指标"},{"k":"C","v":"安全类指标"},{"k":"D","v":"合规类指标"}],"answer":"A","ref":"","exp":"数据产品评价通常包含运营类（调用量、活跃度、渗透率）、价值类（创收、降本、提效）与质量类（准确率、时延、可用性）三类指标。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LASSS08","bank":"legacy","no":8,"type":"single","topic":"数据安全与合规","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"在“电力数据+普惠金融”场景中，电力数据最典型、最合规的用途是（　）。","options":[{"k":"A","v":"由电网企业直接向企业发放贷款"},{"k":"B","v":"作为企业经营状况的辅助核验与信用评价依据，服务银行风控"},{"k":"C","v":"完全替代人民银行征信报告"},{"k":"D","v":"用于银行上门催收"}],"answer":"B","ref":"","exp":"电网企业不从事金融业务，其角色是数据供给方；须在用户授权、最小必要、专事专用的前提下，通过隐私计算等手段向金融机构输出核验类或评分类数据产品。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LASSS09","bank":"legacy","no":9,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"交能融合场景下，电力数据支撑充电基础设施规划布局，最主要的依据是（　）。","options":[{"k":"A","v":"车辆出行轨迹与充电负荷的时空分布特征"},{"k":"B","v":"历史电价的波动情况"},{"k":"C","v":"变压器厂商的品牌分布"},{"k":"D","v":"充电站运维人员数量"}],"answer":"A","ref":"","exp":"需融合交通流量、出行 OD、土地利用、配电网容量裕度等多源数据，识别充电需求热点与电网承载力约束，实现“车—桩—网”协同规划。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LASSS10","bank":"legacy","no":10,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"下列不属于电力气象融合典型应用场景的是（　）。","options":[{"k":"A","v":"新能源功率预测与消纳评估"},{"k":"B","v":"输电线路覆冰、舞动等灾害预警"},{"k":"C","v":"输电通道山火与雷电监测"},{"k":"D","v":"员工考勤与绩效管理"}],"answer":"D","ref":"","exp":"电力气象聚焦“气象要素—电力设施—运行决策”的耦合关系，与人力资源管理无关。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LASSM01","bank":"legacy","no":1,"type":"multi","topic":"数字化综合","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"企业建设数据智能治理体系，应重点关注（　）。","options":[{"k":"A","v":"建立统一的数据标准、指标口径与元数据体系"},{"k":"B","v":"构建数据质量规则库，形成“监测—告警—整改—复核”闭环"},{"k":"C","v":"保障数据与模型全生命周期的安全合规与可解释性"},{"k":"D","v":"只追求模型精度，数据治理可以后置"}],"answer":"ABC","ref":"","exp":"D 项错误。“有多少人工就有多少智能”，数据治理是智能应用的前置条件；治理缺位会导致模型偏差、结论不可信、合规风险外溢。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LASSM02","bank":"legacy","no":2,"type":"multi","topic":"数据安全与合规","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"实现“数据可用不可见”的隐私计算技术路线主要包括（　）。","options":[{"k":"A","v":"安全多方计算（MPC）"},{"k":"B","v":"联邦学习（FL）"},{"k":"C","v":"可信执行环境（TEE）"},{"k":"D","v":"将各方数据明文汇聚至中心节点"}],"answer":"ABC","ref":"","exp":"D 项是传统集中式汇聚，与隐私保护目标相悖；实践中常采用多种技术融合（如联邦学习+TEE）以平衡性能与安全。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LASSM03","bank":"legacy","no":3,"type":"multi","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"评价一个行业高质量数据集，应考察的维度包括（　）。","options":[{"k":"A","v":"规模与场景覆盖度，样本分布是否贴近真实业务"},{"k":"B","v":"标注准确率、一致性与专业符合性"},{"k":"C","v":"时效性与持续更新、版本管理机制"},{"k":"D","v":"场景适配性与可评测性（是否有配套基准与评测方法）"}],"answer":"ABCD","ref":"","exp":"高质量数据集的标准是“真实、准确、一致、合规、可用、可评测”，四个选项分别对应规模、质量、时效与可用性维度。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LASSM04","bank":"legacy","no":4,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"数据产品需求分析阶段常用的方法包括（　）。","options":[{"k":"A","v":"用户访谈、场景走访与角色画像"},{"k":"B","v":"业务流程梳理与痛点—价值链路分析"},{"k":"C","v":"数据可行性与合规性（授权、脱敏、分级）评估"},{"k":"D","v":"指标体系与价值量化设计"}],"answer":"ABCD","ref":"","exp":"需求分析要做到“业务可行、数据可行、技术可行、合规可行”四维校验，缺一不可，尤其要前置评估数据获取的合法性与授权基础。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LASSM05","bank":"legacy","no":5,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"电力数据产品常见的交付形态包括（　）。","options":[{"k":"A","v":"API/数据接口服务"},{"k":"B","v":"专题分析报告与可视化看板"},{"k":"C","v":"模型/算法服务（如预测、识别、优化）"},{"k":"D","v":"指数与标签服务（如电力景气指数、企业用能标签）"}],"answer":"ABCD","ref":"","exp":"产品形态应与用户使用方式匹配：内部决策多用看板与报告，外部赋能多用 API、模型与指数标签，需配套计量、计费与权限管控。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LASSM06","bank":"legacy","no":6,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"推动电力数据产品生态协同，需要建立的关键机制包括（　）。","options":[{"k":"A","v":"清晰的多方权责划分与收益分配机制"},{"k":"B","v":"统一的数据标准、接口规范与质量要求"},{"k":"C","v":"可信流通基础设施（可信数据空间、隐私计算、区块链存证）"},{"k":"D","v":"各参与方封闭自守、数据互不联通"}],"answer":"ABC","ref":"","exp":"D 项与“协同”背道而驰。生态协同的三大支柱是规则互信、标准互通、技术可控，缺一则难以形成可持续的多方合作。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LASSM07","bank":"legacy","no":7,"type":"multi","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"电力数据在绿色低碳领域的典型应用包括（　）。","options":[{"k":"A","v":"企业及区域碳排放核算与监测"},{"k":"B","v":"区域“电—碳”分析与双碳画像、达峰路径推演"},{"k":"C","v":"绿电交易、绿证核销的辅助核验"},{"k":"D","v":"电网物资采购价格比对"}],"answer":"ABC","ref":"","exp":"电力数据具有实时、准确、可追溯的特点，是碳排放核算的重要校核依据；D 项属于物资管理范畴，与绿色低碳应用无直接关系。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LASSJ01","bank":"legacy","no":1,"type":"judge","topic":"数字化综合","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据智能治理的核心目标，是让数据“找得到、看得懂、信得过、用得好”。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。这四句话分别对应数据目录、元数据与业务语义、质量与血缘、场景应用与运营，是治理成效的通俗检验标准。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LASSJ02","bank":"legacy","no":2,"type":"judge","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"训练行业大模型时，数据规模是决定模型效果的唯一因素。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。数据质量、领域相关性、标注准确性、多样性与配比同样关键，“高质量小数据”往往优于“低质量大数据”。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LASSJ03","bank":"legacy","no":3,"type":"judge","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"高质量数据集应具备明确的标注规范、质量校验流程和版本管理机制。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。三者共同保证数据集可复现、可追溯、可持续迭代，是数据集从“一次性产物”走向“可运营资产”的前提。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LASSJ04","bank":"legacy","no":4,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据产品设计应优先确定技术选型，再考虑用户需求。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。技术选型服务于场景与需求，颠倒顺序极易产出“技术炫技但无人使用”的产品。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LASSJ05","bank":"legacy","no":5,"type":"judge","topic":"数据安全与合规","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据产品对外发布前，应完成数据来源合法性、个人信息保护、数据分类分级等合规审查。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。合规审查是数据产品上线的前置门槛，需留存授权链条、评估记录与审计日志。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LASSJ06","bank":"legacy","no":6,"type":"judge","topic":"可信数据空间与隐私计算","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"跨主体数据流通必须解决“确权、定价、安全、互信”等关键问题。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。分别对应产权制度、价格机制、技术保障与规则信任，是数据要素市场化的四大基础命题。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LASSE01","bank":"legacy","no":1,"type":"short","topic":"可信数据空间与隐私计算","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"四、简答题","q":"【按方向选做 1 题，10 分】\u003cbr\u003eA（数据智能治理）：阐述电力企业构建数据智能治理体系的总体框架与关键实施步骤。\u003cbr\u003eB（高质量数据集）：说明面向电力行业大模型应用，如何构建一个高质量行业数据集。\u003cbr\u003eC（数据产品设计）：描述一个电力数据产品从需求分析到上线运营的完整设计流程及关键交付物。\u003cbr\u003eD（场景与生态）：结合普惠金融/交能融合/电力气象任一场景，说明电力数据产品如何实现跨主体协同与价值变现。","options":[],"answer":"","ref":"A 方向要点：框架为“一套战略+一套标准+一个平台+一支队伍+一套机制”：数据战略与组织（治理委员会—归口部门—域责任人三级）、数据架构与标准（主数据、指标、编码）、数据质量闭环（规则库、监测、整改、复核）、元数据与血缘（数据目录、影响分析）、数据安全（分类分级、权限、脱敏、审计）、智能应用（知识库、RAG、模型服务）。步骤：现状评估（对标 DCMM）→ 顶层设计 → 试点域治理 → 平台落地 → 全域推广 → 持续运营与成熟度复评。\n\nB 方向要点：①需求定义——明确模型任务（如规程问答、缺陷识别、负荷预测）与评价指标；②数据采集——多源汇聚（调度、运检、营销、气象、文档），注意授权与合规；③清洗与治理——去重、去噪、纠错、统一格式与专业术语；④标注——制定标注规范与示例库，多人交叉标注+Kappa 一致性校验+专家复核；⑤配比与增强——类别均衡、难例挖掘、必要的数据合成；⑥划分与评测——训练/验证/测试集隔离，构建领域基准；⑦封装与运营——数据卡片、版本管理、血缘追溯、持续更新与反馈回流。\n\nC 方向要点：需求洞察（用户画像、场景调研、痛点—价值链路）→ 可行性与合规评估（数据可得性、授权、分级）→ 产品定义（功能清单、指标口径、形态选择 API/看板/模型/指数）→ 方案设计（数据模型、算法、交互原型）→ MVP 开发与小范围验证（A/B、用户反馈）→ 上线发布（合规审查、权限计量、服务 SLA）→ 运营迭代（调用量、渗透率、价值核算、版本更新）。关键交付物：需求说明书、数据字典与指标定义、产品原型、合规评估报告、测试与验收报告、运营指标看板。\n\nD 方向要点（以普惠金融为例）：痛点——中小微企业缺抵押、缺规范财务报表，银行风控成本高；供给——电网企业在用户授权下，基于用电量、缴费信用、负荷波动等数据构建“企业经营活力指数/用电信用标签”；流通——通过隐私计算或可信数据空间实现“原始数据不出域、结果可计量”，全程区块链存证；应用——银行将其作为贷前准入、额度测算、贷后预警的辅助依据；机制——签订多方数据合作协议，明确用途限定、最小必要、收益分配与责任边界；价值——企业获得更便捷低成本的融资，银行降低不良率，电网企业实现数据资产价值变现并提升客户服务黏性；风险——严防过度授信、数据滥用与个人信息侵权，落实退出与销毁机制。","exp":"评分要点：A 方向要点：；B 方向要点：；C 方向要点：；D 方向要点（以普惠金融为例）：。按要点分层作答，结合电力业务场景举例可加分。","source":"","tip":"","dup":"","typeName":"简答题"},{"id":"LASSE02","bank":"legacy","no":2,"type":"short","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷一（综合基础卷）","label":"A卷·专项","paper":"卷一（综合基础卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"四、简答题","q":"【必答，10 分】当前电力数据普遍存在“供给不足、流通不畅、应用不深”的问题。请从数据供给、治理、可信流通、场景落地四个层面提出系统性解决思路。","options":[],"answer":"","ref":"① 供给层：建立企业级数据资源目录与“应汇尽汇”机制，明确各专业数据供给责任清单；补齐感知短板（智能终端、量测、气象、外部数据），推动公共数据授权运营与社会数据融合采购；以“需求牵引”反向定义供给，避免“供非所需”。\n② 治理层：统一数据标准与指标口径，强化主数据与元数据管理；建立数据质量规则库与闭环整改机制，将数据质量纳入业务考核；落实分类分级与全生命周期安全管理，做到“可溯源、可审计、可追责”。\n③ 流通层：依托可信数据空间、隐私计算、区块链存证等技术构建跨主体流通基础设施，实现“可用不可见、可控可计量”；完善数据产权、授权、定价与收益分配规则；在数据交易所挂牌标准化数据产品，形成合规交易通道。\n④ 应用层：以高价值场景为突破口（电力看经济、电力+金融、电力+气象、交能融合、双碳监测），打造标杆数据产品并规模复制；建立“产品经理+业务专家+数据科学家”的联合团队；构建应用成效评价体系（调用量、渗透率、创效额），以价值反哺供给与治理，形成“供给—治理—流通—应用”正向循环。\n加分点：强调安全合规是底线而非阻碍、组织与人才保障、试点先行与容错机制。","exp":"评分要点：① 供给层：；② 治理层：；③ 流通层：；④ 应用层：；加分点：。按要点分层作答，结合电力业务场景举例可加分。","source":"","tip":"","dup":"","typeName":"简答题"},{"id":"LBGGS01","bank":"legacy","no":1,"type":"single","topic":"数据安全与合规","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"《数据安全法》确立的数据分类分级保护制度中，重要数据的具体目录由（　）确定。","options":[{"k":"A","v":"国家网信部门统一制定并一次性发布"},{"k":"B","v":"各地区、各部门按照数据分类分级保护制度，确定本地区、本部门以及相关行业、领域的重要数据具体目录"},{"k":"C","v":"数据处理者根据自身判断自行确定"},{"k":"D","v":"行业协会推荐后即可执行"}],"answer":"B","ref":"","exp":"《数据安全法》第二十一条明确：各地区、各部门应当按照数据分类分级保护制度，确定本地区、本部门以及相关行业、领域的重要数据具体目录，对列入目录的数据进行重点保护。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBGGS02","bank":"legacy","no":2,"type":"single","topic":"数据安全与合规","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"根据《个人信息保护法》，处理敏感个人信息应当取得个人的（　）。","options":[{"k":"A","v":"一般同意"},{"k":"B","v":"单独同意"},{"k":"C","v":"默示同意"},{"k":"D","v":"无需取得同意"}],"answer":"B","ref":"","exp":"敏感个人信息包括生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹等信息，以及不满十四周岁未成年人的个人信息；处理时须取得单独同意，并向个人告知处理的必要性及对个人权益的影响。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBGGS03","bank":"legacy","no":3,"type":"single","topic":"数据安全与合规","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"我国网络安全等级保护制度的核心技术思路可概括为（　）。","options":[{"k":"A","v":"一个中心、三重防护（安全管理中心，计算环境、区域边界、通信网络防护）"},{"k":"B","v":"一网通办、一网统管"},{"k":"C","v":"同步规划、同步建设、同步运行"},{"k":"D","v":"分级分类、动态调整、闭环管理"}],"answer":"A","ref":"","exp":"等保 2.0 在传统边界防护基础上，强调构建“安全管理中心支撑下的计算环境安全、区域边界安全、通信网络安全”三重防护体系，实现从被动防护到主动防御的转变。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBGGS04","bank":"legacy","no":4,"type":"single","topic":"数据安全与合规","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"电力监控系统安全防护原则中，“网络专用”的具体含义是（　）。","options":[{"k":"A","v":"所有业务系统共用一张物理网络以节省投资"},{"k":"B","v":"电力调度数据网应与其它数据网络物理隔离，采用专用通道承载电力生产控制业务"},{"k":"C","v":"通过互联网专线接入调度系统"},{"k":"D","v":"在公网上建立 VPN 隧道即可"}],"answer":"B","ref":"","exp":"“网络专用”要求电力调度数据网与信息外网、互联网严格物理隔离，使用独立的光缆或专用通道，防止外部攻击借道渗透生产控制大区。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBGGS05","bank":"legacy","no":5,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"《电力行业网络安全管理办法》的适用对象是（　）。","options":[{"k":"A","v":"仅限发电企业"},{"k":"B","v":"仅限电网企业"},{"k":"C","v":"电力行业网络运营者及相关监督管理活动"},{"k":"D","v":"仅限电力二次设备制造企业"}],"answer":"C","ref":"","exp":"该办法由国家能源局印发，适用于电力行业网络运营者开展网络安全保护工作以及能源主管部门实施的监督管理活动，覆盖发电、输电、配电、用电等各环节。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBGGS06","bank":"legacy","no":6,"type":"single","topic":"数据安全与合规","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"处理重要数据或者达到规定数量的个人信息向境外提供，应当（　）。","options":[{"k":"A","v":"由企业自行评估后直接出境"},{"k":"B","v":"申报数据出境安全评估"},{"k":"C","v":"仅需取得用户口头同意"},{"k":"D","v":"向行业协会备案即可"}],"answer":"B","ref":"","exp":"依据《数据出境安全评估办法》，向境外提供重要数据、关键信息基础设施运营者处理的个人信息、以及达到规定数量标准的个人信息，均须申报数据出境安全评估，通过后方可出境。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBGGS07","bank":"legacy","no":7,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"数据生存周期管理通常覆盖的环节是（　）。","options":[{"k":"A","v":"采集、存储、使用、加工、传输、提供、公开、销毁"},{"k":"B","v":"采集、清洗、建模、可视化"},{"k":"C","v":"规划、建设、运行、检修"},{"k":"D","v":"立项、招标、实施、验收"}],"answer":"A","ref":"","exp":"《数据安全法》第三条界定的数据处理活动即包含采集、存储、使用、加工、传输、提供、公开等，加上销毁环节，构成数据全生命周期的安全管控链条。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBGGS08","bank":"legacy","no":8,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"在指标体系建设中，“设备缺陷率”由“缺陷设备台数 ÷ 设备总台数”计算得出，该指标属于（　）。","options":[{"k":"A","v":"原子指标"},{"k":"B","v":"派生指标"},{"k":"C","v":"数据标签"},{"k":"D","v":"分析维度"}],"answer":"B","ref":"","exp":"原子指标是不可再分的基础度量（如缺陷设备台数）；原子指标叠加业务限定、统计周期与修饰词后形成的为派生指标；多个派生指标经运算组合形成复合指标。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBGGS09","bank":"legacy","no":9,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"数据湖与数据仓库在能力上的核心差异是（　）。","options":[{"k":"A","v":"数据湖只能存结构化数据"},{"k":"B","v":"数据湖可低成本存储原始多模态数据并支持schema-on-read，湖仓一体则进一步融合两者优势"},{"k":"C","v":"数据仓库不需要数据建模"},{"k":"D","v":"数据湖不需要元数据管理"}],"answer":"B","ref":"","exp":"数据仓库强调“先建模后写入”（schema-on-write），适合稳定报表分析；数据湖以原始格式存储、读取时定义模式，适合探索式分析与机器学习；湖仓一体兼顾两者，实现统一存储与统一治理。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBGGS10","bank":"legacy","no":10,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"电力系统频率稳定的根本前提是（　）。","options":[{"k":"A","v":"发电有功出力与用电负荷（含网损）实时平衡"},{"k":"B","v":"系统电压恒定不变"},{"k":"C","v":"电流保持恒定"},{"k":"D","v":"功率因数保持为 1"}],"answer":"A","ref":"","exp":"频率反映系统有功功率的供需平衡状态：出力大于负荷频率上升，反之下降。新能源高比例接入后，惯量支撑与一次调频能力下降，频率稳定问题更加突出。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBGGS11","bank":"legacy","no":11,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"新能源大规模接入导致系统惯量下降，其直接后果是（　）。","options":[{"k":"A","v":"频率变化率（RoCoF）增大，频率响应能力减弱，易触发连锁脱网"},{"k":"B","v":"系统电压自动升高"},{"k":"C","v":"线路损耗显著下降"},{"k":"D","v":"短路容量自动增大"}],"answer":"A","ref":"","exp":"传统同步机提供转动惯量，而电力电子接口的新能源不天然具备惯量支撑，导致扰动后频率跌落更快、最低点更低，需要通过构网型控制、储能调频等手段弥补。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBGGS12","bank":"legacy","no":12,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"抽水蓄能、新型储能、需求响应等资源在电力系统中的共同作用是（　）。","options":[{"k":"A","v":"提供系统调节能力，支撑新能源消纳与电力保供"},{"k":"B","v":"替代输电线路建设"},{"k":"C","v":"提高终端电价水平"},{"k":"D","v":"减少用户接入数量"}],"answer":"A","ref":"","exp":"三者分属“储”与“荷”侧的灵活性资源，通过削峰填谷、快速爬坡、双向调节，共同提升系统灵活性与安全裕度，是新型电力系统“供需协同”的关键支撑。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBGGS13","bank":"legacy","no":13,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"绿色电力证书（绿证）的核心作用是（　）。","options":[{"k":"A","v":"作为可再生能源电力消费属性的唯一凭证，用于绿电消费认定与核销"},{"k":"B","v":"作为电价水平的证明文件"},{"k":"C","v":"替代电力业务许可证"},{"k":"D","v":"作为电网调度指令的载体"}],"answer":"A","ref":"","exp":"绿证是可再生能源电量环境属性的唯一证明，一证对应 1000 千瓦时电量，是可再生能源消费认证、消纳责任权重考核及企业绿电消费声明的重要依据。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBGGS14","bank":"legacy","no":14,"type":"single","topic":"数据治理与标准","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"数据治理中“同名不同义、同义不同名”现象的根本解决手段是（　）。","options":[{"k":"A","v":"建立统一的指标字典与数据标准，明确业务定义、计算口径与归口责任部门"},{"k":"B","v":"单纯扩容存储设备"},{"k":"C","v":"提高网络传输带宽"},{"k":"D","v":"增加报表数量以覆盖更多场景"}],"answer":"A","ref":"","exp":"指标口径混乱本质是“语言不统一”，必须通过指标字典（业务定义、计算公式、数据来源、统计周期、责任部门）实现唯一权威定义，并在系统中固化与版本化管理。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBGGS15","bank":"legacy","no":15,"type":"single","topic":"数据治理与标准","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"关于数据质量的“及时性”与“时效性”，理解正确的是（　）。","options":[{"k":"A","v":"及时性强调数据在规定时间内完成采集与更新，时效性强调数据在需要时的新鲜程度与可用窗口"},{"k":"B","v":"两者含义完全等同，可以互换使用"},{"k":"C","v":"及时性只针对实时量测数据"},{"k":"D","v":"时效性只针对历史归档数据"}],"answer":"A","ref":"","exp":"及时性衡量“是否按时到达”，时效性衡量“到达后是否仍具备使用价值”。例如日冻结电量要求次日 8 点前完成上传（及时性），而负荷预测所需的实时数据窗口仅为分钟级（时效性）。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBGGM01","bank":"legacy","no":1,"type":"multi","topic":"数据安全与合规","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"《数据安全法》确立的主要制度包括（　）。","options":[{"k":"A","v":"数据分类分级保护制度"},{"k":"B","v":"数据安全风险评估、报告、信息共享与监测预警制度"},{"k":"C","v":"数据安全审查制度"},{"k":"D","v":"属于管制物项的数据依法实施出口管制"}],"answer":"ABCD","ref":"","exp":"四项均为《数据安全法》确立的基本制度，共同构成数据安全治理的制度骨架，分别对应“分级、风评、审查、管制”四个抓手。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LBGGM02","bank":"legacy","no":2,"type":"multi","topic":"数据安全与合规","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"处理个人信息的合法性基础包括（　）。","options":[{"k":"A","v":"取得个人的同意"},{"k":"B","v":"为订立、履行个人作为一方当事人的合同所必需"},{"k":"C","v":"为履行法定职责或者法定义务所必需"},{"k":"D","v":"为应对突发公共卫生事件，或者紧急情况下为保护自然人的生命健康和财产安全所必需"}],"answer":"ABCD","ref":"","exp":"《个人信息保护法》第十三条列举了七类合法性基础，除同意外还包括履行法定职责、应对突发事件、公共利益新闻报道、已公开个人信息合理处理等情形。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LBGGM03","bank":"legacy","no":3,"type":"multi","topic":"数字化综合","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"关键信息基础设施运营者应当履行的义务包括（　）。","options":[{"k":"A","v":"设置专门安全管理机构，并对负责人和关键岗位人员进行安全背景审查"},{"k":"B","v":"按照规定自行或者委托专业机构每年至少进行一次网络安全检测"},{"k":"C","v":"发生重大网络安全事件时按规定向保护工作部门、公安部门报告"},{"k":"D","v":"优先采购安全可信的网络产品和服务"}],"answer":"ABCD","ref":"","exp":"以上均为《关键信息基础设施安全保护条例》的明确要求；此外还包括容灾备份、事件应急预案、年度安全评估等义务。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LBGGM04","bank":"legacy","no":4,"type":"multi","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"电网生产运营涉及的主要业务系统包括（　）。","options":[{"k":"A","v":"调度自动化系统（EMS/SCADA）"},{"k":"B","v":"配电自动化系统（DMS）"},{"k":"C","v":"用电信息采集系统"},{"k":"D","v":"输变电设备状态在线监测系统"}],"answer":"ABCD","ref":"","exp":"这些系统分别覆盖“调、配、用、设备”四个环节，是电网运行数据的主要来源，也是数据分类分级与安全防护的重点对象。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LBGGM05","bank":"legacy","no":5,"type":"multi","topic":"数据治理与标准","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"数据质量的主要评价维度包括（　）。","options":[{"k":"A","v":"完整性与准确性"},{"k":"B","v":"一致性与唯一性"},{"k":"C","v":"及时性与有效性"},{"k":"D","v":"保密性与抗毁性"}],"answer":"ABC","ref":"","exp":"D 项属于信息安全属性，不属于数据质量维度。参照 GB/T 36344《信息技术 数据质量评价指标》，质量维度主要包括规范性、完整性、准确性、一致性、时效性与可访问性。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LBGGM06","bank":"legacy","no":6,"type":"multi","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"提升新能源消纳能力的技术与管理措施包括（　）。","options":[{"k":"A","v":"提升系统调节能力，推进火电灵活性改造与储能建设"},{"k":"B","v":"加强跨省跨区输电通道建设，实现大范围资源互济"},{"k":"C","v":"完善电力市场与辅助服务机制，通过价格信号引导灵活调节"},{"k":"D","v":"限制新能源并网规模，减少波动性电源接入"}],"answer":"ABC","ref":"","exp":"D 项与“双碳”目标相悖。提升消纳能力的路径是“源网荷储协同 + 大电网互济 + 市场化机制 + 需求侧响应”，而非限制新能源发展。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LBGGM07","bank":"legacy","no":7,"type":"multi","topic":"数据治理与标准","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"企业数据治理组织体系中，常见的角色设置包括（　）。","options":[{"k":"A","v":"数据治理决策机构（数据治理委员会）"},{"k":"B","v":"数据管理归口部门（如数据管理中心）"},{"k":"C","v":"各业务域数据责任人（数据管家/数据专员）"},{"k":"D","v":"数据质量与数据安全审计岗位"}],"answer":"ABCD","ref":"","exp":"典型架构为“决策层—管理层—执行层—监督层”四级，明确“谁的数据谁负责、谁生产谁治理”，避免治理责任悬空。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LBGGM08","bank":"legacy","no":8,"type":"multi","topic":"数据安全与合规","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"关于数据脱敏，说法正确的有（　）。","options":[{"k":"A","v":"可分为静态脱敏与动态脱敏两类"},{"k":"B","v":"常见方法包括掩码、替换、泛化、加密与哈希"},{"k":"C","v":"脱敏后的数据仍应评估重标识风险"},{"k":"D","v":"数据一经脱敏即可不受任何使用场景限制"}],"answer":"ABC","ref":"","exp":"D 项错误。脱敏不等于脱责，高维数据仍可能通过关联碰撞实现重标识，须结合访问控制、用途限定与审计共同管控；涉及个人信息的还应判断是否达到匿名化标准。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LBGGJ01","bank":"legacy","no":1,"type":"judge","topic":"数据安全与合规","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"重要数据一旦被泄露，可能危害国家安全、经济运行、社会稳定和公共健康与安全。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。这是重要数据的典型界定标准；若关系国家安全、国民经济命脉、重要民生与重大公共利益，则进一步按国家核心数据实行更严格管理。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LBGGJ02","bank":"legacy","no":2,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"只要数据尚未对外公开，就可以不纳入数据资产管理与安全管控范围。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。内部数据同样面临泄露、滥用与越权访问风险，且大量内部数据经聚合分析后可构成重要数据，必须纳入分类分级与全生命周期管控。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LBGGJ03","bank":"legacy","no":3,"type":"judge","topic":"数据安全与合规","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"电力监控系统在上线运行前，应完成网络安全等级保护测评等安全验证工作。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。生产控制类系统须按等保要求定级备案、建设整改并通过测评，涉及电力监控系统安全防护方案的还应按规定报备与评审。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LBGGJ04","bank":"legacy","no":4,"type":"judge","topic":"数据安全与合规","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"个人信息经匿名化处理，无法识别特定自然人且不能复原的，不属于个人信息，可以依法流通使用。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。《个人信息保护法》第四条规定，匿名化处理后的信息不属于个人信息。但“去标识化”不等于匿名化，去标识化信息仍属个人信息，须继续履行合规义务。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LBGGJ05","bank":"legacy","no":5,"type":"judge","topic":"数据安全与合规","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据安全风险评估只需在新系统上线时开展一次，后续无需重复。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。业务、数据、威胁与合规要求都在变化，风险评估应常态化开展，重要数据处理者还须按规定定期评估并报送报告。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LBGGJ06","bank":"legacy","no":6,"type":"judge","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"“源网荷储”一体化强调电源、电网、负荷、储能四侧协同互动，而非单纯增加发电装机。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。其核心是以系统整体最优为目标，通过灵活资源聚合与智能调控，实现供需动态平衡与新能源高效消纳。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LBGGJ07","bank":"legacy","no":7,"type":"judge","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"新型储能只能用于削峰填谷，不能参与调频、备用等辅助服务。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。新型储能具备毫秒级响应能力，广泛参与一次调频、AGC、爬坡、备用、黑启动等多种辅助服务，是灵活性资源的重要组成。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LBGGJ08","bank":"legacy","no":8,"type":"judge","topic":"数据治理与标准","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据标准的落地依赖于在业务系统中固化校验规则与流程卡点，而不仅是发布标准文档。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。标准若只停留在文档层面极易“挂墙”，必须嵌入系统录入校验、接口规范与考核机制，才能形成刚性约束。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LBGGJ09","bank":"legacy","no":9,"type":"judge","topic":"数字化综合","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"同一指标在不同报表中取值不一致，属于典型的数据一致性问题。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。一致性要求跨系统、跨报表、跨时点的同一业务事实取值相同，其根因多为口径不统一或抽取时点不一致。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LBGGE01","bank":"legacy","no":1,"type":"short","topic":"数据安全与合规","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·通用","paper":"卷二（安全合规卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"四、简答题","q":"请结合《数据安全法》《个人信息保护法》及电力行业监管要求，阐述电力企业构建数据全生命周期安全合规体系的路径与关键措施。（10 分）","options":[],"answer":"","ref":"① 制度层：建立数据安全管理办法、分类分级细则、个人信息保护规范、数据出境与共享审批流程；明确数据安全负责人与责任部门，落实“谁主管谁负责、谁运营谁负责”。\n② 识别层：开展数据资产盘点，形成数据资产目录；按国家与行业规则完成分类分级，识别重要数据、核心数据与个人信息（含敏感个人信息）；建立重要数据目录并按规定报备。\n③ 防护层：技术措施覆盖采集（最小必要、授权校验）、传输（加密通道、专网隔离）、存储（加密、分级分域、备份容灾）、使用（权限最小化、动态脱敏、水印溯源）、共享（隐私计算、可信数据空间、审批留痕）、销毁（介质销毁与记录）。\n④ 监测层：部署数据访问审计、异常行为监测与告警，建立数据安全事件应急预案，明确分级响应、上报时限（重大事件按规定向主管部门与公安部门报告）与复盘机制。\n⑤ 评估层：常态化开展数据安全风险评估与合规审计，重要数据处理者定期报送风险评估报告；对新产品、新场景实行“数据合规前置审查”，未经评估不得上线。\n⑥ 文化层：开展分级分类培训与考核，把数据安全纳入业务考核指标，形成“业务懂合规、技术保合规、审计督合规”的闭环。\n加分点：区分匿名化与去标识化、强调重要数据与核心数据的差异化管控、提及电力监控系统安全分区对数据流动的约束。","exp":"评分要点：① 制度层：；② 识别层：；③ 防护层：；④ 监测层：；⑤ 评估层：；⑥ 文化层：；加分点：。按要点分层作答，结合电力业务场景举例可加分。","source":"","tip":"","dup":"","typeName":"简答题"},{"id":"LBSSS01","bank":"legacy","no":1,"type":"single","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":
