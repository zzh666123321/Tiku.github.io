<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b63c5">
<title>电力数据要素大赛 · 理论笔试模拟题库（四套卷）</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --txt:#1a2029; --sub:#5b6675; --line:#e3e8ef;
  --pri:#0b63c5; --pri-l:#e9f1fb; --ok:#0a8a5f; --ok-l:#e8f6f0; --err:#d13438; --err-l:#fdecec;
  --warn:#b26a00; --warn-l:#fff5e6;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  font-size:15px; line-height:1.7;}
header.bar{position:sticky; top:0; z-index:60; background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:10px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.brand{font-weight:700; font-size:15px; letter-spacing:.2px;}
.brand span{color:var(--pri);}
.tools{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.timer{font-variant-numeric:tabular-nums; font-weight:700; font-size:17px; color:var(--pri);
  background:var(--pri-l); padding:5px 12px; border-radius:8px; min-width:88px; text-align:center;}
.timer.low{color:var(--err); background:var(--err-l);}
button{font-family:inherit; font-size:13px; cursor:pointer; border-radius:7px;
  border:1px solid var(--line); background:#fff; color:var(--txt); padding:6px 13px; transition:.15s;}
button:hover{border-color:var(--pri); color:var(--pri);}
button.primary{background:var(--pri); border-color:var(--pri); color:#fff;}
button.primary:hover{background:#0a56ab; color:#fff;}
button.ghost{background:transparent; padding:4px 10px; font-size:12.5px; color:var(--sub);}
.progress{height:3px; background:var(--line);}
.progress > div{height:100%; width:0; background:linear-gradient(90deg,#0b63c5,#12a8a0); transition:width .2s;}
main{max-width:920px; margin:0 auto; padding:16px 18px 90px;}

.tabs{display:flex; gap:8px; overflow-x:auto; padding:4px 0 14px; -webkit-overflow-scrolling:touch;}
.tab{flex:0 0 auto; padding:9px 15px; border-radius:9px; border:1px solid var(--line);
  background:#fff; font-size:13.5px; cursor:pointer; transition:.15s; white-space:nowrap; line-height:1.35;
  max-width:270px;}
.tab b{display:block; font-size:14px;}
.tab small{display:block; color:var(--sub); font-size:11.5px; overflow:hidden; text-overflow:ellipsis;}
.tab:hover{border-color:#a8c6e8;}
.tab.on{background:linear-gradient(135deg,#0b63c5,#1189c4); border-color:transparent; color:#fff; box-shadow:0 4px 12px rgba(11,99,197,.25);}
.tab.on small{color:rgba(255,255,255,.85);}

section.mod{margin-bottom:26px;}
.mod-h{background:linear-gradient(135deg,#0b63c5,#1189c4); color:#fff; border-radius:12px;
  padding:16px 20px; margin-bottom:16px;}
.mod-h h2{margin:0 0 4px; font-size:19px;}
.mod-h p{margin:0; font-size:13px; opacity:.9;}
.grp h3{font-size:14px; font-weight:600; color:var(--sub); margin:22px 0 10px;
  padding-left:9px; border-left:3px solid var(--pri);}
.q{background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:15px 18px; margin-bottom:10px; transition:.15s;}
.q:hover{border-color:#c9d8ea;}
.q.wrong{border-color:#f0b7b7; background:#fffafa;}
.q.right{border-color:#bfe3d2;}
.qh{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.no{display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:22px;
  background:var(--pri-l); color:var(--pri); font-size:12px; font-weight:700; border-radius:6px; padding:0 6px;}
.qt{font-size:12px; color:var(--sub);}
.qt b{color:var(--warn); font-weight:600;}
.stem{margin-bottom:10px; font-size:15px; line-height:1.75;}
.opts{display:flex; flex-direction:column; gap:7px;}
.opt{display:flex; gap:9px; align-items:flex-start; padding:8px 12px; border-radius:8px;
  border:1px solid var(--line); cursor:pointer; transition:.13s; user-select:none;}
.opt:hover{background:#f7f9fc; border-color:#c9d8ea;}
.opt .tag{flex:0 0 auto; width:19px; height:19px; border-radius:50%; background:#eef1f6;
  color:var(--sub); font-size:11.5px; font-weight:700; display:flex; align-items:center;
  justify-content:center; margin-top:2px;}
.opt.on{background:var(--pri-l); border-color:var(--pri);}
.opt.on .tag{background:var(--pri); color:#fff;}
.opt.on .txt{color:#0a4d9c; font-weight:600;}
.opt.right{background:var(--ok-l); border-color:#7fc9a8;}
.opt.right .tag{background:var(--ok); color:#fff;}
textarea{width:100%; min-height:110px; border:1px solid var(--line); border-radius:8px;
  padding:10px 12px; font-family:inherit; font-size:14px; resize:vertical; outline:none;
  color:var(--txt); background:#fcfdff;}
textarea:focus{border-color:var(--pri); background:#fff;}
.ans{display:none; margin-top:11px; padding:11px 14px; background:#f7f9fc;
  border-left:3px solid var(--pri); border-radius:0 8px 8px 0; font-size:13.5px; color:#33404f;}
.ans b{color:var(--pri);}
.q.show .ans{display:block;}
.ansline{margin-bottom:5px;}
.result{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-top:26px;}
.result h2{margin:0 0 14px; font-size:18px;}
.scorebox{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
.sc{flex:1; min-width:130px; background:#f7f9fc; border-radius:10px; padding:12px 14px; border:1px solid var(--line);}
.sc .k{font-size:12px; color:var(--sub);}
.sc .v{font-size:23px; font-weight:700; color:var(--pri); font-variant-numeric:tabular-nums;}
.sc .v small{font-size:13px; font-weight:400; color:var(--sub);}
.wronglist{font-size:13.5px; color:#33404f;}
.wronglist li{margin-bottom:4px;}
.tip{font-size:13px; background:var(--warn-l); color:#7a4a00; border-radius:8px; padding:9px 13px; margin-top:14px;}
.hidden{display:none!important;}
footer{text-align:center; font-size:12px; color:#9aa4b2; padding:20px;}
/* ================= 手机端适配 ================= */
@media (max-width: 640px){
  html{-webkit-text-size-adjust:100%;}
  body{overflow-x:hidden; -webkit-tap-highlight-color:transparent;}

  /* 顶栏只留标题，操作条固定到底部 */
  header.bar{
    padding:9px 12px; gap:8px; flex-wrap:nowrap;
    background:#fff; -webkit-backdrop-filter:none; backdrop-filter:none;
    box-shadow:0 1px 0 var(--line); border-bottom:0;
  }
  .brand{flex:1; min-width:0; font-size:13px; line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .tools{
    position:fixed; left:0; right:0; bottom:0; margin:0; z-index:90;
    display:grid; grid-template-columns:repeat(3,1fr); gap:7px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
    background:rgba(255,255,255,.98); border-top:1px solid var(--line);
    box-shadow:0 -4px 18px rgba(16,32,56,.10);
  }
  .timer{
    height:40px; font-size:15px; padding:0; min-width:0;
    display:flex; align-items:center; justify-content:center;
  }
  .tools button{
    width:100%; height:40px; padding:0 2px; border-radius:9px;
    font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  main{padding:10px 10px 20px; max-width:none;}

  /* 卷别切换：通栏横向滑动 */
  .tabs{margin:0 -10px; padding:6px 10px 12px; gap:7px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{padding:8px 11px; max-width:64vw;}
  .tab b{font-size:13px;}
  .tab small{font-size:11px;}

  .mod{margin-bottom:18px;}
  .mod-h{padding:13px 14px; border-radius:11px; margin-bottom:12px;}
  .mod-h h2{font-size:16.5px;}
  .mod-h p{font-size:12px; line-height:1.6;}
  .grp h3{font-size:13px; margin:16px 0 8px;}

  .q{padding:13px 12px; border-radius:11px; margin-bottom:9px;}
  .q:hover{border-color:var(--line);}
  .no{min-width:22px; height:21px; font-size:11.5px;}
  .qt{font-size:11.5px;}
  .stem{font-size:15px; line-height:1.72; overflow-wrap:anywhere; word-break:break-word;}
  .opts{gap:8px;}
  .opt{padding:10px 11px; min-height:44px; border-radius:9px;}
  .opt:hover{background:#fff; border-color:var(--line);}
  .opt .txt{overflow-wrap:anywhere; word-break:break-word;}
  .opt .tag{width:20px; height:20px; font-size:12px;}

  textarea{font-size:16px; min-height:130px; padding:10px 11px;}
  button.ghost{font-size:12.5px; padding:7px 4px; margin-top:8px; min-height:36px;}

  .ans{font-size:13px; padding:10px 11px; line-height:1.7; overflow-wrap:anywhere;}

  .result{padding:15px 13px;}
  .result h2{font-size:15.5px;}
  .scorebox{gap:8px; margin-bottom:12px;}
  .sc{min-width:calc(50% - 4px); padding:10px 11px;}
  .sc .v{font-size:20px;}
  .wronglist{font-size:12.5px;}
  .tip{font-size:12px; padding:9px 11px;}

  footer{padding:16px 12px calc(122px + env(safe-area-inset-bottom,0px));}
}
@media (max-width: 360px){
  .tools button{font-size:11.5px;}
  .timer{font-size:14px;}
}
@media print{
  header.bar,.progress,.tabs,button,.tip{display:none!important;}
  body{background:#fff; font-size:12pt;}
  .ans{display:block!important;}
  .q{break-inside:avoid; border-color:#ddd;}
  .mod-h{background:#e8eef7!important; color:#000!important;-webkit-print-color-adjust:exact;}
}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">电力数据要素大赛 · <span>理论笔试模拟题库</span></div>
  <div class="tools">
    <div class="timer" id="timer">60:00</div>
    <button id="btnStart">开始计时</button>
    <button id="btnToggle">显示答案</button>
    <button id="btnSubmit" class="primary">交卷判分</button>
    <button id="btnPrint">打印/PDF</button>
    <button id="btnReset">重置本卷</button>
  </div>
</header>
<div class="progress"><div id="bar"></div></div>

<main>
  <div class="tabs" id="tabs"></div>
  <div id="paper"></div>
  <div id="result" class="result hidden"></div>
</main>

<footer>四套模拟卷 · 每卷 58 题 / 满分 100 分 / 60 分钟 ｜ 客观题自动判分，简答题对照参考答案自评 ｜ 作答进度按卷自动保存</footer>

<script>
const PAPER_A = {
  general: {
    title: '通用模块（50 分）',
    subtitle: '新型电力系统建设 · 电力数据安全合规 · 电网生产运营 · 数据治理基础理论',
    groups: [
      {
        key:'gs', name:'一、单选题', type:'single', per:1,
        items:[
          {q:'2024 年 8 月，国家发展改革委、国家能源局等部门联合印发《加快构建新型电力系统行动方案（2024—2027 年）》。其中提出的新型电力系统基本特征不包括（　）。',
           o:['清洁低碳','安全充裕','经济高效','集中统一'], a:3,
           e:'新型电力系统的基本特征为“清洁低碳、安全充裕、经济高效、供需协同、灵活智能”，共五个方面，不包括“集中统一”。'},

          {q:'《关于构建数据基础制度更好发挥数据要素作用的意见》（“数据二十条”）提出的数据产权结构性分置制度是（　）。',
           o:['数据所有权、使用权、收益权“三权分置”','数据资源持有权、数据加工使用权、数据产品经营权“三权分置”','数据采集权、存储权、处分权“三权分置”','数据公有权、经营权、监管权“三权分置”'], a:1,
           e:'“数据二十条”明确建立数据资源持有权、数据加工使用权、数据产品经营权等分置的产权运行机制，即通常所说的“三权分置”，淡化所有权、强调使用权。'},

          {q:'财政部《企业数据资源相关会计处理暂行规定》自（　）起施行，标志着数据资源“入表”进入实操阶段。',
           o:['2021 年 1 月 1 日','2022 年 1 月 1 日','2024 年 1 月 1 日','2025 年 1 月 1 日'], a:2,
           e:'该规定 2023 年 8 月发布，自 2024 年 1 月 1 日起施行，明确企业数据资源可按无形资产、存货等科目进行会计处理，是数据资产化的重要制度基础。'},

          {q:'数据从原始形态到成为生产要素的演进路径，通常概括为（　）。',
           o:['资源化 → 资产化 → 价值化','采集 → 存储 → 分析','标准化 → 规范化 → 制度化','数字化 → 网络化 → 智能化'], a:0,
           e:'资源化解决“有没有、好不好用”，资产化解决“算不算资产、值多少钱”，价值化解决“如何通过场景应用产生经济与社会效益”，三者层层递进。'},

          {q:'《数据管理能力成熟度评估模型》（DCMM）的国家标准编号是（　）。',
           o:['GB/T 36073-2018','GB/T 37988-2019','GB/T 22239-2019','GB/T 43697-2024'], a:0,
           e:'DCMM 为 GB/T 36073-2018；GB/T 37988-2019 是 DSMM（数据安全能力成熟度模型）；GB/T 22239-2019 是网络安全等级保护基本要求；GB/T 43697-2024 是数据分类分级规则。'},

          {q:'电力监控系统安全防护的总体原则（俗称“十六字方针”）是（　）。',
           o:['安全分区、网络专用、横向隔离、纵向认证','分区防御、纵深防护、动态感知、主动免疫','分级保护、分域防护、统一管理、重点保障','物理隔离、逻辑隔离、边界防护、终端管控'], a:0,
           e:'依据《电力监控系统安全防护规定》，坚持“安全分区、网络专用、横向隔离、纵向认证”，生产控制大区与管理信息大区之间须部署正、反向物理隔离装置。'},

          {q:'根据《数据安全法》，关系国家安全、国民经济命脉、重要民生、重大公共利益等数据，属于（　）。',
           o:['一般数据','重要数据','国家核心数据','个人敏感信息'], a:2,
           e:'《数据安全法》第二十一条规定，关系国家安全、国民经济命脉、重要民生、重大公共利益等数据属于国家核心数据，实行更加严格的管理制度。'},

          {q:'按网络安全等级保护 2.0 要求，电力调度控制类系统通常应达到的保护等级为（　）。',
           o:['第一级','第二级','第三级及以上','不做要求'], a:2,
           e:'电力生产控制类系统涉及公共利益与社会秩序，通常不低于第三级；纳入关键信息基础设施的还须按《关键信息基础设施安全保护条例》实行重点保护。'},

          {q:'电网企业推进企业级数据治理，负责统筹决策定位、标准审定与跨部门协调的顶层组织通常是（　）。',
           o:['数据治理委员会（数据管理委员会）','变电运维班组','内部审计部门','物资采购中心'], a:0,
           e:'数据治理需要“一把手工程”式的顶层组织保障，一般设立数据治理委员会作为决策层，下设数据管理归口部门与各业务域数据责任人，形成“决策—管理—执行”三级架构。'},

          {q:'衡量数据质量时，“同一指标在不同系统、不同报表中取值应当相同”属于数据质量的（　）维度。',
           o:['完整性','一致性','及时性','唯一性'], a:1,
           e:'一致性指数据在跨系统、跨表、跨时点之间不存在矛盾；完整性强凋记录与字段不缺失；及时性强调数据在需要时可获得且时效满足要求。'},

          {q:'对变电站、线路、台区、计量点等对象建立统一编码和唯一标识，属于（　）管理的范畴。',
           o:['主数据管理','元数据管理','数据血缘管理','数据脱敏管理'], a:0,
           e:'主数据是跨系统共享、相对稳定、标识业务实体的核心数据（如设备、客户、组织），统一编码是主数据管理的核心内容，是跨专业数据贯通的前提。'},

          {q:'新能源大规模接入背景下，电力系统的“双高”特征是指（　）。',
           o:['高电压等级、高负荷密度','高比例新能源、高比例电力电子设备','高电价水平、高运营成本','高供电可靠性、高自动化水平'], a:1,
           e:'“双高”即高比例可再生能源、高比例电力电子设备，带来惯量下降、抗扰动能力减弱、宽频振荡等新型稳定问题，需要源网荷储协同与新型调度体系支撑。'},

          {q:'在“原始数据不出域”的前提下实现多方联合训练模型，最典型的技术路线是（　）。',
           o:['建设集中式数据仓库','ETL 数据抽取汇聚','联邦学习','数据可视化分析'], a:2,
           e:'联邦学习通过“数据不动模型动”，各方在本地训练、仅交换模型参数或梯度，配合安全聚合可进一步防止参数泄露，是跨主体数据可信流通的主流技术之一。'},

          {q:'电力需求响应的本质是（　）。',
           o:['新增发电装机容量','通过价格信号或激励补偿引导用户调整用电行为，实现削峰填谷','对用户实施拉闸限电','建设抽水蓄能电站'], a:1,
           e:'需求响应是需求侧资源参与电力平衡的市场化手段，通过分时电价、可中断负荷补偿等机制引导用户主动改变用电时序与用量，属于“源网荷储”中的“荷”侧调节。'},

          {q:'“数据要素×”三年行动计划（2024—2026 年）的核心部署是（　）。',
           o:['在 12 个重点行业和领域推动数据要素高水平应用、释放数据要素乘数效应','全面建设全国统一电力市场','大规模推进特高压输电通道建设','全面推行居民阶梯电价'], a:0,
           e:'该行动计划由国家数据局等 17 部门联合印发，选取工业制造、现代农业、商贸流通、交通运输、金融服务、科技创新、文化旅游、医疗健康、应急管理、气象服务、城市治理、绿色低碳等 12 个领域重点突破。'}
        ]
      },
      {
        key:'gm', name:'二、多选题', type:'multi', per:2,
        items:[
          {q:'构建新型电力系统的关键举措包括（　）。',
           o:['大规模开发利用新能源，推动能源结构转型','提升系统调节能力，发展抽水蓄能与新型储能','建设智慧化调度体系，提升源网荷储协同互动水平','推动新能源、配电网、微电网等领域的示范工程建设'], a:[0,1,2,3],
           e:'四项均为《加快构建新型电力系统行动方案（2024—2027 年）》部署的重点方向，核心是提升系统的绿色化、柔性化与智能化水平。'},

          {q:'“数据二十条”确立的数据产权“三权分置”具体指（　）。',
           o:['数据资源持有权','数据加工使用权','数据产品经营权','数据绝对所有权'], a:[0,1,2],

               '<b>① 资源化层：</b>障碍——数据源分散、标准不一、口径冲突，历史数据质量差，跨专业数据难以贯通。措施——建立企业级数据标准与主数据体系，统一设备、客户、组织编码；建设数据中台/湖仓一体底座，开展数据盘点与质量专项治理，形成“可发现、可理解、可信任”的数据资源目录。<br>' +

               '<b>③ 价值化层：</b>障碍——应用场景挖掘不足、供需错配、跨主体流通不畅、收益分配机制缺失。措施——以业务痛点牵引场景清单（如电力看经济、电力+金融、电力+气象）；依托可信数据空间、隐私计算实现“可用不可见”的跨主体流通；建立数据产品目录与运营机制，明确多方收益分配与责任划分，形成“供给—治理—流通—应用—反哺”的闭环。<br>' +

               '<b>③ 防护层：</b>技术措施覆盖采集（最小必要、授权校验）、传输（加密通道、专网隔离）、存储（加密、分级分域、备份容灾）、使用（权限最小化、动态脱敏、水印溯源）、共享（隐私计算、可信数据空间、审批留痕）、销毁（介质销毁与记录）。<br>' +

           ref:'<b>A 方向：</b>难点——口径不统一（同名不同义）、来源多头（重复建设）、口径变更无人管、指标与业务脱节。<br>解法：①建指标字典，明确业务定义、计算公式、数据来源、统计周期、责任部门“五要素”；②分层设计（原子—派生—复合），避免重复加工；③建立指标注册与变更流程，变更须评估下游影响并同步血缘；④在 BI/报表层统一引用指标服务，禁止私建口径；⑤配套指标质量监控（波动异常、口径漂移告警）。<br><br>' +
               '<b>B 方向：</b>①采集——多源（调度、运检、营销、气象、规程文档）汇聚，先解决授权与分类分级；②清洗——去重去噪、格式与术语归一、缺失与异常处理、时间对齐；③标注——制定规范与示例库，试标校准，多人交叉标注 + 专家仲裁，抽检复核，统计 Kappa；④配比——类别均衡、难例挖掘、必要的数据合成与增强；⑤划分——按时间/主体/场景严格切分，防止泄漏；⑥评测——构建领域基准，覆盖准确率、召回率、幻觉率、拒答率等；⑦运营——数据卡片、版本管理、血缘追溯、反馈回流与定期更新。<br><br>' +

          {q:'【必答，10 分】结合大模型在电力企业的落地实践，论述“数据—模型—场景”闭环的关键环节，并说明各环节的风险控制措施。',
           ref:'<b>① 数据环节：</b>关键——构建领域高质量数据集与知识库（规程、缺陷案例、运行日志、量测时序），完成清洗、标注、脱敏与分类分级。风控——来源合法与授权清晰、敏感数据不出域、训练数据可追溯（血缘）、防止测试集污染。<br>' +

          {q:'请阐述企业推动数据从“资源”走向“资产”再走向“价值”的管理路径，并说明数据资产运营的关键抓手。（10 分）',
           ref:'<b>① 资源化：</b>完成数据盘点与资产目录建设，统一标准与主数据，开展质量治理，使数据“看得见、说得清、信得过”。<br>' +
               '<b>② 资产化：</b>①确权——厘清数据来源、授权链条与使用边界；②估值——综合运用成本法、收益法、市场法；③核算——按准则确认无形资产或存货，规范摊销、减值与披露；④登记——参与数据资产登记、质押融资等创新试点。<br>' +

               '<b>④ 运营抓手：</b>建立数据资产台账与价值看板（有多少、值多少、用得怎样）；设置数据产品经理与运营岗；建立“数据成本—收益”核算机制；配套合规与安全底线；以考核指标（调用量、渗透率、创效额）驱动持续优化。<br>' +
               '<b>加分点：</b>指出“入表不等于增值”，避免为入表而入表；强调价值实现依赖场景与生态，而非单纯的技术封装。'}

      {
        key:'se', name:'四、简答题', type:'essay', per:10,
        items:[
          {q:'【按方向选做 1 题，10 分】<br>A（数据智能治理）：说明如何通过数据治理提升数据产品的可信度与复用率。<br>B（高质量数据集）：说明面向电力设备智能巡检，如何设计并构建一个可评测、可迭代的图像数据集。<br>C（数据产品设计）：以“企业用电能效诊断”为例，说明从需求分析到上线运营的完整产品设计过程与关键交付物。<br>D（场景与生态）：说明数据产品在跨行业生态中（如电力+金融、电力+交通）如何设计商业模式与收益分配机制。',
           ref:'<b>A 方向：</b>①可信度——统一口径与指标字典消除“同名不同义”；建立质量规则与门禁（完整性、准确性、及时性校验），不合格数据不进入产品；提供数据血缘与来源说明，让用户“知其所以然”；输出数据质量报告与置信度提示。<br>②复用率——按“主题域+实体”组织数据资产目录，支持按业务语义检索；沉淀公共维度与标签，避免各产品重复加工；以 API/指标服务方式统一供给，一次治理多方复用；建立复用度统计与激励。<br><br>' +
               '<b>B 方向：</b>①任务定义——明确缺陷类别（如绝缘子破损、销钉缺失、异物悬挂）与判定边界，确定检测/分类任务形态；②采集——覆盖不同设备类型、光照、天气、拍摄角度与分辨率，保证场景多样性与长尾覆盖；③标注——制定标注规范与典型示例，明确最小可辨尺寸、遮挡与模糊样本的处理规则；多人交叉标注+专家仲裁，抽检计算 Kappa；④清洗与配比——去重（同塔同角度连拍）、剔除无效图、类别均衡、难例挖掘；⑤划分——按线路/杆塔划分训练/验证/测试集，避免同一目标跨集泄漏；⑥评测——采用 mAP、召回率、误报率等指标，构建领域基准并做跨站所泛化测试；⑦迭代——现场误报漏报样本回流，定期更新版本，维护数据卡片与血缘。<br><br>' +
               '<b>C 方向：</b>①需求分析——用户为企业的能源管理员/园区运营方，痛点是“不知道钱花在哪、不知道从哪省”；访谈+用能账单分析+现场走访，明确核心价值为“找浪费、给建议、算收益”。②产品定义——功能包括用能画像、峰谷分析与需量预警、同类企业对标、节能改造建议与投资回收期测算；形态为 Web 看板+月度诊断报告+API。③设计——指标体系（单位产值能耗、峰谷电量占比、需量峰值、功率因数）、算法（负荷分解、异常识别、对标分位）、交互原型。④实施——接入营销计量与气象数据，完成模型开发与联调，选择 3—5 家企业试点。⑤上线——合规审查（企业数据脱敏、授权）、灰度发布、培训。⑥运营——按“诊断报告采纳率、节能措施落地率、节省电费额”评估，持续迭代。关键交付物：需求说明书、指标字典、产品原型、算法验证报告、合规评估、试点效果报告、运营看板。<br><br>' +
               '<b>D 方向：</b>①模式设计——数据不出域，通过隐私计算/可信空间输出“核验结果”或“评分标签”，避免原始数据交易；②收费方式——按查询次数、按年度订阅、按业务效果分成（如按促成贷款规模的一定比例）；③定价依据——覆盖数据治理与合规成本，同时让渡部分增量价值给合作方以实现共赢；④收益分配——按“数据提供方—技术加工方—渠道运营方”贡献度约定比例，设置保底+分成结构，明确计量口径与结算周期；⑤治理机制——签订多方协议，明确用途限定、禁止转售、数据销毁、违约责任；由第三方审计或区块链存证保障履约；⑥风险控制——防止过度授信与歧视性定价，落实个人信息保护与消费者权益要求。'},

          {q:'结合“六网协同”与“交能融合”，论述电力数据在推动城市基础设施协同运行中的作用，并说明落地过程中需要破解的难点。（10 分）',
           ref:'<b>① 作用一：规划协同。</b>以电力负荷与电网承载力数据为基础，叠加交通流量、充电需求、通信基站布局、水务泵站与燃气热力负荷，支撑“一张图”规划，避免道路反复开挖、通道资源浪费与配套滞后。<br>' +
               '<b>② 作用二：运行协同。</b>在迎峰度夏、极端天气、重大活动保障等场景，通过多网运行状态联合监测，实现负荷互济（如数据中心、充电桩参与需求响应）、应急联动（停电影响交通信号与通信基站时的快速处置）。<br>' +
               '<b>③ 作用三：服务协同。</b>面向用户提供一体化服务，如“充电+停车+用能”组合服务、园区综合能源服务、基于用电与出行数据的便民服务。<br>' +
               '<b>④ 作用四：价值共创。</b>以数据为纽带催生新业态，如车网互动聚合运营、港口岸电与绿电交易、城市级碳监测与绿色出行积分。<br>' +
               '<b>⑤ 落地难点：</b>一是数据壁垒——各行业数据标准、接口、更新频率不一，缺乏统一目录与共享规则；二是权责不清——数据共享后的安全责任、事故责任难以界定；三是机制缺失——建设投资与收益分配缺乏跨部门结算机制，考核体系各自为政；四是安全约束——电力监控系统安全分区限制数据外送，需通过脱敏、汇聚、隐私计算等方式合规输出；五是能力短板——缺乏既懂电力又懂交通/城建的复合型人才。<br>' +
               '<b>⑥ 破解路径：</b>由政府牵头建立跨部门协同机制与数据共享责任清单；先试点后推广，选择“小切口、高价值”场景（如充电设施选址）；建设城市级可信数据空间，实现“数据不出域、结果可共享”；同步建立标准规范、安全评估与收益分配规则。<br>' +
               '<b>加分点：</b>指出“协同不是把数据都交出去”，而是建立规则下的有限共享；强调试点评估与复制推广的方法论。'}
        ]
      }
    ]
  },

  special: {
    title: '专项模块（50 分）',
    subtitle: '数据智能治理 · 高质量数据集构建 · 数据产品需求分析设计与应用实施 · 应用场景与生态协同',
    groups: [
      {
        key:'ss', name:'一、单选题', type:'single', per:1,
        items:[
          {q:'数据应用场景设计的正确起点是（　）。',
           o:['识别业务痛点与决策链条，明确“谁在什么环节需要什么信息做判断”','先梳理企业有哪些数据','先确定使用哪种算法模型','先搭建技术平台'], a:0,
           e:'场景设计遵循“痛点—决策—信息—数据”的倒推逻辑：先找到需要改进的决策点，再确定所需信息，最后反推数据与算法需求。'},

          {q:'商业模式画布中的“价值主张”在数据产品中回答的核心问题是（　）。',
           o:['我们为客户解决了什么问题、创造了什么独特价值','我们的技术架构如何设计','我们的团队有多少人','我们的服务器放在哪里'], a:0,
           e:'价值主张是商业模式的起点，须清晰到“客户愿意为此付费或改变行为”的程度，而非笼统的“提升效率、赋能管理”。'},

          {q:'数据产品企业在生态中构建竞争壁垒，最有效的“卡位”方式是（　）。',
           o:['占据不可替代的数据源或深度场景 know-how，并持续迭代形成迁移成本','单纯依靠低价竞争','频繁更换技术栈','尽量少与伙伴合作'], a:0,
           e:'数据产品的护城河来自“独占数据 + 场景理解 + 网络效应 + 切换成本”，单纯的技术或价格都难以形成长期壁垒。'},

          {q:'跨主体数据合作中坚持“最小必要”原则，具体是指（　）。',
           o:['仅采集和使用实现特定目的所必需的最少数据项与最短保存期限','数据量越小越好，不必考虑效果','只使用结构化数据','只与一家伙伴合作'], a:0,
           e:'最小必要包含“字段最小、范围最小、频次最小、期限最短”四层含义，是个人信息保护与数据安全合规的核心原则之一。'},

          {q:'一个数据应用场景从一个行业复制到另一个行业，成功的关键是（　）。',
           o:['沉淀标准化的产品内核，同时针对本地数据条件与业务规则做适配','完全照搬不做任何调整','每次全部重新开发','只复制界面不复制逻辑'], a:0,
           e:'“标准化内核 + 本地化适配”是规模化的通用范式；忽视本地差异会导致“水土不服”，完全定制又无法形成规模效益。'},

          {q:'选择生态合作伙伴时，首要考虑的因素应当是（　）。',
           o:['能力互补性与合规可控性（数据来源合法、安全能力达标）','对方规模越大越好','合作费用越低越好','对方承诺的收益越高越好'], a:0,
           e:'生态合作的本质是能力互补，但前提是合规可控；与数据来源不清或安全能力不足的伙伴合作，可能带来连带合规风险。'},

          {q:'数据产品在生态中形成“网络效应”的典型表现是（　）。',
           o:['参与的主体与数据越多，产品对每个用户的价值越大','用户越多，服务器成本越低','功能越多，价格越高','合作伙伴越少，议价能力越强'], a:0,
           e:'网络效应是数据产品规模化的重要杠杆，如用电企业信用标签覆盖越广，金融机构风控越准，进而吸引更多机构接入。'},

          {q:'评估一个数据应用场景优先级时，常用的“价值—可行性”矩阵中，“可行性”主要考察（　）。',
           o:['数据可得性、技术成熟度、合规约束与实施成本','市场规模与收入潜力','领导重视程度','竞争对手的数量'], a:0,
           e:'价值维度看“能带来多少收益”，可行性维度看“能不能做成、合不合规、要花多少”，优先做“高价值、高可行”的场景。'},

          {q:'跨行业数据融合面临的最深层障碍通常是（　）。',
           o:['数据标准不统一、权责边界不清与激励不足，导致“不愿共、不敢共、不会共”','服务器算力不足','缺少编程人员','没有合适的数据库产品'], a:0,
           e:'技术可以采购，机制难以速成。跨行业融合的关键是建立标准、明确权责、设计激励，技术只是实现手段。'},

          {q:'评价一个数据应用场景是否真正落地，最可靠的依据是（　）。',
           o:['业务指标是否改善、是否形成稳定使用与可量化价值','系统是否成功上线','汇报演示是否顺利','代码行数与功能数量'], a:0,
           e:'“上线”只是技术事件，“落地”是业务事件。判断标准应是使用率、流程嵌入度与效益产出，而非系统是否建成。'}
        ]
      },
      {
        key:'sm', name:'二、多选题', type:'multi', per:2,
        items:[
          {q:'系统挖掘数据应用场景的常用方法包括（　）。',
           o:['沿着业务价值链逐环节梳理痛点与决策点','分析现有数据与业务的“错配点”，寻找未被满足的信息需求','对标国内外标杆案例，做本地化改造','组织业务、数据、技术多方参与的场景工作坊'], a:[0,1,2,3],
           e:'场景挖掘既要“向内看流程”，也要“向外看标杆”，更要“多方共创”，单一视角容易遗漏高价值机会。'},

          {q:'跨主体数据生态协同需要建立的机制包括（　）。',
           o:['统一的数据标准、接口规范与质量要求','清晰的权责约定与安全责任划分','合理的收益分配与成本分摊机制','争议解决、审计与退出机制'], a:[0,1,2,3],
           e:'生态的可持续性取决于“规则是否公平、责任是否清晰、收益是否合理”，技术平台只是承载规则的工具。'},

          {q:'交能融合场景下，电力数据可以支撑的具体应用包括（　）。',
           o:['充电设施选址与容量配置，匹配配电网承载力','台区负荷预测与充电高峰错峰引导','V2G 资源聚合参与电网调节','交通枢纽、港口、机场的综合能源优化'], a:[0,1,2,3],
           e:'电力数据在交能融合中既服务于“规划”（选址定容），也服务于“运行”（错峰、互动），还服务于“交易”（绿电与辅助服务）。'},

          {q:'面向新能源场站的电力气象增值服务可以包括（　）。',
           o:['高精度功率预测与预测误差订正服务','极端天气（大风、覆冰、沙尘、雷暴）预警与停机保护建议','设备气象风险画像与运维窗口期推荐','发电量与收益的气象敏感性分析'], a:[0,1,2,3],
           e:'气象服务正从“提供预报”转向“提供决策建议”，按效果付费（如按预测精度提升幅度分成）是常见的商业模式。'},

          {q:'电力数据服务普惠金融时，必须落实的合规要求包括（　）。',
           o:['取得企业（用户）明确授权，明确用途、范围与期限','遵循最小必要，仅提供与风控直接相关的数据或衍生结果','通过隐私计算等技术实现“可用不可见”，防止原始数据外流','建立数据使用审计与退出销毁机制'], a:[0,1,2,3],
           e:'此外还需关注《征信业管理条例》对信用信息服务资质的要求，避免未经许可从事个人征信业务。'},

          {q:'设计数据产品商业模式时，需要明确的关键要素包括（　）。',
           o:['目标客户与付费方（谁受益、谁买单）','收费方式与定价依据（订阅、按量、分成）','成本结构与盈亏平衡点','渠道与交付方式（直销、代理、平台化）'], a:[0,1,2,3],
           e:'特别要识别“使用者”与“付费者”不一致的情况（如政府购买服务、企业使用），这直接决定产品形态与销售策略。'},

          {q:'推动数据应用场景规模化复制时，应重点做好（　）。',
           o:['沉淀标准化组件与可配置能力，降低单点实施成本','建立实施方法论与交付模板（含合规检查清单）','培养本地化实施与运营团队','要求每个项目完全定制以满足个性需求'], a:[0,1,2],
           e:'D 项错误。完全定制会摧毁规模经济，正确的做法是“内核标准、参数可配、场景适配”。'}
        ]
      },
      {
        key:'sj', name:'三、判断题（正确选 A，错误选 B）', type:'judge', per:1,
        items:[
          {q:'数据应用场景的价值大小，主要取决于所用技术的先进性。', a:1,
           e:'错误。技术只是实现手段，场景价值取决于痛点强度、覆盖规模与可量化收益；过度追求先进技术往往是“技术自嗨”。'},
          {q:'在跨行业场景中，“使用者”与“付费者”不一定是同一主体，商业模式设计需分别考虑。', a:0,
           e:'正确。例如政府购买数据服务供中小企业使用，付费方是政府、使用方是企业，产品形态与推广方式需据此调整。'},
          {q:'生态合作中，只要签订了数据保密协议，就可以不再做技术层面的安全防护。', a:1,
           e:'错误。协议是必要不充分条件，须配合访问控制、加密、脱敏、审计与存证等技术手段，形成“制度+技术”双重保障。'},
          {q:'场景复制时应保持核心逻辑一致，但需针对本地数据条件与制度环境做适配。', a:0,
           e:'正确。“标准内核 + 本地适配”是跨区域、跨行业复制的通行做法。'},
          {q:'一个场景如果无法量化价值，通常也难以获得持续的资源和预算支持。', a:0,
           e:'正确。价值量化是争取投入与证明成效的基础，无法量化的场景容易被当作“锦上添花”而优先削减。'},
          {q:'数据产品在生态中应尽量独占全部环节，不与伙伴分工合作。', a:1,
           e:'错误。数据产品链条长，独占全部环节既不经济也不现实；应聚焦自身最具优势的环节（数据或场景理解），通过分工放大整体价值。'}
        ]
      },
      {
        key:'se', name:'四、简答题', type:'essay', per:10,
        items:[
          {q:'【按方向选做 1 题，10 分】<br>A（数据智能治理）：说明在跨主体数据协同场景中，如何通过治理手段保障数据“可信、可控、可追溯”。<br>B（高质量数据集）：面向“电力+气象”融合应用，说明所需数据集构成与融合治理方法。<br>C（数据产品设计）：说明如何为“园区综合能源服务”设计数据产品体系与实施路径。<br>D（场景与生态）：选择一个你最熟悉的电力数据应用场景，完整说明“痛点—数据—产品—模式—生态”的设计逻辑。',
           ref:'<b>A 方向：</b>可信——建立数据质量规则与准入校验，出具数据质量报告与数据卡片，让使用方“知其来源、知其精度”；可控——基于分类分级实施差异化授权，采用隐私计算/可信数据空间实现“可用不可见、可控可计量”，设置用途、期限、次数的硬约束；可追溯——全链路血缘记录数据来源与加工过程，操作日志与区块链存证确保不可篡改，支持事后审计与责任追溯；配套多方协议明确权责与违约条款，并建立定期审计与退出销毁机制。<br><br>' +
               '<b>B 方向：</b>数据集构成：①气象侧——格点数值预报（风速、辐照、温度、湿度、降水）、实况观测（气象站、测风塔、卫星云图、雷达）、灾害预警信息；②电力侧——场站装机与设备参数、历史出力与限电记录、机组状态与检修计划、输电通道地理信息；③融合标签——覆冰/舞动/山火等历史事件标注、异常天气下的故障记录。<br>' +
               '融合治理：时空对齐（统一坐标系、时区与时间分辨率，格点插值到杆塔/场站）；质量控制（气象数据缺测插补、异常值剔除，电力数据清洗与标幺化）；特征工程（构建微地形、迎风坡、通道走廊等衍生特征）；标注规范（事件定义、影响范围、时间窗）；版本管理与血缘追溯；按时间切分训练/测试集防止泄漏；建立精度评测基准（功率预测误差、预警命中率与虚警率）。<br><br>' +
               '<b>C 方向：</b>产品体系分三层：①数据底座层——园区用能数据汇聚（电、水、气、热）、设备台账、气象数据，形成统一数据模型；②分析服务层——能效诊断（单位产值能耗、设备能效比）、负荷预测、光伏出力预测、需量预警、碳排核算；③应用层——园区能效看板、节能改造建议与投资收益测算、绿电交易与碳资产管理、需求响应代理。<br>' +
               '实施路径：试点选取 1—2 个园区 → 完成数据接入与模型验证 → 输出诊断报告验证价值 → 打磨标准化产品 → 向同类园区复制（标准内核+本地适配）→ 建立运营团队与收费模式（SaaS 订阅/节能分成）。关键交付物：数据接入规范、指标体系、算法模型与验证报告、产品原型、实施方法论、运营指标看板。<br><br>' +
               '<b>D 方向（以电力数据服务普惠金融为例）：</b>痛点——小微企业缺抵押、缺规范报表，银行尽调成本高、风险难判；数据——企业用电量、用电趋势、缴费记录、负荷特征、行业对标；产品——企业经营活力指数、用电信用标签、贷前核验 API、贷后预警服务；模式——按查询次数收费或按促成贷款规模分成，与银行、征信机构、担保机构分工；生态——电网企业供数（不出域）、科技公司做加工与建模、金融机构做应用、监管部门做监督，通过可信数据空间实现多方协作；保障——企业授权、最小必要、用途限定、审计存证、退出销毁，并防范歧视性定价与过度授信。'},
          {q:'【必答，10 分】数据产品从“内部可用”走向“对外赋能”时，价值实现方式与风险结构都会发生变化。请论述这一转变过程中的关键问题与应对策略。',
           ref:'<b>① 价值实现方式的变化：</b>内部以“降本提效”为主，价值通过工时节省、决策提速间接体现；对外则以“创收、分成、订阅”为主，需明确付费方、定价依据与交付标准，价值必须可被客户感知与验证。<br>' +
               '<b>② 关键问题一：合规边界扩大。</b>内部使用受企业制度约束，对外则涉及数据出境、个人信息、商业秘密、行业监管等多重约束。应对：建立对外提供的前置合规审查清单，明确授权链条、脱敏要求、用途限定与合同条款，必要时通过可信数据空间交付。<br>' +
               '<b>③ 关键问题二：质量与责任加重。</b>对外产品的数据错误可能引发客户损失与法律责任。应对：建立数据质量 SLA、结果置信度提示与免责条款，完善错误反馈与快速修正机制。<br>' +
               '<b>④ 关键问题三：产品形态需重构。</b>内部工具往往依赖“懂业务的人”使用，对外必须做到“开箱即用”。应对：抽象为标准 API/报告/指数，配套文档、培训与技术支持，降低使用门槛。<br>' +
               '<b>⑤ 关键问题四：商业模式与组织能力不足。</b>应对：明确收费模式（订阅、按量、分成），建立定价与结算体系；组建产品运营与销售团队，或以生态伙伴渠道分销。<br>' +
               '<b>⑥ 关键问题五：生态协同与利益分配。</b>对外赋能往往需要多方参与。应对：以协议明确数据提供方、加工方、渠道方的权责与分配比例，建立计量、结算与审计机制。<br>' +
               '<b>⑦ 保障：</b>设置试点先行、灰度放量、效果评估与退出机制，形成“试点—验证—复制—优化”的闭环。<br>' +
               '<b>加分点：</b>强调“对外不是把内部报表开放出去”，而是重新定义产品；提醒防止数据转售与二次扩散。'}
        ]
      }
    ]
  }
};


const PAPERS = {A: PAPER_A, B: PAPER_B, C: PAPER_C, D: PAPER_D};


/* ============ 卷别元信息 ============ */
const META = [
  {k:'A', name:'卷一', tag:'综合基础卷', desc:'新型电力系统 / 数据要素制度 / 数据治理 / 四方向通识'},
  {k:'B', name:'卷二', tag:'安全合规卷', desc:'数据安全法规 / 分类分级 / 智能治理 / 高质量数据集'},
  {k:'C', name:'卷三', tag:'数据产品卷', desc:'数据要素市场 / 资产化 / 产品设计与运营'},
  {k:'D', name:'卷四', tag:'场景生态卷', desc:'六网协同 / 交能融合 / 普惠金融 / 电力气象'}
];

/* ============ 状态管理 ============ */
const SKEY = 'dl_exam_v3';
let cur = 'A';
let timerId = null;
const S = {};

function st(k){
  if(!S[k]) S[k] = {answers:{}, essays:{}, submitted:false, showAll:false, left:3600};
  return S[k];
}
function save(){
  try{ localStorage.setItem(SKEY, JSON.stringify({cur, S})); }catch(e){}
}
function restore(){
  try{
    const d = JSON.parse(localStorage.getItem(SKEY) || '{}');
    if(d.S) Object.keys(d.S).forEach(k => S[k] = d.S[k]);
    if(d.cur && PAPERS[d.cur]) cur = d.cur;
  }catch(e){}
}

let items = [];
function buildItems(p){
  const arr = [];
  ['general','special'].forEach(mk=>{
    p[mk].groups.forEach(g=>{
      g.items.forEach((it, i)=>{
        arr.push({id: mk+'-'+g.key+'-'+i, mod: mk, type: g.type, per: g.per, item: it});
      });
    });
  });
  return arr;
}

/* ============ 工具 ============ */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function letters(n){ return 'ABCDEFG'.slice(0, n).split(''); }
function ansText(it, type){
  if(it.a === undefined) return '';
  if(Array.isArray(it.a)){
    const L = letters(it.o ? it.o.length : 2);
    return it.a.map(i => L[i]).join('');
  }
  const L = letters(it.o ? it.o.length : 2);
  return L[it.a];
}

/* ============ 渲染 ============ */
function renderTabs(){
  const box = document.getElementById('tabs');
  box.innerHTML = META.map(m=>{
    const done = (function(){
      const s = st(m.k);
      const its = buildItems(PAPERS[m.k]).filter(x => x.type !== 'essay');
      let d = 0;
      its.forEach(x=>{
        const a = s.answers[x.id];
        if(x.type === 'multi' ? (a && a.length) : (a !== undefined)) d++;
      });
      return d + '/' + its.length;
    })();
    return `<div class="tab${m.k === cur ? ' on' : ''}" data-k="${m.k}">
      <b>${m.name} · ${m.tag}</b><small>${m.desc}</small><small>已答 ${done}</small>
    </div>`;
  }).join('');
  const on = box.querySelector('.tab.on');
  if(on) box.scrollLeft = Math.max(on.offsetLeft - 20, 0);
}

function itemHTML(entry, no, s){
  const it = entry.item, id = entry.id;
  let body = '';
  if(entry.type === 'essay'){
    body = `<textarea data-id="${id}" ${s.submitted ? 'readonly' : ''} placeholder="请在此作答，建议分点分层、先框架后要点，尽量结合电力业务实际…">${esc(s.essays[id] || '')}</textarea>`;
  } else {
    const opts = entry.type === 'judge' ? ['正确','错误'] : it.o;
    const L = letters(opts.length);
    body = '<div class="opts">' + opts.map((o, i)=>{
      const on = (entry.type === 'multi'
        ? (s.answers[id] && s.answers[id].indexOf(i) > -1)
        : s.answers[id] === i) ? ' on' : '';
      return `<div class="opt${on}" data-id="${id}" data-i="${i}" data-type="${entry.type}">
        <span class="tag">${L[i]}</span><span class="txt">${esc(o)}</span></div>`;
    }).join('') + '</div>';
  }
  const typeName = {single:'单选题', multi:'多选题', judge:'判断题', essay:'简答题'}[entry.type];
  return `<div class="q" data-qid="${id}">
    <div class="qh"><span class="no">${no}</span><span class="qt">${typeName} · <b>${entry.per} 分</b></span></div>
    <div class="stem">${it.q}</div>
    ${body}
    ${entry.type === 'essay' ? `<button class="ghost showref" data-id="${id}">查看参考答案 ▾</button>` : ''}
    <div class="ans">
      <div class="ansline"><b>参考答案：</b>${entry.type === 'essay' ? '' : ansText(it, entry.type)}</div>
      <div class="ansline"><b>解析：</b>${it.e || ''}</div>
    </div>
  </div>`;
}

function render(){
  const p = PAPERS[cur], s = st(cur);
  items = buildItems(p);
  let no = 0, html = '';
  ['general','special'].forEach(mk=>{
    const mod = p[mk];
    html += `<section class="mod"><div class="mod-h"><h2>${mod.title}</h2><p>${mod.subtitle}</p></div>`;
    mod.groups.forEach(g=>{
      html += `<div class="grp"><h3>${g.name}（共 ${g.items.length} 题，每题 ${g.per} 分）</h3>`;
      g.items.forEach((it, i)=>{
        const entry = items.find(x => x.id === mk + '-' + g.key + '-' + i);
        no++;
        html += itemHTML(entry, no, s);
      });
      html += `</div>`;
    });
    html += `</section>`;
  });
  document.getElementById('paper').innerHTML = html;

  if(s.showAll){
    document.querySelectorAll('.q').forEach(q=>{
      q.classList.add('show');
      markOne(q, q.dataset.qid, true);
    });
  }
  document.getElementById('btnToggle').textContent = s.showAll ? '隐藏答案' : '显示答案';
  document.getElementById('result').classList.add('hidden');
  if(s.submitted) renderResult(false, true);
  renderTabs();
  updateTimerUI();
  updateProgress();
}

/* ============ 交互 ============ */
document.getElementById('paper').addEventListener('click', e=>{
  const s = st(cur);
  const opt = e.target.closest('.opt');
  if(opt && !s.submitted){
    const id = opt.dataset.id, i = +opt.dataset.i, type = opt.dataset.type;
    if(type === 'multi'){
      let arr = s.answers[id] || [];
      if(arr.indexOf(i) > -1) arr = arr.filter(x => x !== i); else arr = arr.concat([i]);
      s.answers[id] = arr;
      opt.classList.toggle('on');
    } else {
      s.answers[id] = i;
      opt.parentElement.querySelectorAll('.opt').forEach(o => o.classList.remove('on'));
      opt.classList.add('on');
    }
    save(); updateProgress(); renderTabs();
    if(s.showAll){
      const q = document.querySelector('.q[data-qid="' + id + '"]');
      q.classList.remove('right','wrong');
      q.querySelectorAll('.opt').forEach(o => o.classList.remove('right'));
      markOne(q, id, true);
    }
    return;
  }
  const btn = e.target.closest('.showref');
  if(btn){
    btn.closest('.q').classList.add('show');
    btn.style.display = 'none';
  }
});

document.getElementById('paper').addEventListener('input', e=>{
  if(e.target.tagName === 'TEXTAREA'){
    const s = st(cur);
    s.essays[e.target.dataset.id] = e.target.value;
    save();
  }
});

document.getElementById('tabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab');
  if(!t || t.dataset.k === cur) return;
  if(timerId){ clearInterval(timerId); timerId = null; document.getElementById('btnStart').textContent = '开始计时'; }
  cur = t.dataset.k;
  save(); render(); window.scrollTo({top:0, behavior:'smooth'});
});

/* ============ 判分 ============ */
function isRight(entry){
  const a = st(cur).answers[entry.id];
  if(a === undefined) return false;
  const ans = entry.item.a;
  if(Array.isArray(ans)){
    if(!Array.isArray(a) || a.length !== ans.length) return false;
    return a.slice().sort().join(',') === ans.slice().sort().join(',');
  }
  return a === ans;
}

function markOne(qEl, id, paint){
  const entry = items.find(x => x.id === id);
  if(!entry || entry.type === 'essay' || !qEl) return;
  const ansArr = Array.isArray(entry.item.a) ? entry.item.a : [entry.item.a];
  qEl.classList.add('show');
  qEl.querySelectorAll('.opt').forEach(o=>{
    if(ansArr.indexOf(+o.dataset.i) > -1 && paint) o.classList.add('right');
  });
  qEl.classList.add(isRight(entry) ? 'right' : 'wrong');
}

function updateProgress(){
  const s = st(cur);
  const its = items.filter(x => x.type !== 'essay');
  let done = 0;
  its.forEach(x=>{
    const a = s.answers[x.id];
    if(x.type === 'multi' ? (a && a.length) : (a !== undefined)) done++;
  });
  document.getElementById('bar').style.width = (done / its.length * 100).toFixed(1) + '%';
}

/* ============ 计时 ============ */
function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
function updateTimerUI(){
  const t = document.getElementById('timer'), s = st(cur);
  t.textContent = fmt(Math.max(s.left, 0));
  t.classList.toggle('low', s.left <= 300);
}
document.getElementById('btnStart').addEventListener('click', function(){
  const s = st(cur);
  if(timerId){
    clearInterval(timerId); timerId = null; this.textContent = '继续计时';
  }else{
    if(s.left <= 0) return;
    this.textContent = '暂停计时';
    timerId = setInterval(()=>{
      const cs = st(cur);
      cs.left--;
      updateTimerUI();
      if(cs.left <= 0){
        clearInterval(timerId); timerId = null;
        document.getElementById('btnStart').textContent = '开始计时';
        save();
        if(!cs.submitted) submit(true);
      }
    }, 1000);
  }
});

/* ============ 显示答案 ============ */
document.getElementById('btnToggle').addEventListener('click', function(){
  const s = st(cur);
  s.showAll = !s.showAll;
  this.textContent = s.showAll ? '隐藏答案' : '显示答案';
  document.querySelectorAll('.q').forEach(q=>{
    if(s.showAll){
      q.classList.add('show');
      markOne(q, q.dataset.qid, true);
    }else{
      q.classList.remove('show','wrong','right');
      q.querySelectorAll('.opt').forEach(o => o.classList.remove('right'));
      const b = q.querySelector('.showref');
      if(b) b.style.display = '';
    }
  });
  save();
});

/* ============ 交卷 ============ */
function submit(auto){
  const s = st(cur), p = PAPERS[cur];
  s.submitted = true;
  if(timerId){ clearInterval(timerId); timerId = null; document.getElementById('btnStart').textContent = '开始计时'; }
  save();
  renderResult(auto, false);
}

function renderResult(auto, restored){
  const p = PAPERS[cur], s = st(cur);
  let objScore = 0, gScore = 0, sScore = 0, gFull = 0, sFull = 0, essayFull = 0;
  const wrongs = [];
  items.forEach((entry, idx)=>{
    if(entry.type === 'essay'){ essayFull += entry.per; return; }
    if(entry.mod === 'general') gFull += entry.per; else sFull += entry.per;
    if(isRight(entry)){
      objScore += entry.per;
      if(entry.mod === 'general') gScore += entry.per; else sScore += entry.per;
    }else{
      wrongs.push({no: idx + 1, ans: ansText(entry.item, entry.type), q: entry.item.q});
    }
    markOne(document.querySelector('.q[data-qid="' + entry.id + '"]'), entry.id, true);
  });

  const objFull = gFull + sFull;
  const box = document.getElementById('result');
  box.classList.remove('hidden');
  box.innerHTML = `
    <h2>${auto ? '⏰ 时间到，已自动交卷' : (restored ? '📋 本卷已交卷记录' : '✅ 交卷完成')} · ${META.find(m=>m.k===cur).name}判分结果</h2>
    <div class="scorebox">
      <div class="sc"><div class="k">客观题得分（满分 ${objFull}）</div><div class="v">${objScore}<small> / ${objFull}</small></div></div>
      <div class="sc"><div class="k">通用模块</div><div class="v">${gScore}<small> / ${gFull}</small></div></div>
      <div class="sc"><div class="k">专项模块</div><div class="v">${sScore}<small> / ${sFull}</small></div></div>
      <div class="sc"><div class="k">客观题正确率</div><div class="v">${(objScore / objFull * 100).toFixed(0)}<small> %</small></div></div>
    </div>
    ${wrongs.length
      ? `<div class="wronglist"><b>错题与漏答（${wrongs.length} 题）：</b><ul>` +
        wrongs.map(w=>`<li>第 ${w.no} 题（正确答案：${w.ans}）— ${w.q.replace(/（　）/g,'').replace(/<[^>]+>/g,'').slice(0, 40)}…</li>`).join('') +
        `</ul></div>`
      : `<div class="wronglist"><b>客观题全部正确，表现优秀。</b></div>`}
    <div class="tip">简答题共 ${essayFull} 分，请对照各题“参考答案”按要点自评：要点齐全、有框架分层、结合电力业务实际方可给满分。最终总分 = 客观题得分 + 简答自评分。</div>
  `;
  box.scrollIntoView({behavior:'smooth'});
}

document.getElementById('btnSubmit').addEventListener('click', ()=>{
  if(st(cur).submitted && !confirm('本卷已交卷，重新判分将保留现有作答。继续？')) return;
  submit(false);
});

/* ============ 重置 ============ */
document.getElementById('btnReset').addEventListener('click', ()=>{
  if(!confirm('确定清空本卷全部作答并重新开始？')) return;
  S[cur] = null;
  if(timerId){ clearInterval(timerId); timerId = null; document.getElementById('btnStart').textContent = '开始计时'; }
  save(); render(); window.scrollTo({top:0, behavior:'smooth'});
});

document.getElementById('btnPrint').addEventListener('click', ()=>{
  st(cur).showAll = true;
  document.querySelectorAll('.q').forEach(q => q.classList.add('show'));
  window.print();
});

/* ============ 启动 ============ */
restore();
if(!PAPERS[cur]) cur = 'A';
render();
</script>
</body>
</html>
