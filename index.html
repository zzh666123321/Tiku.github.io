<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#0b63c5">
<title>2026 电力数据智能应用技能竞赛 · 理论考试刷题系统</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --txt:#1a2029; --sub:#5b6675; --line:#e3e8ef;
  --pri:#0b63c5; --pri-l:#e9f1fb; --ok:#0a8a5f; --ok-l:#e8f6f0;
  --err:#d13438; --err-l:#fdecec; --warn:#b26a00; --warn-l:#fff5e6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  font-size:15px;line-height:1.7}
header.bar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand span{color:var(--pri)}
.tools{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;color:var(--pri);
  background:var(--pri-l);padding:5px 11px;border-radius:8px;min-width:84px;text-align:center}
.timer.low{color:var(--err);background:var(--err-l)}
button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:7px;
  border:1px solid var(--line);background:#fff;color:var(--txt);padding:6px 12px;transition:.15s}
button:hover{border-color:var(--pri);color:var(--pri)}
button.primary{background:var(--pri);border-color:var(--pri);color:#fff}
button.primary:hover{background:#0a56ab;color:#fff}
button.danger{border-color:#e8b8b8;color:var(--err)}
button:disabled{opacity:.45;cursor:not-allowed}
.progress{height:3px;background:var(--line)}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,#0b63c5,#12a8a0);transition:width .25s}
main{max-width:960px;margin:0 auto;padding:16px 18px 96px}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-size:13.5px;cursor:pointer;white-space:nowrap;line-height:1.35;transition:.15s}
.tab b{display:block;font-size:14px}
.tab small{display:block;color:var(--sub);font-size:11.5px}
.tab:hover{border-color:#a8c6e8}
.tab.on{background:linear-gradient(135deg,#0b63c5,#1189c4);border-color:transparent;color:#fff;
  box-shadow:0 4px 12px rgba(11,99,197,.22)}
.tab.on small{color:rgba(255,255,255,.85)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.panel h2{margin:0 0 8px;font-size:17px}
.panel p{margin:5px 0;color:#33404f;font-size:14px}
.panel .muted{color:var(--sub);font-size:13px}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
select,input[type=text]{font-family:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);
  border-radius:7px;background:#fff;color:var(--txt);outline:none;max-width:100%}
select:focus,input[type=text]:focus{border-color:var(--pri)}
input[type=text]{flex:1;min-width:170px}
label.ck{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--sub);cursor:pointer}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.stat .sc{flex:1;min-width:110px;background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.stat .k{font-size:12px;color:var(--sub)}
.stat .v{font-size:20px;font-weight:700;color:var(--pri);font-variant-numeric:tabular-nums}
.notice{font-size:13.5px;color:#33404f;white-space:pre-line;background:#f7f9fc;border-left:3px solid var(--pri);
  padding:10px 13px;border-radius:0 8px 8px 0;margin:8px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.kv{font-size:13.5px;color:#33404f}
.kv b{color:var(--pri)}

.mod-h{background:linear-gradient(135deg,#0b63c5,#1189c4);color:#fff;border-radius:11px;
  padding:13px 18px;margin:20px 0 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mod-h h2{margin:0;font-size:18px}
.mod-h p{margin:0;font-size:12.5px;opacity:.9}
.mod-h .cnt{margin-left:auto;font-size:12.5px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px}

.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 17px;margin-bottom:10px}
.q:hover{border-color:#c9d8ea}
.q.right{border-color:#bfe3d2}
.q.wrong{border-color:#f0b7b7;background:#fffafa}
.qh{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.no{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;
  background:var(--pri-l);color:var(--pri);font-size:12px;font-weight:700;border-radius:6px;padding:0 7px}
.badge{font-size:11.5px;padding:1px 7px;border-radius:5px;background:#eef2f8;color:var(--sub)}
.badge.mock{background:var(--warn-l);color:var(--warn)}
.badge.legacy{background:#e6f5f2;color:#0b7a70}
.badge.exam{background:#efe9fb;color:#6b41c0}
.topic{font-size:11.5px;color:var(--sub)}
.dup{font-size:11.5px;color:var(--warn);background:var(--warn-l);padding:1px 7px;border-radius:5px}
.fav{margin-left:auto;border:none;background:transparent;padding:2px 6px;font-size:16px;color:#b9c1cc;line-height:1}
.fav.on{color:#e6a417}
.stem{margin-bottom:10px;font-size:15px;line-height:1.75;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:8px 12px;border-radius:8px;
  border:1px solid var(--line);cursor:pointer;transition:.13s;user-select:none;min-height:40px}
.opt:hover{background:#f7f9fc;border-color:#c9d8ea}
.opt .tag{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:#eef1f6;color:var(--sub);
  font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.opt .txt{flex:1}
.opt.on{background:var(--pri-l);border-color:var(--pri)}
.opt.on .tag{background:var(--pri);color:#fff}
.opt.on .txt{color:#0a4d9c;font-weight:600}
.opt.right{background:var(--ok-l);border-color:#7fc9a8}
.opt.right .tag{background:var(--ok);color:#fff}
.opt.miss{background:var(--err-l);border-color:#e6a3a3}
.opt.miss .tag{background:var(--err);color:#fff}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  font-family:inherit;font-size:14px;resize:vertical;outline:none;color:var(--txt);background:#fcfdff}
textarea:focus{border-color:var(--pri);background:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.acts button{font-size:12.5px;padding:5px 11px}
.fb{display:none;margin-top:10px;font-size:13px;font-weight:600;padding:7px 11px;border-radius:7px}
.fb.ok{display:block;background:var(--ok-l);color:var(--ok)}
.fb.no{display:block;background:var(--err-l);color:var(--err)}
.fb.rev{display:block;background:var(--pri-l);color:var(--pri)}
.ans{display:none;margin-top:10px;padding:11px 14px;background:#f7f9fc;border-left:3px solid var(--pri);
  border-radius:0 8px 8px 0;font-size:13.5px;color:#33404f;white-space:pre-wrap}
.q.show .ans{display:block}
.ans .lb{font-weight:700;color:var(--pri);margin-right:5px}
.ans .blk{margin-bottom:7px}
.ans .tip{color:var(--warn);background:var(--warn-l);padding:6px 9px;border-radius:6px}
.selfbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;align-items:center;font-size:12.5px;color:var(--sub)}
.selfbar button.on{background:var(--pri);border-color:var(--pri);color:#fff}

.result{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:18px 0}
.result h2{margin:0 0 12px;font-size:18px}
.score{font-size:34px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums}
.score small{font-size:15px;font-weight:400;color:var(--sub)}
.rtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:12px}
.rtable th,.rtable td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
.rtable th{color:var(--sub);font-weight:600;font-size:12.5px}
.empty{text-align:center;color:var(--sub);padding:44px 12px;font-size:14px}
.footnote{font-size:12.5px;color:var(--sub);text-align:center;padding:18px 0 0}

@media(max-width:640px){
  header.bar{padding:8px 12px;gap:8px}
  .brand{font-size:13.5px}
  .tools{position:fixed;left:0;right:0;bottom:0;z-index:70;margin:0;padding:8px 10px;
    background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .tools .timer{grid-column:span 1}
  .tools button{padding:7px 4px;font-size:12px}
  main{padding:12px 12px 110px}
  .opt{min-height:44px;padding:9px 11px}
  textarea{font-size:16px}
  .panel{padding:12px}
  .tabs{gap:6px}
  .tab{padding:8px 12px}
}
@media print{
  header.bar,.tabs,.panel,.acts,.selfbar,.progress{display:none!important}
  main{padding:0;max-width:none}
  .q{break-inside:avoid;box-shadow:none}
  .ans{display:block!important}
  body.exam-locked .ans{display:none!important}
  body{background:#fff}
}
</style>
</head>

<header class="bar">
  <div class="brand">⚡ <span>理论考试刷题系统</span> · 2026</div>

</main>

、外部审计机构或数据接收方。","source":"","tip":"","dup":""},{"id":"S4","bank":"official","no":4,"type":"single","typeName":"单选题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"处理个人信息达到国家网信部门规定数量的个人信息处理者，应当（    ）","options":[{"k":"A","v":"指定个人信息保护负责人"},{"k":"B","v":"成立主要由外部成员组成的独立监督机构"},{"k":"C","v":"每半年开展一次个人信息保护合规审计"},{"k":"D","v":"将全部个人信息转移至境外存储"}],"answer":"A","ref":"","exp":"《个人信息保护法》第五十二条：处理个人信息达到国家网信部门规定数量的个人信息处理者，应当指定个人信息保护负责人。B 是第五十八条对「提供重要互联网平台服务、用户数量巨大、业务类型复杂」处理者的特殊要求；C 的半年审计周期、D 的全量境外存储均无法律依据。","source":"","tip":"","dup":""},{"id":"S5","bank":"official","no":5,"type":"single","typeName":"单选题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"数据处理者开展数据分类分级工作，应主要依据的标准是（    ）","options":[{"k":"A","v":"GB/T 35273-2020《信息安全技术 个人信息安全规范》"},{"k":"B","v":"GB/T 43697-2024《数据安全技术 数据分类分级规则》"},{"k":"C","v":"GB/T 37988-2019《信息安全技术 数据安全能力成熟度模型》"},{"k":"D","v":"GB/T 46796-2025《数据安全技术 数据接口安全风险监测方法》"}],"answer":"B","ref":"","exp":"GB/T 43697—2024《数据安全技术 数据分类分级规则》是我国开展数据分类分级工作的主要通用国家标准。A 是个人信息安全规范，C 是数据安全能力成熟度模型（DSMM），D 是数据接口安全风险监测方法，均不承担分类分级规则的功能。","source":"","tip":"补充：GB/T 43697—2024 于 2024 年发布，是《数据安全法》分类分级保护制度落地的核心推荐性国标。","dup":""},{"id":"S6","bank":"official","no":6,"type":"single","typeName":"单选题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"根据《附件2：数据安全政策法规文件清单》，下列文件中属于部门规章的是（    ）","options":[{"k":"A","v":"《中华人民共和国数据安全法》"},{"k":"B","v":"《网络数据安全管理条例》"},{"k":"C","v":"《能源行业数据安全管理办法（试行）》"},{"k":"D","v":"《数据安全技术 数据分类分级规则》"}],"answer":"C","ref":"","exp":"按《数据安全政策法规文件清单》的效力层级：A《数据安全法》是全国人大常委会制定的法律；B《网络数据安全管理条例》是国务院制定的行政法规；C《能源行业数据安全管理办法（试行）》由国家能源局制定，属部门规章；D 是国家标准。","source":"","tip":"","dup":""},{"id":"S7","bank":"official","no":7,"type":"single","typeName":"单选题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"工业和信息化领域数据处理者应当在备案内容发生重大变化后（    ）内履行备案变更手续。","options":[{"k":"A","v":"一个月"},{"k":"B","v":"三个月"},{"k":"C","v":"六个月"},{"k":"D","v":"一年"}],"answer":"B","ref":"","exp":"《工业和信息化领域数据安全管理办法（试行）》规定，数据处理者备案内容发生重大变化的，应当在三个月内履行备案变更手续。注意与「重要数据和核心数据目录备案」「年度风险评估报告报送」等时限区分。","source":"","tip":"","dup":""},{"id":"S8","bank":"official","no":8,"type":"single","typeName":"单选题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"数据处理者跨不同法人主体提供、转移、共享核心数据的，应当（    ）","options":[{"k":"A","v":"无需采取额外措施，直接传输即可"},{"k":"B","v":"采取必要的安全保护措施，并告知数据接收方按照对应级别进行分类分级保护"},{"k":"C","v":"仅需在内部会议中口头说明即可"},{"k":"D","v":"直接向社会公开以接受监督"}],"answer":"B","ref":"","exp":"核心数据实行最严格管理。跨不同法人主体提供、转移、共享核心数据的，应当采取必要的安全保护措施，并告知数据接收方按照对应级别进行分类分级保护。A、C 弱化管理要求，D 直接公开更是严重违规，责任也不会随转移而免除。","source":"","tip":"","dup":""},{"id":"S9","bank":"official","no":9,"type":"single","typeName":"单选题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"个人信息处理者因合并、分立、解散、被宣告破产等原因需要转移个人信息的，应当向个人告知（    ）","options":[{"k":"A","v":"接收方的名称或者姓名和联系方式"},{"k":"B","v":"数据转移的商业对价"},{"k":"C","v":"内部审批流程与经办人员名单"},{"k":"D","v":"数据中心的物理地址"}],"answer":"A","ref":"","exp":"《个人信息保护法》第二十二条：因合并、分立、解散、被宣告破产等原因需要转移个人信息的，应当向个人告知接收方的名称或者姓名和联系方式；接收方继续履行处理者义务，变更原处理目的、方式的还需重新取得同意。商业对价、内部流程、机房地址均非法定告知事项。","source":"","tip":"","dup":""},{"id":"S10","bank":"official","no":10,"type":"single","typeName":"单选题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"关于数据出境，下列说法正确的是（    ）","options":[{"k":"A","v":"在中华人民共和国境内收集和产生的重要数据、核心数据可自由向境外提供"},{"k":"B","v":"法律、行政法规有境内存储要求的，应当在境内存储，确需向境外提供的，应当依法依规进行数据出境安全评估"},{"k":"C","v":"只要与境外接收方签订商业合同即可向境外提供重要数据"},{"k":"D","v":"数据出境不需要履行任何合规程序"}],"answer":"B","ref":"","exp":"《数据安全法》《网络数据安全管理条例》《数据出境安全评估办法》确立：法律、行政法规有境内存储要求的数据应在境内存储，确需向境外提供的应依法依规申报数据出境安全评估。A、C、D 都以合同或自由流动替代法定程序，均错误。","source":"","tip":"","dup":""},{"id":"S11","bank":"official","no":11,"type":"single","typeName":"单选题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"关键信息基础设施运营者以外的数据处理者自当年1月1日起累计向境外提供（    ）个人信息（不含敏感个人信息）的，应当订立个人信息出境标准合同或者通过个人信息保护认证。","options":[{"k":"A","v":"不满1万人"},{"k":"B","v":"10万人以上、不满100万人"},{"k":"C","v":"100万人以上"},{"k":"D","v":"500人以上"}],"answer":"B","ref":"","exp":"《促进和规范数据跨境流动规定》：关键信息基础设施运营者以外的数据处理者，自当年1月1日起累计向境外提供 10 万人以上、不满 100 万人个人信息（不含敏感个人信息），或不满 1 万人敏感个人信息的，可通过订立标准合同或个人信息保护认证出境；达到 100 万人或 1 万人敏感个人信息则须申报安全评估。","source":"","tip":"","dup":""},{"id":"S12","bank":"official","no":12,"type":"single","typeName":"单选题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据《中华人民共和国数据安全法》，国家建立数据分类分级保护制度，关系国家安全、国民经济命脉、重要民生、重大公共利益等数据属于（    ）。","options":[{"k":"A","v":"一般数据"},{"k":"B","v":"重要数据"},{"k":"C","v":"国家核心数据"},{"k":"D","v":"敏感数据"}],"answer":"C","ref":"","exp":"《数据安全法》第二十一条：国家建立数据分类分级保护制度，关系国家安全、国民经济命脉、重要民生、重大公共利益等数据属于国家核心数据，实行更加严格的管理；重要数据是核心数据之外、一旦泄露可能危害国家安全等的数据。","source":"","tip":"","dup":""},{"id":"S13","bank":"official","no":13,"type":"single","typeName":"单选题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据《中华人民共和国个人信息保护法》，个人信息处理者因业务等需要确需向中华人民共和国境外提供个人信息的，下列不属于其应当具备的条件之一的是（    ）。","options":[{"k":"A","v":"依照本法第四十条的规定通过国家网信部门组织的安全评估"},{"k":"B","v":"按照国家网信部门的规定经专业机构进行个人信息保护认证"},{"k":"C","v":"按照国家网信部门制定的标准合同与境外接收方订立合同，约定双方的权利和义务"},{"k":"D","v":"取得所在地省级网信部门的事前书面批准"}],"answer":"D","ref":"","exp":"《个人信息保护法》第三十八条列举的出境条件为：通过国家网信部门组织的安全评估、经专业机构进行个人信息保护认证、按网信部门制定的标准合同与境外接收方订立合同，以及法律行政法规规定的其他条件。「省级网信部门事前书面批准」不是法定条件（标准合同是备案而非批准）。","source":"","tip":"","dup":""},{"id":"S14","bank":"official","no":14,"type":"single","typeName":"单选题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"依据《南方能源行业可信数据空间业务操作指引》，在可信数据空间中，原始数据通过连接器接入空间，连接器部署在（    ）。","options":[{"k":"A","v":"数据提供方的可信环境中"},{"k":"B","v":"数据使用方的本地机房"},{"k":"C","v":"空间运营方的中心机房"},{"k":"D","v":"监管方指定的云平台上"}],"answer":"A","ref":"","exp":"《南方能源行业可信数据空间业务操作指引》：原始数据通过连接器接入空间，连接器部署在数据提供方的可信环境中，以保证数据提供方对原始数据的控制权，实现「数据不出域、可用不可见」。B、C、D 都会改变数据控制边界。","source":"","tip":"","dup":""},{"id":"S15","bank":"official","no":15,"type":"single","typeName":"单选题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"依据《可信数据空间发展行动计划（2024—2028年）》附件1，通过预先设置数据使用条件形成控制策略，依托控制策略实时监测数据使用过程，动态决定数据操作许可或拒绝的可信管控技术是（    ）。","options":[{"k":"A","v":"使用控制"},{"k":"B","v":"隐私计算"},{"k":"C","v":"数据沙箱"},{"k":"D","v":"密态计算"}],"answer":"A","ref":"","exp":"《可信数据空间发展行动计划（2024—2028年）》附件1：使用控制是预先设置数据使用条件形成控制策略，依托策略实时监测数据使用过程，动态决定数据操作的许可或拒绝。隐私计算解决计算过程不泄露明文，数据沙箱提供隔离环境，密态计算侧重密态下的处理，均不是「动态决定许可/拒绝」的定义。","source":"","tip":"","dup":""},{"id":"S16","bank":"official","no":16,"type":"single","typeName":"单选题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"依据《高质量数据集 建设指南》（TC609-5-2025-01），在高质量数据集建设全生命周期的各阶段中，属于可选阶段的是（    ）。","options":[{"k":"A","v":"数据需求"},{"k":"B","v":"数据规划"},{"k":"C","v":"数据标注"},{"k":"D","v":"模型验证"}],"answer":"C","ref":"","exp":"《高质量数据集 建设指南》（TC609-5-2025-01）把全生命周期分为数据需求、数据规划、数据采集、数据预处理、数据标注、模型验证等阶段，其中数据标注为可选阶段——无监督预训练语料、纯结构化数据集等无需标注。","source":"","tip":"","dup":""},{"id":"S17","bank":"official","no":17,"type":"single","typeName":"单选题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"依据《高质量数据集 分类指南》（TC609-5-2025-03），行业专识数据集主要用于支撑（    ）的开发和训练。","options":[{"k":"A","v":"通用模型"},{"k":"B","v":"行业模型"},{"k":"C","v":"场景模型"},{"k":"D","v":"多模态大模型"}],"answer":"C","ref":"","exp":"《高质量数据集 分类指南》（TC609-5-2025-03）：通用数据集支撑通用模型，行业通识数据集支撑行业模型，行业专识数据集面向具体业务场景、支撑场景模型的开发与训练。","source":"","tip":"","dup":""},{"id":"S18","bank":"official","no":18,"type":"single","typeName":"单选题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"依据《高质量数据集 格式要求》（TC609-5-2025-02），数据\"授权类型\"（license）元数据的值域不包括（    ）。","options":[{"k":"A","v":"开源"},{"k":"B","v":"商业授权"},{"k":"C","v":"仅内部"},{"k":"D","v":"完全公开"}],"answer":"D","ref":"","exp":"《高质量数据集 格式要求》（TC609-5-2025-02）中「授权类型」（license）元数据的值域为开源、商业授权、仅内部等，「完全公开」不属于该字段的取值（另由共享/开放属性描述）。","source":"","tip":"","dup":""},{"id":"S19","bank":"official","no":19,"type":"single","typeName":"单选题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"依据《高质量数据集 质量评测规范》（TC609-5-2025-04），对于无监督机器学习的数据集，\"标注规范性\"子指标的权重取值为（    ）。","options":[{"k":"A","v":"0.125"},{"k":"B","v":"0.25"},{"k":"C","v":"0"},{"k":"D","v":"1"}],"answer":"C","ref":"","exp":"《高质量数据集 质量评测规范》（TC609-5-2025-04）：无监督机器学习的数据集不含标注信息，「标注规范性」子指标不适用，权重取 0；有监督数据集才按相应权重计算。","source":"","tip":"","dup":""},{"id":"S20","bank":"official","no":20,"type":"single","typeName":"单选题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"依据《关于推进行业高质量数据集建设行动的实施方案》，为强化高质量数据集质量测评和结果互认，推动相关单位按照标准、采用统一测评方案和工具开展测评和封装工作，实现（    ）。","options":[{"k":"A","v":"\"一次测评、全国互认\""},{"k":"B","v":"\"一次采集、多方共用\""},{"k":"C","v":"\"一数一源、一源多用\""},{"k":"D","v":"\"谁建设、谁负责\""}],"answer":"A","ref":"","exp":"《关于推进行业高质量数据集建设行动的实施方案》要求强化质量测评和结果互认，推动相关单位按标准、采用统一测评方案和工具开展测评与封装，实现「一次测评、全国互认」，降低重复测评成本。","source":"","tip":"","dup":""},{"id":"S21","bank":"official","no":21,"type":"single","typeName":"单选题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"当前征信公司提供一次个人征信报告的查询普遍是一元钱左右的价格，征信公司A考虑各种因素，将自身征信报告的查询价格定位0.95元，这种定价方法是？","options":[{"k":"A","v":"市场价值法"},{"k":"B","v":"经济价值法"},{"k":"C","v":"成本价值法"},{"k":"D","v":"业务价值法"}],"answer":"A","ref":"","exp":"以市场上同类数据产品（个人征信报告约 1 元/次）的普遍价格为参照，略低于该价格定 0.95 元，属于市场价值法（市场法）。成本价值法以投入成本为基础，经济价值法/业务价值法以预期收益折现为基础，均不体现「对标市价」。","source":"","tip":"","dup":""},{"id":"S22","bank":"official","no":22,"type":"single","typeName":"单选题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"构建组织的数据文化重点是对员工行为意识的改变，重点需要从哪三个方面对员工施加相关的影响？","options":[{"k":"A","v":"习惯、价值观、行为"},{"k":"B","v":"行为、思想和价值观"},{"k":"C","v":"行为、习惯和思想"},{"k":"D","v":"能力、激励和宣贯"}],"answer":"B","ref":"","exp":"数据文化的实质是改变员工的行为意识，重点从行为、思想和价值观三个层面施加影响；习惯、能力、激励、宣贯是落地抓手与手段，不是文化三要素本身。","source":"","tip":"","dup":""},{"id":"S23","bank":"official","no":23,"type":"single","typeName":"单选题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"下列哪项对数据元的描述是错误的？","options":[{"k":"A","v":"数据元是用一组属性描述其定义、标识、表示和允许值的数据单元"},{"k":"B","v":"数据元有清楚的边界和含义"},{"k":"C","v":"数据元代表了最小粒度的数据元素"},{"k":"D","v":"数据元是对各系统元数据的描述"}],"answer":"D","ref":"","exp":"数据元是用一组属性描述其定义、标识、表示和允许值的数据单元，具有清晰边界与含义，是不可再分的最小粒度数据元素。「对各系统元数据的描述」属于元数据/数据字典的范畴，是对数据的描述信息，而非数据元本身。","source":"","tip":"","dup":""},{"id":"S24","bank":"official","no":24,"type":"single","typeName":"单选题","topic":"数据治理与数据要素","scope":"公司战略与数字化","q":"DCMM（国家数据资产管理能力成熟度模型）标准中数据质量分析的主要目的是？","options":[{"k":"A","v":"确定企业数据质量需求的目标"},{"k":"B","v":"找出影响数据质量的原因"},{"k":"C","v":"制定数据质量改进方案"},{"k":"D","v":"构建数据质量管理组织"}],"answer":"B","ref":"","exp":"DCMM 数据质量能力域中，「数据质量分析」的核心目的是定位问题根因、找出影响数据质量的原因；确定质量需求属「数据质量需求」，制定改进方案属「数据质量提升」，构建组织属治理组织职责。","source":"","tip":"","dup":""},{"id":"S25","bank":"official","no":25,"type":"single","typeName":"单选题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"数据二十条重点提到了哪三类数据的分类分级确权授权制度？","options":[{"k":"A","v":"公共数据、隐私数据和重要数据"},{"k":"B","v":"重要数据、个人数据和企业数据"},{"k":"C","v":"公共数据、个人数据和企业数据"},{"k":"D","v":"重要数据，公共数据和企业数据"}],"answer":"C","ref":"","exp":"「数据二十条」（《关于构建数据基础制度更好发挥数据要素作用的意见》）提出建立公共数据、个人数据、企业数据三类数据的分类分级确权授权制度，并探索数据资源持有权、数据加工使用权、数据产品经营权「三权分置」。","source":"","tip":"","dup":""},{"id":"S26","bank":"official","no":26,"type":"single","typeName":"单选题","topic":"数字经济综合","scope":"国家政策与数据要素","q":"企业A的各个系统中对于客户等级定义不一样，有的系统定义为金卡、银卡，有的系统定义为重要、一般等，导致数据整合中出现问题，为了更好的改进这项工作，应该加强哪个能力项的管理？","options":[{"k":"A","v":"业务术语"},{"k":"B","v":"数据模型"},{"k":"C","v":"参考数据和主数据"},{"k":"D","v":"数据治理"}],"answer":"C","ref":"","exp":"各系统对「客户等级」这类跨系统共享的取值定义不一致，属于参考数据和主数据管理问题，需统一编码、取值范围与唯一数据源。业务术语管名词定义，数据模型管结构，数据治理是上位概念。","source":"","tip":"","dup":""},{"id":"S27","bank":"official","no":27,"type":"single","typeName":"单选题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"下列关于数据交易市场的说法中，错误的是？","options":[{"k":"A","v":"数据交易市场是大数据产业发展到一定程度的产物"},{"k":"B","v":"商业化的数据交易活动催生了多方参与的第三方数据交易市场"},{"k":"C","v":"数据交易市场通过生产数据、研发和分析数据，为数据交易提供帮助"},{"k":"D","v":"数据交易市场是大数据资源化的必然产物"}],"answer":"C","ref":"","exp":"数据交易市场（交易所）是提供挂牌、撮合、定价、登记、结算、合规等服务的基础设施，本身不「生产数据、研发和分析数据」——那是数据商/第三方专业机构的功能。A、B、D 描述其产生背景成立。","source":"","tip":"","dup":""},{"id":"S28","bank":"official","no":28,"type":"single","typeName":"单选题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"（ ）是我国数字经济发展的主动力。","options":[{"k":"A","v":"产业数字化"},{"k":"B","v":"数字产业化"},{"k":"C","v":"数据价值化"},{"k":"D","v":"数字化治理"}],"answer":"A","ref":"","exp":"我国数字经济「四化」框架中，产业数字化（传统产业数字化转型）是数字经济发展的主动力和主战场；数字产业化是基础，数据价值化是核心，数字化治理是保障。","source":"","tip":"","dup":""},{"id":"S29","bank":"official","no":29,"type":"single","typeName":"单选题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"\"数据要素二十条\"指出，推动数据要素收益向数据价值和使用价值的（ ）合理倾斜。","options":[{"k":"A","v":"创造者"},{"k":"B","v":"加工者"},{"k":"C","v":"持有者"},{"k":"D","v":"管理者"}],"answer":"A","ref":"","exp":"「数据二十条」明确：推动数据要素收益向数据价值和使用价值的创造者合理倾斜，同时兼顾各参与方利益，体现「谁投入、谁贡献、谁受益」。","source":"","tip":"","dup":""},{"id":"S30","bank":"official","no":30,"type":"single","typeName":"单选题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"《公司数字化转型和数字电网建设行动方案（2020年版）》中指出数据开放共享，按照\"（ ）\"原则建设的数字基础和业务平台，实现全域数据的实时采集和统一供给，打通数据壁垒，提升数据质量，释放大数据应用价值。","options":[{"k":"A","v":"统一谋划、统一部署、统一推进、统一实施"},{"k":"B","v":"统一规划、统一标准、统一建设、统一管理"},{"k":"C","v":"统一设计、自主开发、分层管理、统一推进"},{"k":"D","v":"统一规划、统一运维、统一管理、统一服务"}],"answer":"B","ref":"","exp":"《公司数字化转型和数字电网建设行动方案（2020年版）》要求按「统一规划、统一标准、统一建设、统一管理」原则建设数字基础和业务平台，实现全域数据实时采集与统一供给，打通数据壁垒。","source":"","tip":"","dup":""},{"id":"S31","bank":"official","no":31,"type":"single","typeName":"单选题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"以下关于数字电网主要特征描述错误的是？","options":[{"k":"A","v":"与传统垂直、封闭式的IT架构不同，数字电网采用的是云化、微服务化、互联网化的开放架构"},{"k":"B","v":"与传统层级管理模式不同，数字电网提供统一的数据服务和业务服务，通过构建统一的数据服务架构，实现集中式管理模式"},{"k":"C","v":"与传统电网企业的专业化分工运营不同，数字电网将融通公司内部各专业间的管理边界，加大专业融合力度，减少专业运营模块，促进整体运营管控能力提升"},{"k":"D","v":"在传统价值创造的基础上，开拓了新的价值创造模式。随着数字电网建设形成的数字化能源产业新生态，将开启数字经济在电网企业的发展，形成能源新业态，带来全新价值体现"}],"answer":"B","ref":"","exp":"数字电网构建统一的数据服务架构，目的是打破层级壁垒、实现扁平化与协同化的运营管控，而非强化「集中式管理模式」，故 B 描述错误。A、C、D 分别对应开放架构、专业融合与新价值创造，均为数字电网特征。","source":"","tip":"","dup":""},{"id":"S32","bank":"official","no":32,"type":"single","typeName":"单选题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"（ ）是指以数据价值发现为目标，根据特定的业务需求和场景，对数据按照一定的逻辑进行加工处理，最终形成多种形式的程序或结果数据的过程。","options":[{"k":"A","v":"数据治理"},{"k":"B","v":"数据分析"},{"k":"C","v":"数据挖掘"},{"k":"D","v":"数据应用"}],"answer":"D","ref":"","exp":"数据应用是以数据价值发现为目标，依据特定业务需求与场景，按一定逻辑加工处理数据，最终形成多种形式的程序或结果数据的过程。数据治理是管控保障，数据分析、数据挖掘是其中的具体手段。","source":"","tip":"","dup":""},{"id":"S33","bank":"official","no":33,"type":"single","typeName":"单选题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"为推动大数据产业高质量发展，《\"十四五\"大数据产业发展规划》提出了以释放数据要素价值为导向、做大做强产业本身为（ ）、以强化产业支撑为保障的路径设计。","options":[{"k":"A","v":"标准"},{"k":"B","v":"核心"},{"k":"C","v":"方向"},{"k":"D","v":"目标"}],"answer":"B","ref":"","exp":"《「十四五」大数据产业发展规划》的路径设计：以释放数据要素价值为导向、以做大做强产业本身为核心、以强化产业支撑为保障。","source":"","tip":"","dup":""},{"id":"S34","bank":"official","no":34,"type":"single","typeName":"单选题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"根据《南方电网公司服务碳达峰、碳中和工作方案》，服务碳达峰、碳中和工作重点举措中要加快推进储能技术规模化应用，电网侧着力推进储能（ ）应用。","options":[{"k":"A","v":"与新能源互补"},{"k":"B","v":"调峰调频"},{"k":"C","v":"削峰填谷"},{"k":"D","v":"柔性调压"}],"answer":"B","ref":"","exp":"《南方电网公司服务碳达峰、碳中和工作方案》重点举措：加快推进储能技术规模化应用，电网侧着力推进储能调峰调频应用，支撑高比例新能源接入。","source":"","tip":"","dup":""},{"id":"S35","bank":"official","no":35,"type":"single","typeName":"单选题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"生产运维部门相关负责人通过对设备故障记录进行分析，针对特定品牌型号和不同时间的负载细化了设备运维工作计划。这体现了大数据分析理念中的？","options":[{"k":"A","v":"在数据基础上倾向于全体数据而不是抽样数据"},{"k":"B","v":"在分析方法上更注重相关分析而不是因果分析"},{"k":"C","v":"在分析效果上更追究效率而不是绝对精确"},{"k":"D","v":"在数据规模上强调相对数据而不是绝对数据"}],"answer":"B","ref":"","exp":"由「特定品牌型号 + 不同时间负载」与故障记录之间的相关关系细化运维计划，体现的是大数据分析「更注重相关分析而不是因果分析」；题干未强调全体数据、效率优先或相对规模。","source":"","tip":"","dup":""},{"id":"S36","bank":"official","no":36,"type":"single","typeName":"单选题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》中提出，推进能源革命，\"十四五\"期间我国非化石能源占能源消费总量比重提高到（ ）左右。","options":[{"k":"A","v":"0.1"},{"k":"B","v":"0.2"},{"k":"C","v":"0.3"},{"k":"D","v":"0.4"}],"answer":"B","ref":"","exp":"《「十四五」规划和2035年远景目标纲要》提出推进能源革命，非化石能源占能源消费总量比重提高到 20% 左右（0.2）。","source":"","tip":"","dup":""},{"id":"S37","bank":"official","no":37,"type":"single","typeName":"单选题","topic":"数字经济综合","scope":"公司战略与数字化","q":"某饮料公司只生产几种产品，通过数据分析，发现该公司市场占有率大，但是其生产增长率不高，此时建议该公司采用什么策略？","options":[{"k":"A","v":"防御者战略"},{"k":"B","v":"探索者战略"},{"k":"C","v":"分析者战略"},{"k":"D","v":"反应者战略"}],"answer":"A","ref":"","exp":"市场占有率高而业务增长率不高，对应波士顿矩阵的「现金牛」业务，宜采取防御者战略（守住份额、控制成本、稳定收益）。探索者面向高增长新市场，分析者兼顾两者，反应者被动应对。","source":"","tip":"","dup":""},{"id":"S38","bank":"official","no":38,"type":"single","typeName":"单选题","topic":"数据治理与数据要素","scope":"公司战略与数字化","q":"企业的数据资产不包括？","options":[{"k":"A","v":"设备的运行数据"},{"k":"B","v":"经营管理数据"},{"k":"C","v":"上级的政策文件"},{"k":"D","v":"客户服务数据"}],"answer":"C","ref":"","exp":"数据资产是企业过去形成、由企业拥有或控制、预期能带来经济利益的数据资源，如设备运行数据、经营管理数据、客户服务数据。上级政策文件是外部规范性文件，不由企业拥有或控制，不构成企业数据资产。","source":"","tip":"","dup":""},{"id":"S39","bank":"official","no":39,"type":"single","typeName":"单选题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"\"十四五\"期间，我国关注推动政务信息化共建共用、推动构建网络空间命运共同体，属于（ ）的建设内容。","options":[{"k":"A","v":"科技中国"},{"k":"B","v":"数字中国"},{"k":"C","v":"制造强国"},{"k":"D","v":"网络强国"}],"answer":"B","ref":"","exp":"「十四五」纲要第五篇「加快数字化发展 建设数字中国」涵盖政务信息化共建共用、推动构建网络空间命运共同体等内容，属数字中国建设范畴。","source":"","tip":"","dup":""},{"id":"S40","bank":"official","no":40,"type":"single","typeName":"单选题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"企业组织管理逐渐由以（ ）的线性范式向数据驱动的（ ）范式转型。","options":[{"k":"A","v":"标准化为主，扁平化协同化"},{"k":"B","v":"流程为主，结构化协同化"},{"k":"C","v":"流程为主，扁平化协同化"},{"k":"D","v":"标准化为主，结构化协同化"}],"answer":"C","ref":"","exp":"数字化转型推动组织管理由「以流程为主」的线性范式，向数据驱动的「扁平化、协同化」范式转型：数据贯通打破部门层级，决策从串联流程变为并联协同。","source":"","tip":"","dup":""},{"id":"S41","bank":"official","no":41,"type":"single","typeName":"单选题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"宏观环境分析的常用的模型是？","options":[{"k":"A","v":"PEST模型"},{"k":"B","v":"SWOT模型"},{"k":"C","v":"五力模型"},{"k":"D","v":"生命周期分析模型"}],"answer":"B","ref":"","exp":"按经典管理学，宏观环境（外部）分析常用 PEST/PESTEL 模型，SWOT 是内外部综合态势分析工具，五力模型用于产业竞争环境，生命周期模型用于产品/行业阶段。题库参考答案给 B（SWOT），复习时按题库口径记忆，但应理解 PEST 才是「宏观环境」的规范答案。","source":"","tip":"争议提示：管理学中「宏观环境分析」的规范答案是 PEST，SWOT 为内外部综合态势分析。题库参考答案为 B，正式考试按题库口径作答。","dup":""},{"id":"S42","bank":"official","no":42,"type":"single","typeName":"单选题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"战略任务分解是以年度数据战略目标为目标进行层层分解，进而制定年度数据管理的工作计划，开展战略任务分解一般采用的方法是？","options":[{"k":"A","v":"价值树"},{"k":"B","v":"PEST"},{"k":"C","v":"SWOT"},{"k":"D","v":"价值链"}],"answer":"A","ref":"","exp":"战略任务分解一般用「价值树」：把年度数据战略目标按价值驱动因素层层拆解到具体任务与年度工作计划。PEST 用于宏观环境分析，SWOT 用于态势分析，价值链用于分析业务环节增值。","source":"","tip":"","dup":""},{"id":"S43","bank":"official","no":43,"type":"single","typeName":"单选题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"当前征信公司提供一次个人征信报告的查询普遍是一元钱左右的价格，征信公司A考虑各种因素，将自身征信报告的查询价格定位0.95元，这种定价方法是？","options":[{"k":"A","v":"市场价值法"},{"k":"B","v":"经济价值法"},{"k":"C","v":"成本价值法"},{"k":"D","v":"业务价值法"}],"answer":"A","ref":"","exp":"以市场上同类数据产品（个人征信报告约 1 元/次）的普遍价格为参照，略低于该价格定 0.95 元，属于市场价值法（市场法）。成本价值法以投入成本为基础，经济价值法/业务价值法以预期收益折现为基础，均不体现「对标市价」。","source":"","tip":"","dup":"单选题第 21 题"},{"id":"S44","bank":"official","no":44,"type":"single","typeName":"单选题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"构建组织的数据文化重点是对员工行为意识的改变，重点需要从哪三个方面对员工施加相关的影响？","options":[{"k":"A","v":"习惯、价值观、行为"},{"k":"B","v":"行为、思想和价值观"},{"k":"C","v":"行为、习惯和思想"},{"k":"D","v":"能力、激励和宣贯"}],"answer":"B","ref":"","exp":"数据文化的实质是改变员工的行为意识，重点从行为、思想和价值观三个层面施加影响；习惯、能力、激励、宣贯是落地抓手与手段，不是文化三要素本身。","source":"","tip":"","dup":"单选题第 22 题"},{"id":"S45","bank":"official","no":45,"type":"single","typeName":"单选题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"下列哪项对数据元的描述是错误的？","options":[{"k":"A","v":"数据元是用一组属性描述其定义、标识、表示和允许值的数据单元"},{"k":"B","v":"数据元有清楚的边界和含义"},{"k":"C","v":"数据元代表了最小粒度的数据元素"},{"k":"D","v":"数据元是对各系统元数据的描述"}],"answer":"D","ref":"","exp":"数据元是用一组属性描述其定义、标识、表示和允许值的数据单元，具有清晰边界与含义，是不可再分的最小粒度数据元素。「对各系统元数据的描述」属于元数据/数据字典的范畴，是对数据的描述信息，而非数据元本身。","source":"","tip":"","dup":"单选题第 23 题"},{"id":"S46","bank":"official","no":46,"type":"single","typeName":"单选题","topic":"数据治理与数据要素","scope":"公司战略与数字化","q":"DCMM（国家数据资产管理能力成熟度模型）标准中数据质量分析的主要目的是？","options":[{"k":"A","v":"确定企业数据质量需求的目标"},{"k":"B","v":"找出影响数据质量的原因"},{"k":"C","v":"制定数据质量改进方案"},{"k":"D","v":"构建数据质量管理组织"}],"answer":"B","ref":"","exp":"DCMM 数据质量能力域中，「数据质量分析」的核心目的是定位问题根因、找出影响数据质量的原因；确定质量需求属「数据质量需求」，制定改进方案属「数据质量提升」，构建组织属治理组织职责。","source":"","tip":"","dup":"单选题第 24 题"},{"id":"S47","bank":"official","no":47,"type":"single","typeName":"单选题","topic":"数字经济综合","scope":"国家政策与数据要素","q":"企业A的各个系统中对于客户等级定义不一样，有的系统定义为金卡、银卡，有的系统定义为重要、一般等，导致数据整合中出现问题，为了更好的改进这项工作，应该加强哪个能力项的管理？","options":[{"k":"A","v":"业务术语"},{"k":"B","v":"数据模型"},{"k":"C","v":"参考数据和主数据"},{"k":"D","v":"数据治理"}],"answer":"C","ref":"","exp":"各系统对「客户等级」这类跨系统共享的取值定义不一致，属于参考数据和主数据管理问题，需统一编码、取值范围与唯一数据源。业务术语管名词定义，数据模型管结构，数据治理是上位概念。","source":"","tip":"","dup":"单选题第 26 题"},{"id":"S48","bank":"official","no":48,"type":"single","typeName":"单选题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"（ ）是我国数字经济发展的主动力。","options":[{"k":"A","v":"产业数字化"},{"k":"B","v":"数字产业化"},{"k":"C","v":"数据价值化"},{"k":"D","v":"数字化治理"}],"answer":"A","ref":"","exp":"我国数字经济「四化」框架中，产业数字化（传统产业数字化转型）是数字经济发展的主动力和主战场；数字产业化是基础，数据价值化是核心，数字化治理是保障。","source":"","tip":"","dup":"单选题第 28 题"},{"id":"S49","bank":"official","no":49,"type":"single","typeName":"单选题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"\"数据要素二十条\"指出，推动数据要素收益向数据价值和使用价值的（ ）合理倾斜。","options":[{"k":"A","v":"创造者"},{"k":"B","v":"加工者"},{"k":"C","v":"持有者"},{"k":"D","v":"管理者"}],"answer":"A","ref":"","exp":"「数据二十条」明确：推动数据要素收益向数据价值和使用价值的创造者合理倾斜，同时兼顾各参与方利益，体现「谁投入、谁贡献、谁受益」。","source":"","tip":"","dup":"单选题第 29 题"},{"id":"S50","bank":"official","no":50,"type":"single","typeName":"单选题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"《公司数字化转型和数字电网建设行动方案（2020年版）》中指出数据开放共享，按照\"（ ）\"原则建设的数字基础和业务平台，实现全域数据的实时采集和统一供给，打通数据壁垒，提升数据质量，释放大数据应用价值。","options":[{"k":"A","v":"统一谋划、统一部署、统一推进、统一实施"},{"k":"B","v":"统一规划、统一标准、统一建设、统一管理"},{"k":"C","v":"统一设计、自主开发、分层管理、统一推进"},{"k":"D","v":"统一规划、统一运维、统一管理、统一服务"}],"answer":"B","ref":"","exp":"《公司数字化转型和数字电网建设行动方案（2020年版）》要求按「统一规划、统一标准、统一建设、统一管理」原则建设数字基础和业务平台，实现全域数据实时采集与统一供给，打通数据壁垒。","source":"","tip":"","dup":"单选题第 30 题"},{"id":"S51","bank":"official","no":51,"type":"single","typeName":"单选题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"以下关于数字电网主要特征描述错误的是？","options":[{"k":"A","v":"与传统垂直、封闭式的IT架构不同，数字电网采用的是云化、微服务化、互联网化的开放架构"},{"k":"B","v":"与传统层级管理模式不同，数字电网提供统一的数据服务和业务服务，通过构建统一的数据服务架构，实现集中式管理模式"},{"k":"C","v":"与传统电网企业的专业化分工运营不同，数字电网将融通公司内部各专业间的管理边界，加大专业融合力度，减少专业运营模块，促进整体运营管控能力提升"},{"k":"D","v":"在传统价值创造的基础上，开拓了新的价值创造模式"}],"answer":"B","ref":"","exp":"数字电网构建统一的数据服务架构，目的是打破层级壁垒、实现扁平化与协同化的运营管控，而非强化「集中式管理模式」，故 B 描述错误。A、C、D 分别对应开放架构、专业融合与新价值创造，均为数字电网特征。","source":"","tip":"","dup":"单选题第 31 题"},{"id":"S52","bank":"official","no":52,"type":"single","typeName":"单选题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"大数据中的小数据可能缺失、冗余、存在垃圾数据，但不影响大数据的可信数据，是大数据的（ ）的表现形式。","options":[{"k":"A","v":"价值涌现"},{"k":"B","v":"稳定性涌现"},{"k":"C","v":"质量涌现"},{"k":"D","v":"置信涌现"}],"answer":"C","ref":"","exp":"大数据中局部的「小数据」可能缺失、冗余甚至含垃圾数据，但海量数据整体上仍能通过规模效应涌现出可用、可信的质量特征，称为「质量涌现」。","source":"","tip":"","dup":""},{"id":"S53","bank":"official","no":53,"type":"single","typeName":"单选题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"以下关于大数据的分析理念的说法中错误的选项是？","options":[{"k":"A","v":"在数据基础上倾向于全体数据而不是抽样数据"},{"k":"B","v":"在分析方法上更注重相关分析而不是因果分析"},{"k":"C","v":"在分析效果上更追究效率而不是绝对精确"},{"k":"D","v":"在数据规模上强调相对数据而不是绝对数据"}],"answer":"D","ref":"","exp":"大数据分析理念公认三条：全体数据而非抽样、相关分析而非因果分析、追求效率而非绝对精确。「强调相对数据而不是绝对数据」不是其中之一，且与题干「数据规模」表述自相矛盾。","source":"","tip":"","dup":""},{"id":"S54","bank":"official","no":54,"type":"single","typeName":"单选题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"如下SQL语句中，哪个可能返回null值？(1) select count(*) from t1;(2) select max(col1) from t1;(3) select concat('max=',max(col1)) from t1;","options":[{"k":"A","v":"(1)可能，(2)和(3)不可能"},{"k":"B","v":"(1)不可能，(2)和(3)可能"},{"k":"C","v":"(2)可能，(1)和(3)不可能"},{"k":"D","v":"(2)不可能，(1)和(3)可能"}],"answer":"B","ref":"","exp":"count(*) 即使空表也返回 0，不会返回 NULL；max(col1) 在空表或全为 NULL 时返回 NULL；concat('max=', max(col1)) 在多数数据库中只要参数为 NULL 结果即为 NULL。故 (1) 不可能、(2)(3) 可能，选 B。","source":"","tip":"","dup":""},{"id":"S55","bank":"official","no":55,"type":"single","typeName":"单选题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"在基本K均值算法里，当邻近度函数采用（ ）的时候，合适的质心是簇中各点的中位数。","options":[{"k":"A","v":"曼哈顿距离"},{"k":"B","v":"平方欧几里德距离"},{"k":"C","v":"余弦距离"},{"k":"D","v":"Bregman散度"}],"answer":"A","ref":"","exp":"K 均值中，使簇内误差最小的质心取决于邻近度：曼哈顿距离（L1）对应各维中位数，平方欧几里得距离（L2）对应均值，Bregman 散度下合适质心也是均值类。余弦距离常用于文本向量，不对应中位数质心。","source":"","tip":"","dup":""},{"id":"S56","bank":"official","no":56,"type":"single","typeName":"单选题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"Spark生态系统组件MLlib的应用场景是？","options":[{"k":"A","v":"图结构数据的处理"},{"k":"B","v":"基于历史数据的交互式查询"},{"k":"C","v":"复杂的批量数据处理"},{"k":"D","v":"基于历史数据的数据挖掘"}],"answer":"D","ref":"","exp":"Spark 生态中 MLlib 是机器学习算法库，用于基于历史数据的数据挖掘与建模。图结构数据用 GraphX，交互式查询用 Spark SQL，复杂批量数据处理由 Spark Core/RDD 承担。","source":"","tip":"","dup":""},{"id":"S57","bank":"official","no":57,"type":"single","typeName":"单选题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"定义班员、班长和专业的关系模式S(S#,Sn,Sd,Dc,SA)（属性分别为员工编号、姓名、所在班组、所在班组的班长、年龄）；C(C#,Cn,P#)（属性分别为岗评题编号、岗评题名称、岗评题内容）；SC(S#,C#,G)（属性分别为员工编号、岗评题编号和岗评成绩），则该关系为？","options":[{"k":"A","v":"第一范式"},{"k":"B","v":"第二范式"},{"k":"C","v":"第三范式"},{"k":"D","v":"BC范式"}],"answer":"B","ref":"","exp":"关系模式 S(S#,Sn,Sd,Dc,SA) 中 S#→Sd，且 Sd→Dc（班长由所在班组决定），存在非主属性 Dc 对码 S# 的传递依赖，因此满足第二范式但不满足第三范式，答案为第二范式。","source":"","tip":"","dup":""},{"id":"S58","bank":"official","no":58,"type":"single","typeName":"单选题","topic":"大数据与人工智能技术","scope":"公司战略与数字化","q":"拒绝服务攻击损害了信息系统的哪一项性能？","options":[{"k":"A","v":"完整性"},{"k":"B","v":"可用性"},{"k":"C","v":"保密性"},{"k":"D","v":"可靠性"}],"answer":"B","ref":"","exp":"拒绝服务（DoS）攻击通过耗尽资源使合法用户无法访问服务，破坏的是可用性。完整性防篡改、保密性防泄露，可靠性强调长期无故障运行能力。","source":"","tip":"","dup":""},{"id":"S59","bank":"official","no":59,"type":"single","typeName":"单选题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"神经网络是（ ）学派的成果。","options":[{"k":"A","v":"符号学派"},{"k":"B","v":"联接学派"},{"k":"C","v":"行为学派"},{"k":"D","v":"统计学派"}],"answer":"B","ref":"","exp":"神经网络（深度学习）是联接学派（连接主义）的成果；符号学派对应专家系统与逻辑推理，行为学派对应控制论与强化学习，统计学派对应统计机器学习。","source":"","tip":"","dup":""},{"id":"S60","bank":"official","no":60,"type":"single","typeName":"单选题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"下面关于Jarvis-Patrick（JP）聚类算法的说法不正确的是？","options":[{"k":"A","v":"JP聚类擅长处理噪声和离群点，并且能够处理不同大小、形状和密度的簇"},{"k":"B","v":"JP算法对高维数据效果良好，尤其擅长发现强相关对象的紧致簇"},{"k":"C","v":"JP聚类是基于SNN相似度的概念"},{"k":"D","v":"JP聚类的基本时间复杂度为O(m)"}],"answer":"D","ref":"","exp":"JP 聚类基于共享近邻（SNN）相似度，擅长处理噪声、离群点及不同大小/形状/密度的簇，对高维数据发现强相关对象的紧致簇效果良好（A、B、C 正确）。但构造近邻列表与 SNN 相似度需大量计算，基本时间复杂度并非线性的 O(m)，故 D 说法不正确。","source":"","tip":"","dup":""},{"id":"M1","bank":"official","no":1,"type":"multi","typeName":"不定项选择题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"数据处理者、个人信息处理者在组织保障方面应当落实的要求包括（    ）","options":[{"k":"A","v":"明确数据安全负责人和管理机构"},{"k":"B","v":"由本单位法定代表人或者主要负责人承担数据安全第一责任人职责"},{"k":"C","v":"对关键岗位人员开展安全背景审查、加强相关人员培训"},{"k":"D","v":"数据安全负责人独立于本单位管理体系之外，不受任何约束"}],"answer":"ABC","ref":"","exp":"《网络数据安全管理条例》《数据安全法》要求明确数据安全负责人和管理机构、落实法定代表人或主要负责人第一责任人、对重要数据处理者的关键岗位人员开展安全背景审查与培训。D 错在「独立于管理体系、不受约束」——负责人须在本单位治理与问责框架内履职。","source":"","tip":"","dup":""},{"id":"M2","bank":"official","no":2,"type":"multi","typeName":"不定项选择题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"个人信息处理者处理敏感个人信息，应当履行的义务包括（    ）","options":[{"k":"A","v":"具有特定的目的和充分的必要性，并采取严格保护措施"},{"k":"B","v":"取得个人的单独同意"},{"k":"C","v":"向个人告知处理敏感个人信息的必要性以及对个人权益的影响"},{"k":"D","v":"只需在隐私政策中作概括性提示即可，无需单独告知与同意"}],"answer":"ABC","ref":"","exp":"《个人信息保护法》第二十八至三十条：处理敏感个人信息须具有特定目的和充分必要性并采取严格保护措施、取得个人单独同意、告知处理必要性及对个人权益的影响。D 的概括性提示不能替代单独同意与专门告知。","source":"","tip":"","dup":""},{"id":"M3","bank":"official","no":3,"type":"multi","typeName":"不定项选择题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"个人信息处理者委托处理个人信息时，应当与受托人约定（    ）等内容。","options":[{"k":"A","v":"委托处理的目的、期限"},{"k":"B","v":"处理方式、个人信息的种类"},{"k":"C","v":"保护措施"},{"k":"D","v":"双方的权利和义务"}],"answer":"ABCD","ref":"","exp":"《个人信息保护法》第二十一条：委托处理个人信息应与受托人约定委托处理的目的、期限、处理方式、个人信息种类、保护措施以及双方的权利和义务等，并监督受托人。四项均为法定约定内容。","source":"","tip":"","dup":""},{"id":"M4","bank":"official","no":4,"type":"multi","typeName":"不定项选择题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"建立数据销毁制度，应当明确的内容包括（    ）","options":[{"k":"A","v":"销毁对象"},{"k":"B","v":"销毁规则"},{"k":"C","v":"销毁流程和技术等要求"},{"k":"D","v":"对销毁活动进行记录和留存"}],"answer":"ABCD","ref":"","exp":"《工业和信息化领域数据安全管理办法（试行）》等要求建立数据销毁制度，明确销毁对象、销毁规则、销毁流程和技术等要求，并对销毁活动进行记录和留存，以保证可审计、可追溯。四项全选。","source":"","tip":"","dup":""},{"id":"M5","bank":"official","no":5,"type":"multi","typeName":"不定项选择题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据《工业和信息化领域数据安全管理办法（试行）》，危害程度符合下列（    ）条件之一的数据为重要数据。","options":[{"k":"A","v":"对政治、国土、军事、经济、文化、社会、科技等构成威胁，影响海外利益、生物、太空、极地、深海、人工智能等与国家安全相关的重点领域"},{"k":"B","v":"对工业和信息化领域发展、生产、运行和经济利益等造成严重影响"},{"k":"C","v":"造成重大数据安全事件或生产安全事故，对公共利益或者个人、组织合法权益造成严重影响，社会负面影响大"},{"k":"D","v":"经工业和信息化部评估确定的其他重要数据"}],"answer":"ABCD","ref":"","exp":"《工业和信息化领域数据安全管理办法（试行）》界定重要数据按危害程度判定，涵盖危害国家安全重点领域、严重影响工业和信息化领域发展生产运行与经济利益、引发重大数据安全事件或生产安全事故并造成严重社会影响、以及主管部门评估确定的其他情形。四项全选。","source":"","tip":"","dup":""},{"id":"M6","bank":"official","no":6,"type":"multi","typeName":"不定项选择题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据《能源行业数据安全管理办法（试行）》，能源行业数据分为（    ）。","options":[{"k":"A","v":"一般数据"},{"k":"B","v":"重要数据"},{"k":"C","v":"核心数据"},{"k":"D","v":"敏感数据"}],"answer":"ABC","ref":"","exp":"《能源行业数据安全管理办法（试行）》按一般数据、重要数据、核心数据三级对能源行业数据分类分级保护。「敏感数据」主要是个人信息保护领域的概念（敏感个人信息），不是该办法的分级类别。","source":"","tip":"","dup":""},{"id":"M7","bank":"official","no":7,"type":"multi","typeName":"不定项选择题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据《数据出境安全评估办法》，数据处理者向境外提供数据，有下列（    ）情形之一的，应当通过所在地省级网信部门向国家网信部门申报数据出境安全评估。","options":[{"k":"A","v":"数据处理者向境外提供重要数据"},{"k":"B","v":"关键信息基础设施运营者向境外提供个人信息"},{"k":"C","v":"处理100万人以上个人信息的数据处理者向境外提供个人信息"},{"k":"D","v":"自上年1月1日起累计向境外提供10万人个人信息或者1万人敏感个人信息的数据处理者向境外提供个人信息"}],"answer":"ABCD","ref":"","exp":"《数据出境安全评估办法》第四条：向境外提供重要数据、关基运营者向境外提供个人信息、处理 100 万人以上个人信息者向境外提供个人信息、自上年1月1日起累计向境外提供 10 万人个人信息或 1 万人敏感个人信息者向境外提供个人信息，以及网信部门规定的其他情形，均应申报评估。注意《促进和规范数据跨境流动规定》后续对门槛作了调整，本题按所引规章原文作答。","source":"","tip":"","dup":""},{"id":"M8","bank":"official","no":8,"type":"multi","typeName":"不定项选择题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据 GB/T 45652—2025《网络安全技术 生成式人工智能预训练和优化训练数据安全规范》，对服务提供者的通用安全要求包括（    ）。","options":[{"k":"A","v":"应制定人工智能预训练和优化训练数据的安全管理策略，包含对预训练数据和优化训练数据的保护组织、分类分级规则、数据处理活动安全、数据安全事件应急响应等"},{"k":"B","v":"数据存储时应建立冗余备份等安全防护措施"},{"k":"C","v":"训练阶段的数据应按照每批次进行安全隔离并在批次间建立数据标识，保证训练数据内容的可追溯性"},{"k":"D","v":"对开展训练和优化训练数据处理活动的系统或平台宜至少满足等级保护三级要求"}],"answer":"ABCD","ref":"","exp":"GB/T 45652—2025《网络安全技术 生成式人工智能预训练和优化训练数据安全规范》对服务提供者的通用安全要求包括：制定覆盖组织、分类分级、处理活动安全、应急响应的数据安全管理策略；存储环节建立冗余备份；训练数据按批次隔离并建立标识保证可追溯；训练系统或平台宜至少满足等保三级。四项全选。","source":"","tip":"","dup":""},{"id":"M9","bank":"official","no":9,"type":"multi","typeName":"不定项选择题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"依据《可信数据空间标准体系建设指南（2025年版）》，可信数据空间标准体系结构包括（    ）等6个部分。","options":[{"k":"A","v":"基础共性"},{"k":"B","v":"资源交互"},{"k":"C","v":"可信管控"},{"k":"D","v":"价值共创"},{"k":"E","v":"建设运营"},{"k":"F","v":"应用推广"}],"answer":"ABCDEF","ref":"","exp":"《可信数据空间标准体系建设指南（2025年版）》的标准体系结构由基础共性、资源交互、可信管控、价值共创、建设运营、应用推广 6 个部分构成，覆盖从底座到落地的全链条。","source":"","tip":"","dup":""},{"id":"M10","bank":"official","no":10,"type":"multi","typeName":"不定项选择题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"依据《可信数据空间发展行动计划（2024—2028年）》，关于探索构建跨境可信数据空间，下列表述正确的有（    ）。","options":[{"k":"A","v":"建立高效便利安全的数据跨境流动机制"},{"k":"B","v":"支持自由贸易试验区出台实施数据出境管理清单（负面清单）"},{"k":"C","v":"构建数据跨境传递监控、存证备案、出境管控等能力体系"},{"k":"D","v":"结合数据出境管理清单、重要数据目录等工作机制，提供合规指引、跨境申报咨询等服务"}],"answer":"ABCD","ref":"","exp":"《可信数据空间发展行动计划（2024—2028年）》关于跨境可信数据空间：建立高效便利安全的数据跨境流动机制，支持自贸试验区出台数据出境管理清单（负面清单），构建跨境传递监控、存证备案、出境管控能力体系，并结合清单与重要数据目录提供合规指引、申报咨询。四项全选。","source":"","tip":"","dup":""},{"id":"M11","bank":"official","no":11,"type":"multi","typeName":"不定项选择题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"依据《高质量数据集 建设指南》（TC609-5-2025-01），数据预处理阶段涉及的过程包括（    ）。","options":[{"k":"A","v":"数据转换、数据验证、数据清洗"},{"k":"B","v":"数据聚合、数据抽样"},{"k":"C","v":"特征创建、特征选择"},{"k":"D","v":"信息丰富"}],"answer":"ABCD","ref":"","exp":"《高质量数据集 建设指南》数据预处理阶段涵盖数据转换、验证、清洗，数据聚合与抽样，特征创建与特征选择，以及信息丰富（数据增强/补充）等过程。四项全选。","source":"","tip":"","dup":""},{"id":"M12","bank":"official","no":12,"type":"multi","typeName":"不定项选择题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"依据《高质量数据集 质量评测规范》（TC609-5-2025-04），数据质量指标包括的子指标有（    ）。","options":[{"k":"A","v":"格式规范性、安全规范性、标注规范性"},{"k":"B","v":"结构完整性、内容真实性"},{"k":"C","v":"内容一致性、类型一致性"},{"k":"D","v":"内容干净性"}],"answer":"ABCD","ref":"","exp":"《高质量数据集 质量评测规范》的数据质量指标下设格式规范性、安全规范性、标注规范性、结构完整性、内容真实性、内容一致性、类型一致性、内容干净性等子指标，按有监督/无监督场景赋权。四项全选。","source":"","tip":"","dup":""},{"id":"M13","bank":"official","no":13,"type":"multi","typeName":"不定项选择题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"在南方电网数据资产管理体系中，\"量本利\"特指？","options":[{"k":"A","v":"拓展业务量"},{"k":"B","v":"拓展数据量"},{"k":"C","v":"优化成本"},{"k":"D","v":"创造利润"},{"k":"E","v":"数据共享便利"}],"answer":"BCD","ref":"","exp":"南网数据资产管理体系围绕「责权利、量本利」两条主线：「量本利」分别指拓展数据量（拓量）、优化成本（优本）、创造利润（创利）。A 业务量、E 共享便利不属于该术语的三项内涵。","source":"","tip":"","dup":""},{"id":"M14","bank":"official","no":14,"type":"multi","typeName":"不定项选择题","topic":"公司战略与数字化转型","scope":"国家政策与数据要素","q":"面对世界能源供需格局变化，国家提出\"四革命一合作\"（即能源消费、（ ）、能源体制革命和国际合作）能源革命总体要求。","options":[{"k":"A","v":"能源供给"},{"k":"B","v":"能源技术"},{"k":"C","v":"能源开采"},{"k":"D","v":"能源交易"},{"k":"E","v":"能源创利"}],"answer":"AB","ref":"","exp":"「四革命一合作」指能源消费革命、能源供给革命、能源技术革命、能源体制革命全方位推进，并加强国际合作。题干已给出消费、体制革命与国际合作，空缺为供给与技术，选 A、B。","source":"","tip":"","dup":""},{"id":"M15","bank":"official","no":15,"type":"multi","typeName":"不定项选择题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"\"十四五\"期间我国数字经济发展的重点方向是？","options":[{"k":"A","v":"加速数据要素价值化进程"},{"k":"B","v":"推进实体经济数字化转型"},{"k":"C","v":"着力提升产业基础能力"},{"k":"D","v":"强化数字经济的治理能力"},{"k":"E","v":"深化数字经济开放合作"}],"answer":"ABCDE","ref":"","exp":"「十四五」数字经济发展重点方向包括：加速数据要素价值化进程、推进实体经济数字化转型、着力提升产业基础能力、强化数字经济治理能力、深化数字经济开放合作。五项全选。","source":"","tip":"","dup":""},{"id":"M16","bank":"official","no":16,"type":"multi","typeName":"不定项选择题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"数据确权主要参与者包括？","options":[{"k":"A","v":"大数据交易所"},{"k":"B","v":"行业机构"},{"k":"C","v":"数据服务商"},{"k":"D","v":"大型互联网企业"}],"answer":"ABCD","ref":"","exp":"数据确权是多元主体共同参与的过程：数据交易场所提供登记与凭证，行业机构制定规则与标准，数据服务商提供评估与合规服务，大型互联网企业作为重要数据持有方参与实践。四项均属主要参与者。","source":"","tip":"","dup":""},{"id":"M17","bank":"official","no":17,"type":"multi","typeName":"不定项选择题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"下列关于数据生命周期管理的核心认识中，正确的是？","options":[{"k":"A","v":"数据从产生到被删除销毁的过程中，具有多个不同的数据存在阶段"},{"k":"B","v":"在不同的数据存在阶段，数据的价值是不同的"},{"k":"C","v":"根据数据价值的不同应该对数据采取不同的管理策略"},{"k":"D","v":"数据生命周期管理旨在产生效益的同时，降低生产成本"}],"answer":"ABC","ref":"","exp":"数据生命周期管理的核心认识：数据从产生到销毁存在多个阶段、不同阶段价值不同、应按价值差异采取差异化管理策略。D 把「降低生产成本」当作核心目的不准确，题库参考答案为 ABC；更规范的表述是在控制成本与风险的同时实现数据价值最大化。","source":"","tip":"提示：官方参考答案为 ABC；「降低生产成本」不是数据生命周期管理的核心目的。","dup":""},{"id":"M18","bank":"official","no":18,"type":"multi","typeName":"不定项选择题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"数字经济的三大要素包括？","options":[{"k":"A","v":"互联网"},{"k":"B","v":"算力"},{"k":"C","v":"算法"},{"k":"D","v":"数据"}],"answer":"BCD","ref":"","exp":"数字经济的三大要素是数据（新型生产要素）、算力（基础生产力）、算法（价值转化方法）。互联网属于基础设施/连接载体，不与三者并列。","source":"","tip":"","dup":""},{"id":"M19","bank":"official","no":19,"type":"multi","typeName":"不定项选择题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"电力数据的特点？","options":[{"k":"A","v":"数据量庞大"},{"k":"B","v":"数据类型众多"},{"k":"C","v":"数据增量大"},{"k":"D","v":"速度快"},{"k":"E","v":"可靠性高"}],"answer":"ABCD","ref":"","exp":"电力数据呈现典型的大数据 4V 特征：数据量庞大（Volume）、类型众多（Variety）、增量大且产生速度快（Velocity）；此外价值密度低需挖掘。「可靠性高」不是电力数据的固有特点，海量采集数据同样存在缺失、噪声与质量问题。","source":"","tip":"","dup":""},{"id":"M20","bank":"official","no":20,"type":"multi","typeName":"不定项选择题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"数字电网成为承载新型电力系统的最佳形态。新型电力系统呈现出\"（ ）\"显著特征。","options":[{"k":"A","v":"绿色高效"},{"k":"B","v":"柔性开放"},{"k":"C","v":"安全可靠"},{"k":"D","v":"数字赋能"}],"answer":"ABD","ref":"","exp":"南网关于新型电力系统的表述中，显著特征为「绿色高效、柔性开放、数字赋能」；「安全可靠」是建设底线与基本要求，不列入该组三项特征（题库参考答案 ABD）。","source":"","tip":"提示：官方参考答案为 ABD；「安全可靠」是新型电力系统建设底线要求，不列入该组特征表述。","dup":""},{"id":"M21","bank":"official","no":21,"type":"multi","typeName":"不定项选择题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"下列关于大数据的说法中，错误的是？","options":[{"k":"A","v":"大数据具有体量大、结构单一、时效性强的特征"},{"k":"B","v":"处理大数据需采用新型计算架构和智能算法等新技术"},{"k":"C","v":"大数据的应用注重相关分析而不是因果分析"},{"k":"D","v":"大数据的应用注重因果分析而不是相关分析"},{"k":"E","v":"大数据的目的在于发现新的知识与洞察并进行科学决策"}],"answer":"AD","ref":"","exp":"错误项：A（大数据结构多样、多源异构，并非「结构单一」）、D（大数据应用注重相关分析而非因果分析，C 才是正确表述）。B 新技术架构、E 发现新知识与洞察并支撑科学决策均为正确说法。","source":"","tip":"","dup":""},{"id":"M22","bank":"official","no":22,"type":"multi","typeName":"不定项选择题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"数据治理过程中，如何确保数据的一致性？","options":[{"k":"A","v":"数据标准化"},{"k":"B","v":"数据清洗"},{"k":"C","v":"数据融合"},{"k":"D","v":"数据转换"}],"answer":"A","ref":"","exp":"保障数据一致性主要靠数据标准化：统一数据标准、编码、口径与取值规则，从源头消除歧义。数据清洗解决正确性与完整性，数据融合与转换是集成手段。本题虽为不定项，题库参考答案仅 A。","source":"","tip":"","dup":""},{"id":"M23","bank":"official","no":23,"type":"multi","typeName":"不定项选择题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"《南方电网公司\"十四五\"数字化规划》（〔2022〕7号）\"四位一体\"是指？","options":[{"k":"A","v":"数字电网"},{"k":"B","v":"数字运营"},{"k":"C","v":"数字服务"},{"k":"D","v":"数据资产"},{"k":"E","v":"数字产业"}],"answer":"ABCE","ref":"","exp":"《南方电网公司「十四五」数字化规划》（〔2022〕7号）「四位一体」指数字电网、数字运营、数字服务、数字产业 4 大类应用；「数据资产」属于三大体系之一的数据资产管理体系，不在四类应用之列。与总体框架「4321+」中的「4」对应。","source":"","tip":"","dup":""},{"id":"M24","bank":"official","no":24,"type":"multi","typeName":"不定项选择题","topic":"数据安全与合规","scope":"公司战略与数字化","q":"公司数据应在合法合规的前提下开放，遵循（ ）的原则，数据使用方应确保敏感、涉密数据安全无泄露。","options":[{"k":"A","v":"谁建设"},{"k":"B","v":"谁使用"},{"k":"C","v":"谁获利"},{"k":"D","v":"谁负责"}],"answer":"BCD","ref":"","exp":"公司数据开放遵循「谁使用、谁获利、谁负责」原则（题库参考答案 BCD），使用方须确保敏感、涉密数据安全无泄露。注意与数据安全责任中「谁主管谁负责、谁使用谁负责」表述区分。","source":"","tip":"","dup":""},{"id":"M25","bank":"official","no":25,"type":"multi","typeName":"不定项选择题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"Hadoop的核心组件是________和________。","options":[{"k":"A","v":"GFS"},{"k":"B","v":"HDFS"},{"k":"C","v":"Spark"},{"k":"D","v":"MapReduce"}],"answer":"BD","ref":"","exp":"Hadoop 的两大核心组件是 HDFS（分布式文件系统，负责存储）和 MapReduce（分布式计算框架，负责计算）。GFS 是 Google 论文中的文件系统，Spark 是后来出现的独立内存计算框架。","source":"","tip":"","dup":""},{"id":"M26","bank":"official","no":26,"type":"multi","typeName":"不定项选择题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"以下属于聚类算法的有？","options":[{"k":"A","v":"Apriori"},{"k":"B","v":"K-Means"},{"k":"C","v":"DBSCAN"},{"k":"D","v":"KNN"}],"answer":"BC","ref":"","exp":"K-Means（划分式）与 DBSCAN（基于密度）属于聚类算法。Apriori 用于关联规则挖掘，KNN 是监督学习中的分类/回归方法，均非聚类。","source":"","tip":"","dup":""},{"id":"M27","bank":"official","no":27,"type":"multi","typeName":"不定项选择题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"下面列出的条目中，哪些是数据仓库的基本特征？","options":[{"k":"A","v":"数据仓库是面向主题的"},{"k":"B","v":"数据仓库的数据是集成的"},{"k":"C","v":"数据仓库的数据是相对稳定的"},{"k":"D","v":"数据仓库的数据是反映历史变化的"},{"k":"E","v":"数据仓库是面向事务的"}],"answer":"ACD","ref":"","exp":"数据仓库的经典四特征：面向主题、集成、相对稳定（非易失）、反映历史变化，理论上 A、B、C、D 均正确，E「面向事务」属于操作型数据库特征。题库参考答案为 ACD（漏选 B），考试按题库口径记忆，理解上应记住「集成」也是数据仓库的基本特征。","source":"","tip":"争议提示：数据仓库四大特征包含「集成」，理论上应选 ABCD；题库参考答案为 ACD（漏 B）。考试按题库口径作答。","dup":""},{"id":"M28","bank":"official","no":28,"type":"multi","typeName":"不定项选择题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"\"十四五\"期间我国数字经济发展的重点方向是？","options":[{"k":"A","v":"加速数据要素价值化进程"},{"k":"B","v":"推进实体经济数字化转型"},{"k":"C","v":"着力提升产业基础能力"},{"k":"D","v":"强化数字经济的治理能力"},{"k":"E","v":"深化数字经济开放合作"}],"answer":"ABCDE","ref":"","exp":"「十四五」数字经济发展重点方向包括：加速数据要素价值化进程、推进实体经济数字化转型、着力提升产业基础能力、强化数字经济治理能力、深化数字经济开放合作。五项全选。","source":"","tip":"","dup":"不定项选择题第 15 题"},{"id":"M29","bank":"official","no":29,"type":"multi","typeName":"不定项选择题","topic":"数据治理与数据要素","scope":"国家政策与数据要素","q":"数据确权主要参与者包括？","options":[{"k":"A","v":"大数据交易所"},{"k":"B","v":"行业机构"},{"k":"C","v":"数据服务商"},{"k":"D","v":"大型互联网企业"}],"answer":"ABCD","ref":"","exp":"数据确权是多元主体共同参与的过程：数据交易场所提供登记与凭证，行业机构制定规则与标准，数据服务商提供评估与合规服务，大型互联网企业作为重要数据持有方参与实践。四项均属主要参与者。","source":"","tip":"","dup":"不定项选择题第 16 题"},{"id":"M30","bank":"official","no":30,"type":"multi","typeName":"不定项选择题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"数字电网成为承载新型电力系统的最佳形态。新型电力系统呈现出\"（ ）\"显著特征。","options":[{"k":"A","v":"绿色高效"},{"k":"B","v":"柔性开放"},{"k":"C","v":"安全可靠"},{"k":"D","v":"数字赋能"}],"answer":"ABD","ref":"","exp":"南网关于新型电力系统的表述中，显著特征为「绿色高效、柔性开放、数字赋能」；「安全可靠」是建设底线与基本要求，不列入该组三项特征（题库参考答案 ABD）。","source":"","tip":"","dup":"不定项选择题第 20 题"},{"id":"M31","bank":"official","no":31,"type":"multi","typeName":"不定项选择题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"数据类型是用来描述数据的长度和属性，不属于字节数据存储类型的是？","options":[{"k":"A","v":"bit"},{"k":"B","v":"Byte"},{"k":"C","v":"Binary"},{"k":"D","v":"Bool"}],"answer":"ACD","ref":"","exp":"按题库分类口径，Byte 属字节数据存储类型；bit（位）、Binary（二进制位串）、Bool（布尔）不属于字节数据存储类型，故选 ACD。不同数据库/教材对类型划分略有差异，本题按参考答案记忆。","source":"","tip":"提示：数据类型划分在不同数据库/教材中不尽一致，本题按题库参考答案 ACD 记忆。","dup":""},{"id":"M32","bank":"official","no":32,"type":"multi","typeName":"不定项选择题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"在深度学习模型训练的过程中，常见的优化器有哪些？","options":[{"k":"A","v":"Momenturm"},{"k":"B","v":"Adagrad"},{"k":"C","v":"SGD"},{"k":"D","v":"Adam"}],"answer":"ABCD","ref":"","exp":"深度学习训练常见优化器包括 SGD、Momentum（题面拼写 Momenturm）、Adagrad、Adam，此外还有 RMSprop、Adadelta、AdamW 等，均围绕梯度更新方向与学习率自适应改进。四项全选。","source":"","tip":"","dup":""},{"id":"M33","bank":"official","no":33,"type":"multi","typeName":"不定项选择题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"贝叶斯信念网络（BBN）有如下哪些特点？","options":[{"k":"A","v":"构造网络费时费力"},{"k":"B","v":"对模型的过分问题非常鲁棒"},{"k":"C","v":"不适合处理不完整的数据"},{"k":"D","v":"网络结构确定后，添加变量相当麻烦"}],"answer":"AB","ref":"","exp":"贝叶斯信念网络（BBN）构造网络费时费力、对模型过拟合问题较为鲁棒，且能处理不完整数据、结构确定后新增变量较麻烦。题库参考答案为 AB；C 与「可处理不完整数据」相反，D 在不同教材中表述不一，按参考答案不选。","source":"","tip":"提示：BBN 可处理不完整数据、结构确定后添加变量较麻烦，不同教材表述有差异；本题按题库参考答案 AB 记忆。","dup":""},{"id":"M34","bank":"official","no":34,"type":"multi","typeName":"不定项选择题","topic":"大数据与人工智能技术","scope":"国家政策与数据要素","q":"以下属于分裂的层次聚类算法的是？","options":[{"k":"A","v":"二分K均值"},{"k":"B","v":"MST"},{"k":"C","v":"Chameleon"},{"k":"D","v":"组平均"}],"answer":"AB","ref":"","exp":"分裂（自顶向下）层次聚类的代表有二分 K 均值、基于最小生成树（MST）的方法；Chameleon 与组平均（AGNES 类）属凝聚（自底向上）层次聚类。故选 A、B。","source":"","tip":"","dup":""},{"id":"M35","bank":"official","no":35,"type":"multi","typeName":"不定项选择题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"大数据安全表现出与传统数据安全不同的特征，具体来说包括哪几个方面？","options":[{"k":"A","v":"大数据成为网络攻击的显著目标"},{"k":"B","v":"大数据成为高级可持续攻击（APT）的载体"},{"k":"C","v":"大数据加大隐私泄露风险"},{"k":"D","v":"大数据技术被应用到攻击手段中"}],"answer":"ABCD","ref":"","exp":"大数据安全区别于传统数据安全的特征：海量高价值数据成为网络攻击的显著目标、成为 APT 攻击的载体（隐藏与持久化）、加大隐私泄露与关联还原风险、大数据技术本身也被用于攻击手段。四项全选。","source":"","tip":"","dup":""},{"id":"J1","bank":"official","no":1,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"数据处理者委托他人处理数据后，数据安全责任随之转移给受托方，委托方不再承担责任。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。委托处理不改变责任主体：委托方仍对数据安全负责，须通过合同约定目的、期限、方式、保护措施与双方权利义务，并对受托人进行监督；受托人按约定处理、不得超范围使用。","source":"","tip":"","dup":""},{"id":"J2","bank":"official","no":2,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据《中华人民共和国网络安全法》，网络运营者应当采取监测、记录网络运行状态、网络安全事件的技术措施，并按照规定留存相关的网络日志不少于三个月。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。《网络安全法》第二十一条规定留存相关网络日志不少于六个月，不是三个月。三个月是常见的干扰项（《网络安全法》2017 年施行后即为六个月）。","source":"","tip":"","dup":""},{"id":"J3","bank":"official","no":3,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"《网络数据安全管理条例》自2025年1月1日起施行。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。《网络数据安全管理条例》（国务院令第790号）自 2025 年 1 月 1 日起施行，是《数据安全法》《个人信息保护法》的重要配套行政法规。","source":"","tip":"","dup":""},{"id":"J4","bank":"official","no":4,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据《网络数据安全管理条例》，网络数据处理者在中华人民共和国境内运营中收集和产生的重要数据确需向境外提供的，应当通过国家网信部门组织的数据出境安全评估。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。《网络数据安全管理条例》明确：境内运营中收集和产生的重要数据确需向境外提供的，应当通过国家网信部门组织的数据出境安全评估；通过评估是出境的前置条件。","source":"","tip":"","dup":""},{"id":"J5","bank":"official","no":5,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"《能源行业数据安全管理办法（试行）》自2026年1月1日起施行，有效期3年。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。题干所述施行日期与有效期与《能源行业数据安全管理办法（试行）》原文不符，题库判为错误。备考时以文件「附则」中的施行日期与有效期条款原文为准，注意区分发布日、施行日与试行有效期。","source":"","tip":"","dup":""},{"id":"J6","bank":"official","no":6,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"公司战略与数字化","q":"依据《电力行业网络安全管理办法》，电力企业不得委托在近3年内被行业部门通报有不良行为或被相关部门通报整改的网络安全服务机构。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。《电力行业网络安全管理办法》要求电力企业选择的网络安全服务机构应具备相应能力，不得委托近 3 年内被行业部门通报有不良行为或被相关部门通报整改的机构，防止供应链安全风险。","source":"","tip":"","dup":""},{"id":"J7","bank":"official","no":7,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"公司战略与数字化","q":"依据《电力监控系统安全防护规定》，电力监控系统安全防护评估采取以检查评估为主、自评估为辅的方式。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。《电力监控系统安全防护规定》的安全防护评估采取「以自评估为主、检查评估为辅」的方式，题干把主辅颠倒了。","source":"","tip":"","dup":""},{"id":"J8","bank":"official","no":8,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据《个人信息出境标准合同办法》，个人信息处理者应当在标准合同生效之日起10个工作日内向所在地省级网信部门备案。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。《个人信息出境标准合同办法》要求个人信息处理者在标准合同生效之日起 10 个工作日内，向所在地省级网信部门备案并提交标准合同及个人信息保护影响评估报告。","source":"","tip":"","dup":""},{"id":"J9","bank":"official","no":9,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据《中国人民银行业务领域数据安全管理办法》，重要数据的处理者应当自行或者委托第三方评估机构每年对业务数据开展一次风险评估，并于每年1月31日前向中国人民银行或者住所地中国人民银行省级分支机构报送上一年度风险评估报告。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。题干所述「每年 1 月 31 日前报送上一年度风险评估报告」与《中国人民银行业务领域数据安全管理办法》规定的报送时限不符，题库判为错误。记住要点：重要数据处理者应每年自行或委托第三方开展一次风险评估并向人民银行或其省级分支机构报送报告，具体截止日按办法原文记忆。","source":"","tip":"","dup":""},{"id":"J10","bank":"official","no":10,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据《银行保险机构数据安全管理办法》，银行保险机构应当于每年3月15日前向国家金融监督管理总局或者其派出机构报送上一年度数据安全风险评估报告。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。题干所述「每年 3 月 15 日前」与《银行保险机构数据安全管理办法》规定的报送时限不符，题库判为错误。要点：银行保险机构应每年开展数据安全风险评估并向国家金融监督管理总局或其派出机构报送上一年度评估报告。","source":"","tip":"","dup":""},{"id":"J11","bank":"official","no":11,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据《网络安全审查办法》，网络安全审查办公室应当自收到符合本办法第八条规定的审查申报材料起10个工作日内，确定是否需要审查。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。《网络安全审查办法》规定：网络安全审查办公室应当自收到符合第八条规定的审查申报材料起 10 个工作日内，确定是否需要审查并书面通知当事人。","source":"","tip":"","dup":""},{"id":"J12","bank":"official","no":12,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据 GB/T 43697—2024《数据安全技术 数据分类分级规则》，重要数据是指对领域、群体、区域具有较高覆盖度或达到较高精度、较大规模、一定深度的，一旦被非法使用或共享，可能直接影响政治安全的数据。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。题干描述的是「核心数据」的界定（可能直接影响政治安全）。GB/T 43697—2024 中，重要数据指对特定领域、群体、区域具有较高覆盖度或达到较高精度、较大规模、一定深度，一旦被非法使用或共享可能直接危害国家安全、经济运行、社会稳定、公共健康和安全等的数据。","source":"","tip":"","dup":""},{"id":"J13","bank":"official","no":13,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据 GB 46864—2025《数据安全技术 电子产品信息清除技术要求》，对二手电子产品的信息清除操作和效果验证结果进行记录，留存不少于3年。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。GB 46864—2025《数据安全技术 电子产品信息清除技术要求》要求对二手电子产品的信息清除操作和效果验证结果进行记录，并留存不少于 3 年，以便追溯与核查。","source":"","tip":"","dup":""},{"id":"J14","bank":"official","no":14,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据 GB/T 45574—2025《数据安全技术 敏感个人信息处理安全要求》，基于个人同意处理敏感个人信息的，只要取得个人信息主体的一般同意即可，无需单独同意。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。GB/T 45574—2025《数据安全技术 敏感个人信息处理安全要求》与《个人信息保护法》一致：基于个人同意处理敏感个人信息的，应当取得个人的单独同意；一般同意（如概括勾选隐私政策）不满足要求。","source":"","tip":"","dup":""},{"id":"J15","bank":"official","no":15,"type":"judge","typeName":"判断题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据 GB/T 45674—2025《网络安全技术 生成式人工智能数据标注安全规范》，未通过安全性核验的标注数据数量超过安全性标注数据总量5%时，该批次标注数据应作废。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。GB/T 45674—2025《网络安全技术 生成式人工智能数据标注安全规范》规定，未通过安全性核验的标注数据数量超过安全性标注数据总量 5% 时，该批次标注数据应作废，需重新标注或处理。","source":"","tip":"","dup":""},{"id":"J16","bank":"official","no":16,"type":"judge","typeName":"判断题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"可信数据空间是《国家数据基础设施建设指引》明确的数据基础设施技术路线之一，是流通利用设施层中的业务节点。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。《国家数据基础设施建设指引》把可信数据空间列为数据基础设施技术路线之一，定位为流通利用设施层中的业务节点，承担跨主体数据资源接入、管控与价值共创。","source":"","tip":"","dup":""},{"id":"J17","bank":"official","no":17,"type":"judge","typeName":"判断题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"2025年3月，国家数据局和全国数据标准化技术委员会联合发布国家数据基础设施建设参考架构、互联互通、用户身份管理、标识管理、接入连接器及数据目录描述等6项技术文件。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。2025 年 3 月，国家数据局与全国数据标准化技术委员会联合发布国家数据基础设施建设 6 项技术文件，包括参考架构、互联互通、用户身份管理、标识管理、接入连接器、数据目录描述。","source":"","tip":"","dup":""},{"id":"J18","bank":"official","no":18,"type":"judge","typeName":"判断题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"根据《可信数据空间标准化研究报告（2025版）》，我国可信数据空间已形成完善的国家标准体系，行业标准、地方标准供给充足，不存在标准缺失问题。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。《可信数据空间标准化研究报告（2025版）》指出我国可信数据空间标准体系仍处于建设阶段，存在关键标准缺失、行业与地方标准供给不足等问题，需加快标准体系建设；「已完善、不存在标准缺失」与报告结论相反。","source":"","tip":"","dup":""},{"id":"J19","bank":"official","no":19,"type":"judge","typeName":"判断题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"《可信数据空间标准体系建设指南（2025年版）》提出，对安全合规、身份认证等已有标准基础的领域，采用引用为主、兼顾补充的方式，避免重复建设。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。《可信数据空间标准体系建设指南（2025年版）》提出，对安全合规、身份认证等已有标准基础的领域，采取「引用为主、兼顾补充」的方式，避免重复建设、保持标准协调一致。","source":"","tip":"","dup":""},{"id":"J20","bank":"official","no":20,"type":"judge","typeName":"判断题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"在南方能源行业可信数据空间中完成注册的个人账号（注册主体）可直接使用可信数据空间的全部功能。（    ）","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。在南方能源行业可信数据空间完成注册后，注册主体还需通过身份认证与资质审核、明确角色权限、完成连接器接入与合规确认，才能在授权范围内使用相应功能；注册不等于自动获得全部功能，权限遵循最小必要与按需授权。","source":"","tip":"","dup":""},{"id":"Q1","bank":"official","no":1,"type":"short","typeName":"简答题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"简述数据处理者在组织保障方面应当落实的数据安全责任要求。","options":[],"answer":"","ref":"（1）明确数据安全负责人和管理机构，落实数据安全保护责任。本单位法定代表人或者主要负责人是数据安全第一责任人，分管数据安全的领导是直接责任人；将数据安全责任纳入岗位说明书与绩效考核，建立负责人与管理机构定期向最高管理者汇报机制。\n（2）重要数据的处理者应当明确网络数据安全负责人和网络数据安全管理机构；掌握有关主管部门规定的特定种类、规模重要数据的处理者，应当对网络数据安全负责人和关键岗位人员进行安全背景审查，加强相关人员培训。\n（3）处理个人信息达到国家网信部门规定数量的个人信息处理者，应当指定个人信息保护负责人；提供重要互联网平台服务、用户数量巨大、业务类型复杂的个人信息处理者，应建立健全个人信息保护合规制度体系，并成立主要由外部成员组成的独立机构对其个人信息保护情况进行监督。\n（4）定期组织开展数据安全教育培训，将培训作为数据安全管理的常态化工作。\n\n依据：《中华人民共和国网络安全法》第二十三条，《网络数据安全管理条例》第三十条，《中华人民共和国个人信息保护法》第五十二条、第五十八条，《能源行业数据安全管理办法（试行）》第八条，《中华人民共和国数据安全法》第二十七条。","exp":"答题按四层展开：①责任体系（明确数据安全负责人和管理机构，法定代表人/主要负责人为第一责任人、分管领导为直接责任人，纳入岗位说明书与绩效考核、定期汇报）；②重要数据处理者的特别要求（明确网络数据安全负责人与机构、对负责人和关键岗位人员做安全背景审查并培训）；③个人信息处理者的特别要求（达到规定数量指定个人信息保护负责人，重要平台服务者建立合规制度体系并成立主要由外部成员组成的独立监督机构）；④常态化教育培训。易错点：把第一责任人写成信息技术部门负责人、漏掉「直接责任人」、漏掉独立监督机构。","source":"","tip":"","dup":""},{"id":"Q2","bank":"official","no":2,"type":"short","typeName":"简答题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"简述数据存储与数据销毁（数据消除）环节的合规要求。","options":[],"answer":"","ref":"（1）存储要求：按照法律、行政法规规定和用户约定的方式、期限进行数据存储；存储重要数据和核心数据的，应当采用校验技术、密码技术等措施进行安全存储，并落实相应安全保护措施；个人信息保存期限应当为实现处理目的所必要的最短时间。\n（2）销毁制度：建立数据销毁制度，明确销毁对象、规则、流程和技术等要求，对销毁活动进行记录和留存。\n（3）销毁执行：个人、组织按照法律规定、合同约定等请求销毁的，应当销毁相应数据；国家法律法规规定的应当主动删除情形出现时，个人信息处理者应当主动删除个人信息；销毁重要数据和核心数据后，不得以任何理由、任何方式对销毁数据进行恢复，引起备案内容发生变化的应及时办理备案变更。\n（4）用途限制：对涉及重要数据的信息系统建设、运维过程中收集、产生的数据，不得用于其他用途，服务完成后按照与委托方约定处理或者及时删除。\n\n依据：《工业和信息化领域数据安全管理办法（试行）》第十五条、第二十条，《能源行业数据安全管理办法（试行）》第十六条、第二十条，《中华人民共和国个人信息保护法》第十九条、第四十七条。","exp":"按「存储—销毁制度—销毁执行—用途限制」四段作答最稳：存储须依法定/约定方式与期限，重要数据与核心数据采用校验、密码技术安全存储，个人信息保存期限为实现目的所必要的最短时间；销毁制度要明确对象、规则、流程技术并留存记录；依法定或约定请求应销毁、法定情形应主动删除，重要/核心数据销毁后不得恢复且备案内容变化应及时变更；运维过程中收集产生的数据不得挪作他用，服务完成后按约定处理或删除。易错点：漏「不得恢复」和「备案变更」。","source":"","tip":"","dup":""},{"id":"Q3","bank":"official","no":3,"type":"short","typeName":"简答题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"简述数据安全事件应急处置与报告的合规要求。","options":[],"answer":"","ref":"（1）制定本单位网络安全事件应急预案，明确事件分级、处置流程、报告路径及时限，定期开展应急演练。\n（2）发生网络安全事件，应当按照《网络安全事件分级指南》进行研判，立即启动网络安全事件应急预案，对网络安全事件进行调查和评估，采取技术措施和其他必要措施消除隐患、防止危害扩大。\n（3）及时将可能造成较大及以上安全事件的风险向本地区行业监管部门报告；涉及重要数据和核心数据的安全事件，第一时间向本地区行业监管部门报告，事件处置完成后及时报告处置情况。\n（4）发生或者可能发生个人信息泄露、篡改、丢失的，个人信息处理者应当立即采取补救措施，并通知履行个人信息保护职责的部门和个人。\n（5）数据安全事件处置结束后，应当及时总结经验教训，持续改进应急机制。\n\n依据：《中华人民共和国网络安全法》第二十七条，《中华人民共和国数据安全法》第二十三条，《网络数据安全管理条例》第三十一条，《工业和信息化领域数据安全管理办法（试行）》第二十七条，《国家网络安全事件报告管理办法》第四条，《中华人民共和国个人信息保护法》第五十七条。","exp":"答题主线：预案与演练 → 事件研判与启动 → 分级报告（较大及以上风险向本地区行业监管部门报告；涉及重要/核心数据第一时间报告，处置完成后报告处置情况）→ 个人信息泄露等的补救与「双通知」（监管部门 + 个人）→ 事后总结改进。依据涉及《网络安全法》第27条、《数据安全法》第23条、《网络数据安全管理条例》第31条、《个人信息保护法》第57条等，写出 3 条以上即可加分。","source":"","tip":"","dup":""},{"id":"Q4","bank":"official","no":4,"type":"short","typeName":"简答题","topic":"数据安全与合规","scope":"公司战略与数字化","q":"依据《电力监控系统安全防护规定》，简述电力监控系统分区防护的区域划分及电力监控专用网络的组网要求。","options":[],"answer":"","ref":"（1）分区防护：电力监控系统应当实施分区防护，防护区域按照安全等级从高到低划分为生产控制区（可以分为安全Ⅰ区和安全Ⅱ区）和管理信息区（可以分为安全Ⅲ区和安全Ⅳ区）；不同电力监控系统的生产控制区、管理信息区可以分别独立设置。（第四条）\n（2）专用网络：生产控制区应当使用电力监控专用网络。（第八条）\n（3）组网要求：电力监控专用网络应当在专用通道上使用独立的网络设备组网，在物理层面上实现与运营者其他数据网及外部公用数据网的安全隔离。（第八条）\n（4）子网划分：电力监控专用网络划分为逻辑隔离的实时子网和非实时子网，分别连接安全Ⅰ区和安全Ⅱ区。（第八条）\n\n评分要点：区域划分（生产控制区、管理信息区及各自子区）、专用网络使用、物理隔离、实时与非实时子网划分各占相应分值。","exp":"四个得分点：①分区防护——按安全等级从高到低为生产控制区（安全Ⅰ区/Ⅱ区）与管理信息区（安全Ⅲ区/Ⅳ区），不同系统的两类区域可分别独立设置（第四条）；②生产控制区应使用电力监控专用网络（第八条）；③专用网络在专用通道上用独立网络设备组网，物理层面与运营者其他数据网及外部公用数据网安全隔离；④专用网络划分为逻辑隔离的实时子网与非实时子网，分别连接安全Ⅰ区、Ⅱ区。易错点：把「物理隔离」写成逻辑隔离、漏实时/非实时子网。","source":"","tip":"","dup":""},{"id":"Q5","bank":"official","no":5,"type":"short","typeName":"简答题","topic":"数据安全与合规","scope":"国家政策与数据要素","q":"依据《数据出境安全评估办法》《促进和规范数据跨境流动规定》，简述应当申报数据出境安全评估的情形。","options":[],"answer":"","ref":"（1）《数据出境安全评估办法》第四条规定的申报情形：①数据处理者向境外提供重要数据；②关键信息基础设施运营者和处理100万人以上个人信息的数据处理者向境外提供个人信息；③自上年1月1日起累计向境外提供10万人个人信息或者1万人敏感个人信息的数据处理者向境外提供个人信息；④国家网信部门规定的其他需要申报数据出境安全评估的情形。\n（2）《促进和规范数据跨境流动规定》第七条规定的申报情形：①关键信息基础设施运营者向境外提供个人信息或者重要数据；②关键信息基础设施运营者以外的数据处理者向境外提供重要数据，或者自当年1月1日起累计向境外提供100万人以上个人信息（不含敏感个人信息）或者1万人以上敏感个人信息。\n\n评分要点：按两部规章分别作答，数据项（重要数据、个人信息、敏感个人信息）与数量门槛（100万人、10万人、1万人）准确方可得满分。","exp":"关键是分两部规章作答且数量门槛准确：《数据出境安全评估办法》第四条四项情形（重要数据；关基运营者或处理 100 万人以上个人信息者出境个人信息；自上年1月1日起累计出境 10 万人个人信息或 1 万人敏感个人信息；网信部门规定的其他情形）；《促进和规范数据跨境流动规定》第七条（关基运营者出境个人信息或重要数据；非关基运营者出境重要数据，或自当年1月1日起累计出境 100 万人以上个人信息〈不含敏感〉或 1 万人以上敏感个人信息）。易错点：混淆「上年1月1日」与「当年1月1日」、漏掉敏感个人信息 1 万人门槛。","source":"","tip":"","dup":""},{"id":"Q6","bank":"official","no":6,"type":"short","typeName":"简答题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"简述对数据标注人员进行安全培训与任务分配的要求。","options":[],"answer":"","ref":"依据 GB/T 45674—2025《网络安全技术 生成式人工智能数据标注安全规范》：\n（1）安全培训要求（第7.1条）：培训内容应至少包括数据标注规则安全要求、数据标注平台或工具使用方法及安全要求、数据标注质量及安全性核验方法、标注数据安全管理、典型安全风险场景及相关安全问题案例及识别方法、数据标注人员安全及遵纪守法意识培训等；应在培训结束后组织数据标注人员进行安全考核，给予合格者标注上岗资格，对考核过程进行记录并留存记录文档，考核内容应包括相关法律法规知识、标注规则理解能力、标注平台或工具使用能力、安全风险判定能力、数据安全管理能力等；应定期或在标注规则发生重大变化时组织重新培训考核，暂停或取消不合格者的标注上岗资格。\n（2）任务分配要求（第7.2条）：应按数据标注规模和标注任务需求，明确数据标注人员的数量和岗位职责，并根据任务实际情况动态调整；应按标注任务中的不同职责定位，划分数据标注人员角色，包括标注执行人员、标注审核人员、标注仲裁人员、标注监督人员，并根据角色能力要求进行标注任务分配；应对各数据标注人员任务分配过程进行记录，并留存记录文档。\n\n依据 GB/T 45674—2025 第7.1条\"安全培训\"、第7.2条\"任务分配\"。","exp":"按 GB/T 45674—2025 第 7.1、7.2 条分「安全培训」与「任务分配」两块：培训内容至少含标注规则安全要求、平台/工具使用及安全要求、质量与安全性核验方法、标注数据安全管理、典型风险场景与案例识别、安全与遵纪守法意识；培训后组织考核、合格者授予上岗资格、留存记录，定期或规则重大变化时重新培训并暂停/取消不合格者资格。任务分配要明确人员数量与岗位职责并动态调整，按标注执行、审核、仲裁、监督四类角色分配任务，并留存分配记录。易错点：漏四类角色或漏「留存记录」。","source":"","tip":"","dup":""},{"id":"Q7","bank":"official","no":7,"type":"short","typeName":"简答题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"请简述可信数据空间的概念，并说明其包含的三个方面的内涵。","options":[],"answer":"","ref":"（1）概念：可信数据空间是基于共识规则，连接多方主体，实现数据资源共享共用的一种数据流通利用基础设施，是数据要素价值共创的应用生态，是支撑构建全国一体化数据市场的重要载体；其作为6条技术路线之一，符合《数据基础设施 参考架构》确定的国家数据基础设施整体架构及基本约束，是流通利用设施层中的业务节点。\n（2）三个方面的内涵：一是可信数据空间建设的基本条件是基于多方主体认同并遵守的共同规则，规则规定了参与各方主体的资质要求及功能权限、数据流通客体及其授权方式、数据流通过程规范与控制方法等；二是可信数据空间是实现数据资源流通利用的一种数据流通利用基础设施，通过体系化的技术安排确保数据协议的确认、履行和维护，实现多主体间数据集聚、流通和利用；三是可信数据空间是数据要素价值共创的应用生态，可支持多主体协同合作、资源整合以及场景创新，进而激发数据在生态体系中的价值实现。\n\n（依据：《可信数据空间标准化研究报告（2025版）》\"一、引言（二）可信数据空间的概念、内涵\"）","exp":"先给定义：可信数据空间是基于共识规则、连接多方主体、实现数据资源共享共用的数据流通利用基础设施，是数据要素价值共创的应用生态，是支撑全国一体化数据市场的重要载体，也是国家数据基础设施流通利用设施层的业务节点。再分三点内涵：①基本条件是多方认同并共同遵守的规则（主体资质与功能权限、流通客体与授权方式、过程规范与控制方法）；②通过体系化技术安排确保数据协议确认、履行与维护，实现多主体数据集聚流通利用；③支持多主体协同、资源整合与场景创新的价值共创生态。","source":"","tip":"","dup":""},{"id":"Q8","bank":"official","no":8,"type":"short","typeName":"简答题","topic":"可信数据空间与高质量数据集","scope":"国家政策与数据要素","q":"简述《可信数据空间发展行动计划（2024—2028年）》\"实施可信数据空间能力建设行动\"的主要内容。","options":[],"answer":"","ref":"（1）构建数据空间可信管控能力。支持可信数据空间运营者构建接入认证体系，保障参与各方身份可信、数据资源管理权责清晰、应用服务安全可靠；引导运营者建立空间资源使用合约和合作规范，利用隐私计算、使用控制、区块链等技术优化履约机制；推动构建空间合约和履约行为存证体系，提升数据资源开发利用全程溯源能力，保障参与各方权益，保护数据市场公平竞争。\n（2）提高数据空间资源交互能力。引导运营者提供数据标识、语义转换等技术服务，推动参与各方通过数据资源封装、数据资源目录维护等手段，实现数据产品和服务的统一发布、高效查询、跨主体互认；引导运营者加强协作，统一目录标识、身份认证、接口要求，实现各类数据空间互联互通，促进跨空间身份互认、资源共享、服务共用。\n（3）强化可信数据空间价值共创能力。面向共性应用场景，支持运营者部署应用开发环境，为参与各方开发数据产品和服务创造条件；指导运营者建立共建共治、责权清晰、公平透明的运营规则，探索构建动态数据价值评估模型，按照市场评价贡献、贡献决定报酬的原则分配收益；支持运营者与数据开发、数据经纪、数据托管、审计清算、合规审查等数据服务方开展价值协同和业务合作，打造良好生态。\n\n依据：《可信数据空间发展行动计划（2024—2028年）》\"二、实施可信数据空间能力建设行动\"（一）（二）（三）。","exp":"三大能力逐条展开：①可信管控能力——接入认证体系（身份可信、权责清晰、服务安全可靠）、空间资源使用合约与合作规范、隐私计算/使用控制/区块链优化履约、合约与履约行为存证与全程溯源；②资源交互能力——数据标识、语义转换、资源封装与目录维护实现统一发布、高效查询、跨主体互认，统一目录标识/身份认证/接口要求实现空间互联互通；③价值共创能力——部署应用开发环境、共建共治的运营规则、动态数据价值评估模型与按贡献分配收益、与数据开发/经纪/托管/审计清算/合规审查等服务方协同。","source":"","tip":"","dup":""},{"id":"Q9","bank":"official","no":9,"type":"short","typeName":"简答题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"请简述南网\"十四五\"数字化规划总体框架\"4321+\"内容。","options":[],"answer":"","ref":"1. \"4\"为数字电网、数字运营、数字服务和数字产业4大类应用（2分）\n2. \"3\"为安全及运行体系、数据资产管理体系、数字化保障体系（2分）\n3. \"2\"为基础设施及技术平台（2分）\n4. \"1\"为企业级中台（1分）\n5. \"+\"继承\"4321\"品牌，重构\"4321\"内涵，实现进一步拓展业务范围、提升技术路线、加强技术平台赋能、夯实数字化基础、加强转型保障等，从而升级到\"4321+\"（3分）\n\n来源：2023年业务人员卷","exp":"按分值记牢 5 个数字：4 = 数字电网、数字运营、数字服务、数字产业 4 大类应用（2分）；3 = 安全及运行体系、数据资产管理体系、数字化保障体系（2分）；2 = 基础设施及技术平台（2分）；1 = 企业级中台（1分）；+ = 继承「4321」品牌并重构内涵，拓展业务范围、提升技术路线、加强技术平台赋能、夯实数字化基础、加强转型保障（3分）。易错点：把「数据资产」误列入四类应用，或漏答「+」的五项升级。","source":"","tip":"","dup":""},{"id":"Q10","bank":"official","no":10,"type":"short","typeName":"简答题","topic":"公司战略与数字化转型","scope":"公司战略与数字化","q":"简述南方电网数据资产管理体系的内涵以及处理措施。","options":[],"answer":"","ref":"- 内涵（4分）：南方电网将数据对象作为一种全新的资产形态，围绕\"责权利、量本利\"两条主线，以资产管理的标准和要求来加强数据相关的管理体制和手段，实现了数据资源管理向数据资产管理的升级迭代，并充分挖掘和释放数据资产的价值效益，对内共享赋能公司数字化转型和数字电网建设，对外数据流通服务国家数字经济发展、数字中国建设。\n- 处理措施（6分，每点0.5分+说明0.5分）：\n1. 定责（0.5分）：明确定责对象范围，决定数据管理边界（0.5分）\n2. 确权（0.5分）：确定权属规划路径，探究参与主体权益（0.5分）\n3. 享利（0.5分）：探索享利原则方法，明确利益分配规则（0.5分）\n4. 拓量（0.5分）：汇聚数据资源，拓展产业发展规模（0.5分）\n5. 优本（0.5分）：优化定价方法模型，提升数据资产收益（0.5分）\n6. 创利（0.5分）：释放数据价值，积极参与数据要素市场发展（0.5分）\n\n来源：2023年业务人员卷","exp":"分「内涵」与「处理措施」两部分：内涵围绕「责权利、量本利」两条主线，把数据对象作为全新资产形态，按资产管理标准升级数据资源管理体制，对内共享赋能数字化转型与数字电网建设、对外流通服务数字经济与数字中国建设（4分）。处理措施 6 项各含「动作 + 说明」：定责（明确对象范围、划定管理边界）、确权（权属规划路径、参与主体权益）、享利（分配原则与利益规则）、拓量（汇聚资源、拓展产业规模）、优本（优化定价模型、提升资产收益）、创利（释放价值、参与数据要素市场）。易错点：只写 6 个词不写说明，每项会丢 0.5 分。","source":"","tip":"","dup":""},{"id":"XS01","bank":"mock","no":1,"type":"single","typeName":"单选题","topic":"数据要素政策","scope":"征集说明·新编模拟题","q":"「数据二十条」提出探索建立数据产权结构性分置机制，下列属于该机制的是（ ）。","options":[{"k":"A","v":"数据资源持有权、数据加工使用权、数据产品经营权等分置"},{"k":"B","v":"数据所有权、使用权、收益权三权合一"},{"k":"C","v":"数据占有权、处分权、继承权分置"},{"k":"D","v":"数据采集权、存储权、删除权分置"}],"answer":"A","ref":"","exp":"「数据二十条」淡化所有权、强调使用权，提出建立数据资源持有权、数据加工使用权、数据产品经营权等分置的产权运行机制（俗称「三权分置」），以破解数据确权难题、促进流通使用。B 沿用传统物权思路、C 与 D 均非政策表述。","source":"《关于构建数据基础制度更好发挥数据要素作用的意见》（数据二十条）","tip":"","dup":"","batch":"base"},{"id":"XS02","bank":"mock","no":2,"type":"single","typeName":"单选题","topic":"数据要素政策","scope":"征集说明·新编模拟题","q":"《数字中国建设整体布局规划》提出的「2522」整体框架中，「两大基础」是指（ ）。","options":[{"k":"A","v":"数字技术创新体系与数字安全屏障"},{"k":"B","v":"数字基础设施与数据资源体系"},{"k":"C","v":"数字经济与数字政务"},{"k":"D","v":"国内环境与国际环境"}],"answer":"B","ref":"","exp":"「2522」= 夯实数字基础设施和数据资源体系「两大基础」，推进数字技术与经济、政治、文化、社会、生态文明建设「五位一体」深度融合，强化数字技术创新体系和数字安全屏障「两大能力」，优化数字化发展国内国际「两个环境」。A 是两大能力，D 是两个环境。","source":"《数字中国建设整体布局规划》","tip":"","dup":"","batch":"base"},{"id":"XS03","bank":"mock","no":3,"type":"single","typeName":"单选题","topic":"数据要素政策","scope":"征集说明·新编模拟题","q":"《「数据要素×」三年行动计划（2024—2026年）》的根本目标是（ ）。","options":[{"k":"A","v":"全面放开数据交易价格管制"},{"k":"B","v":"发挥数据要素放大、叠加、倍增作用，赋能经济社会各领域高质量发展"},{"k":"C","v":"统一全国数据交易所的收费标准"},{"k":"D","v":"替代传统生产要素投入"}],"answer":"B","ref":"","exp":"该计划选取工业制造、现代农业、商贸流通、交通运输、金融服务、科技创新、文化旅游、医疗健康、应急管理、气象服务、城市治理、绿色低碳等 12 个重点行业领域，推动数据要素与场景深度融合，发挥乘数效应。A、C、D 都不是政策目标。","source":"《「数据要素×」三年行动计划（2024—2026年）》","tip":"","dup":"","batch":"base"},{"id":"XS04","bank":"mock","no":4,"type":"single","typeName":"单选题","topic":"数据资产","scope":"征集说明·新编模拟题","q":"依据《企业数据资源相关会计处理暂行规定》，企业符合条件的数据资源在财务报表中通常确认为（ ）。","options":[{"k":"A","v":"无形资产或存货"},{"k":"B","v":"固定资产"},{"k":"C","v":"长期股权投资"},{"k":"D","v":"商誉"}],"answer":"A","ref":"","exp":"企业持有、用于出售的数据资源，符合条件的可确认为存货；企业内部使用、能带来经济利益且成本可可靠计量的，可确认为无形资产。该规定并不改变固定资产、长期股权投资、商誉的确认条件，也不是「所有数据都能入表」。","source":"财政部《企业数据资源相关会计处理暂行规定》（2024年1月1日起施行）","tip":"","dup":"","batch":"base"},{"id":"XS05","bank":"mock","no":5,"type":"single","typeName":"单选题","topic":"数据资产","scope":"征集说明·新编模拟题","q":"数据资产区别于土地、设备等传统资产最典型的经济特性是（ ）。","options":[{"k":"A","v":"具有排他性和竞争性"},{"k":"B","v":"可无限复制、非排他性且边际成本趋近于零"},{"k":"C","v":"价值随使用次数递减"},{"k":"D","v":"必须依附于特定实物载体才能发挥价值"}],"answer":"B","ref":"","exp":"数据可低成本复制共享、可多主体同时使用而不减损（非竞争性），且越用越能产生新价值，边际复制成本趋近于零；这也是数据确权、定价与收益分配难以套用传统物权规则的根本原因。","source":"数据要素基础理论 / 数据二十条","tip":"","dup":"","batch":"base"},{"id":"XS06","bank":"mock","no":6,"type":"single","typeName":"单选题","topic":"数据治理","scope":"征集说明·新编模拟题","q":"DCMM（GB/T 36073—2018《数据管理能力成熟度评估模型》）共包含（ ）个能力域。","options":[{"k":"A","v":"5"},{"k":"B","v":"6"},{"k":"C","v":"8"},{"k":"D","v":"10"}],"answer":"C","ref":"","exp":"DCMM 八大能力域为：数据战略、数据治理、数据架构、数据应用、数据安全、数据质量、数据标准、数据生存周期；按初始级、受管理级、稳健级、量化管理级、优化级 5 个等级评估成熟度。","source":"GB/T 36073—2018《数据管理能力成熟度评估模型》","tip":"","dup":"","batch":"base"},{"id":"XS07","bank":"mock","no":7,"type":"single","typeName":"单选题","topic":"数据治理","scope":"征集说明·新编模拟题","q":"某系统「用户编号」字段存在空值、重复值与非法格式，最能直接反映的数据质量维度是（ ）。","options":[{"k":"A","v":"及时性"},{"k":"B","v":"完整性、唯一性、有效性"},{"k":"C","v":"一致性"},{"k":"D","v":"可追溯性"}],"answer":"B","ref":"","exp":"空值对应完整性，重复对应唯一性，非法格式对应有效性（规范性）。常用数据质量维度为完整性、准确性、一致性、及时性、唯一性、有效性；及时性关注数据产生到可用的时延，一致性关注跨系统口径一致。","source":"DCMM 数据质量能力域 / 数据质量六性","tip":"","dup":"","batch":"base"},{"id":"XS08","bank":"mock","no":8,"type":"single","typeName":"单选题","topic":"数据治理","scope":"征集说明·新编模拟题","q":"记录「某张报表指标由哪些源表字段经过哪些加工规则计算得出」的元数据，通常称为（ ）。","options":[{"k":"A","v":"业务元数据"},{"k":"B","v":"技术元数据（数据血缘）"},{"k":"C","v":"管理元数据"},{"k":"D","v":"参考数据"}],"answer":"B","ref":"","exp":"数据血缘（Lineage）描述数据的来源、加工链路与去向，属于技术元数据，用于影响分析、问题溯源与合规审计。业务元数据描述业务含义与口径，管理元数据描述责任人、权限、更新频率等管理属性。","source":"元数据管理 / 数据血缘通用实践","tip":"","dup":"","batch":"base"},{"id":"XS09","bank":"mock","no":9,"type":"single","typeName":"单选题","topic":"数据治理","scope":"征集说明·新编模拟题","q":"下列关于主数据（Master Data）的说法，正确的是（ ）。","options":[{"k":"A","v":"主数据是交易过程中产生的流水记录"},{"k":"B","v":"主数据是跨系统共享、相对稳定的核心业务实体数据"},{"k":"C","v":"主数据只在一个系统内使用，无需统一"},{"k":"D","v":"主数据等同于日志数据"}],"answer":"B","ref":"","exp":"客户、供应商、设备台账、组织、物料等跨系统共享且变化缓慢的高价值基础数据属于主数据，需要统一编码、统一口径与唯一数据源。交易流水、日志属于事务/运行数据，不具备主数据特征。","source":"主数据管理（MDM）通用实践","tip":"","dup":"","batch":"base"},{"id":"XS10","bank":"mock","no":10,"type":"single","typeName":"单选题","topic":"数据治理","scope":"征集说明·新编模拟题","q":"相较于数据仓库，数据湖最显著的特点是（ ）。","options":[{"k":"A","v":"只存储经过建模的结构化数据"},{"k":"B","v":"按原始格式存储多源异构数据，读时建模"},{"k":"C","v":"不支持大数据量存储"},{"k":"D","v":"仅面向固定报表场景"}],"answer":"B","ref":"","exp":"数据湖以原始格式（结构化、半结构化、非结构化）低成本汇聚数据，采用 schema-on-read（读时建模），适合探索分析与 AI 训练；数据仓库是 schema-on-write，面向主题、集成、相对稳定，支撑固定报表与 BI。","source":"数据仓库与数据湖通用技术对比","tip":"","dup":"","batch":"base"},{"id":"XS11","bank":"mock","no":11,"type":"single","typeName":"单选题","topic":"公司战略与数字化","scope":"征集说明·新编模拟题","q":"南网「十四五」数字化规划总体框架「4321+」中的「1」是指（ ）。","options":[{"k":"A","v":"一套数据标准"},{"k":"B","v":"企业级中台"},{"k":"C","v":"一张数字电网"},{"k":"D","v":"一个数据中心"}],"answer":"B","ref":"","exp":"「4321+」：4 大类应用（数字电网、数字运营、数字服务、数字产业）、3 大体系（安全及运行、数据资产管理、数字化保障）、2（基础设施及技术平台）、1（企业级中台）；「+」表示继承品牌并重构内涵、进一步拓展升级。","source":"《南方电网公司「十四五」数字化规划》（〔2022〕7号）","tip":"","dup":"","batch":"base"},{"id":"XS12","bank":"mock","no":12,"type":"single","typeName":"单选题","topic":"公司战略与数字化","scope":"征集说明·新编模拟题","q":"新型电力系统的「双高」特征通常是指（ ）。","options":[{"k":"A","v":"高电压等级、高负荷密度"},{"k":"B","v":"高比例新能源、高比例电力电子设备"},{"k":"C","v":"高储能占比、高电价"},{"k":"D","v":"高自动化、高可靠性"}],"answer":"B","ref":"","exp":"高比例新能源接入与高比例电力电子设备（逆变器、变流器）使系统呈现低惯量、强随机性、宽频振荡等新特征，需要数字化手段支撑可观、可测、可控，这也是数字电网建设的重要驱动力。","source":"新型电力系统建设相关行业共识","tip":"","dup":"","batch":"base"},{"id":"XS13","bank":"mock","no":13,"type":"single","typeName":"单选题","topic":"人工智能","scope":"征集说明·新编模拟题","q":"Transformer 架构能够建模长距离依赖并支撑大语言模型的核心机制是（ ）。","options":[{"k":"A","v":"循环神经网络门控"},{"k":"B","v":"自注意力机制（Self-Attention）"},{"k":"C","v":"池化降采样"},{"k":"D","v":"决策树分裂"}],"answer":"B","ref":"","exp":"自注意力通过 Query-Key-Value 计算序列内任意位置的相关权重，实现并行化与长距离依赖建模；多头注意力进一步捕捉不同子空间的语义关系。RNN 门控、池化、决策树分别属于其他模型家族。","source":"Transformer / 大语言模型通用技术原理","tip":"","dup":"","batch":"base"},{"id":"XS14","bank":"mock","no":14,"type":"single","typeName":"单选题","topic":"人工智能","scope":"征集说明·新编模拟题","q":"检索增强生成（RAG）最主要解决的问题是（ ）。","options":[{"k":"A","v":"降低模型参数量"},{"k":"B","v":"引入外部权威知识、缓解知识滞后与幻觉"},{"k":"C","v":"替代模型预训练"},{"k":"D","v":"提高 GPU 显存利用率"}],"answer":"B","ref":"","exp":"RAG 先从企业知识库/文档检索相关片段，再与问题拼接送入模型生成，使答案可引用最新、私域、权威知识，减少凭空编造，且无需重新训练模型。它不能从根本上消除幻觉，知识库质量与检索召回率仍是关键。","source":"大语言模型应用工程通用实践","tip":"","dup":"","batch":"base"},{"id":"XS15","bank":"mock","no":15,"type":"single","typeName":"单选题","topic":"人工智能","scope":"征集说明·新编模拟题","q":"大模型「幻觉」（Hallucination）是指（ ）。","options":[{"k":"A","v":"模型推理速度突然下降"},{"k":"B","v":"模型生成看似流畅但与事实不符或无法溯源的内容"},{"k":"C","v":"训练数据集中存在缺失值"},{"k":"D","v":"模型参数被恶意篡改"}],"answer":"B","ref":"","exp":"幻觉源于概率式生成与知识边界，表现为编造法规条文、数据、引用等。电力业务中可通过 RAG 引入制度原文、设置引用溯源、人工复核与置信度提示来抑制，高合规场景不得直接采信未核验输出。","source":"生成式人工智能安全通用概念","tip":"","dup":"","batch":"base"},{"id":"XS16","bank":"mock","no":16,"type":"single","typeName":"单选题","topic":"人工智能","scope":"征集说明·新编模拟题","q":"依据《生成式人工智能服务管理暂行办法》，面向境内公众提供具有舆论属性或者社会动员能力的生成式人工智能服务，应当（ ）。","options":[{"k":"A","v":"只需在官网公示即可"},{"k":"B","v":"按规定开展安全评估并履行算法备案等手续"},{"k":"C","v":"完全无需履行任何程序"},{"k":"D","v":"仅需取得行业协会认证"}],"answer":"B","ref":"","exp":"办法要求训练数据来源合法、不侵犯知识产权与个人信息权益，落实内容安全、标签标识、投诉举报机制；具有舆论属性或社会动员能力的服务，按《互联网信息服务算法推荐管理规定》履行备案与安全评估。","source":"《生成式人工智能服务管理暂行办法》（2023年8月15日施行）","tip":"","dup":"","batch":"base"},{"id":"XS17","bank":"mock","no":17,"type":"single","typeName":"单选题","topic":"新一代信息技术","scope":"征集说明·新编模拟题","q":"下列技术路线中，不属于典型「隐私计算」范畴的是（ ）。","options":[{"k":"A","v":"联邦学习"},{"k":"B","v":"多方安全计算（MPC）"},{"k":"C","v":"可信执行环境（TEE）"},{"k":"D","v":"将各方明文数据集中到中心数据库后统一计算"}],"answer":"D","ref":"","exp":"隐私计算的目标正是在原始数据不出域的前提下完成联合计算与建模，主流路线包括联邦学习、MPC、TEE，常配合差分隐私、数据沙箱与使用控制。明文集中汇总恰恰是需要被替代的做法。","source":"隐私计算技术体系 / 数据流通利用设施相关技术文件","tip":"","dup":"","batch":"base"},{"id":"XS18","bank":"mock","no":18,"type":"single","typeName":"单选题","topic":"新一代信息技术","scope":"征集说明·新编模拟题","q":"在变电站设备状态监测场景中，边缘计算最主要的价值是（ ）。","options":[{"k":"A","v":"把所有原始视频永久保存到云端"},{"k":"B","v":"在靠近数据源侧完成实时预处理与告警，降低时延和带宽压力"},{"k":"C","v":"替代所有云端分析"},{"k":"D","v":"取消数据安全管理要求"}],"answer":"B","ref":"","exp":"海量传感与视频数据全量上云成本高、时延大，边缘侧做就地识别、压缩、异常告警，云端负责汇聚、模型训练与全局分析，形成云边协同；安全要求不因部署位置改变而免除。","source":"云边协同 / 电力物联网通用实践","tip":"","dup":"","batch":"base"},{"id":"XS19","bank":"mock","no":19,"type":"single","typeName":"单选题","topic":"新一代信息技术","scope":"征集说明·新编模拟题","q":"数字孪生电网的核心内涵是（ ）。","options":[{"k":"A","v":"建立电网设备的静态三维展示模型"},{"k":"B","v":"构建物理电网与数字模型之间的实时映射、仿真与闭环优化"},{"k":"C","v":"把纸质图纸扫描成电子文件"},{"k":"D","v":"仅用于对外宣传展示"}],"answer":"B","ref":"","exp":"数字孪生强调物理实体与数字模型之间的双向数据驱动、状态同步、仿真推演与决策反馈闭环，支撑设备状态评估、运行方式推演与故障预演；仅有静态三维模型不构成数字孪生。","source":"数字孪生 / 数字电网通用技术概念","tip":"","dup":"","batch":"base"},{"id":"XS20","bank":"mock","no":20,"type":"single","typeName":"单选题","topic":"生产运行与新兴业务","scope":"征集说明·新编模拟题","q":"虚拟电厂（VPP）的本质是（ ）。","options":[{"k":"A","v":"新建一座实体燃气电厂"},{"k":"B","v":"通过数字化平台聚合分布式电源、储能与可调负荷，参与电网调节和市场交易"},{"k":"C","v":"一种储能电池的化学体系"},{"k":"D","v":"仅用于展示的三维可视化系统"}],"answer":"B","ref":"","exp":"虚拟电厂不新建实体机组，而是以通信、计量、控制与算法把分散资源整合为可观测、可调节、可交易的「电厂」，提供调峰、调频、需求响应等辅助服务，是电力数据要素价值化的典型场景。","source":"新型电力系统 / 需求响应与虚拟电厂行业共识","tip":"","dup":"","batch":"base"},{"id":"XS21","bank":"mock","no":21,"type":"single","typeName":"单选题","topic":"生产运行与新兴业务","scope":"征集说明·新编模拟题","q":"衡量短期电力负荷预测精度时，最常使用的评价指标是（ ）。","options":[{"k":"A","v":"MAPE（平均绝对百分比误差）/ 准确率"},{"k":"B","v":"模型参数量"},{"k":"C","v":"训练耗时"},{"k":"D","v":"数据集条数"}],"answer":"A","ref":"","exp":"负荷预测属回归任务，常用 MAPE、RMSE、MAE 及准确率衡量误差；工程上还会分时段、分节假日、分温度区间评估。参数量、训练耗时、样本量是模型与数据规模指标，不直接反映预测精度。","source":"负荷预测模型评估通用实践","tip":"","dup":"","batch":"base"},{"id":"XS22","bank":"mock","no":22,"type":"single","typeName":"单选题","topic":"数据安全与合规","scope":"征集说明·新编模拟题","q":"企业开展数据分类分级时，对同时可能落入多个级别的数据，通常应遵循的原则是（ ）。","options":[{"k":"A","v":"就低不就高，简化管理"},{"k":"B","v":"就高从严，按最高级别定级保护"},{"k":"C","v":"随机选定一个级别"},{"k":"D","v":"只按数据量大小定级"}],"answer":"B","ref":"","exp":"分类分级需结合数据一旦泄露、篡改、非法利用可能危害的对象与程度，多维度命中时按「就高从严」定级；且应随业务、法规与目录变化定期复核、动态更新，不是一次性工作。","source":"GB/T 43697—2024《数据安全技术 数据分类分级规则》及行业实践","tip":"","dup":"","batch":"base"},{"id":"XM23","bank":"mock","no":1,"type":"multi","typeName":"不定项选择题","topic":"数据要素政策","scope":"征集说明·新编模拟题","q":"「数据二十条」提出构建的数据基础制度重点包括（ ）。","options":[{"k":"A","v":"数据产权制度"},{"k":"B","v":"数据要素流通和交易制度"},{"k":"C","v":"数据要素收益分配制度"},{"k":"D","v":"数据要素安全治理制度"},{"k":"E","v":"数据要素统一定价制度"}],"answer":"ABCD","ref":"","exp":"政策主线是「一条主线、四项制度」：以数据产权、流通交易、收益分配、安全治理四项制度为重点，并配套建立健全数据要素市场规则。我国实行市场化定价机制，并不存在「数据要素统一定价制度」，E 为干扰项。","source":"《关于构建数据基础制度更好发挥数据要素作用的意见》","tip":"","dup":"","batch":"base"},{"id":"XM24","bank":"mock","no":2,"type":"multi","typeName":"不定项选择题","topic":"数据资产","scope":"征集说明·新编模拟题","q":"企业推进数据资产入表，通常需要具备的条件或完成的工作包括（ ）。","options":[{"k":"A","v":"明确数据资源的权属与控制权"},{"k":"B","v":"相关成本或支出能够可靠计量"},{"k":"C","v":"预期能为企业带来经济利益流入"},{"k":"D","v":"建立数据资源盘点、登记与成本归集机制"},{"k":"E","v":"把所有历史数据无条件全部资本化"}],"answer":"ABCD","ref":"","exp":"入表须满足资产确认条件：由企业拥有或控制、预期带来经济利益、成本可可靠计量，并配套数据资源盘点、权属梳理与成本归集。E 明显违反谨慎性原则——并非所有数据都能入表，研究阶段支出通常费用化。","source":"《企业数据资源相关会计处理暂行规定》","tip":"","dup":"","batch":"base"},{"id":"XM25","bank":"mock","no":3,"type":"multi","typeName":"不定项选择题","topic
