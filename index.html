"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"大模型“幻觉”问题的技术本质是（　）。","options":[{"k":"A","v":"模型基于概率分布生成表达流畅但缺乏事实依据的内容"},{"k":"B","v":"模型训练数据全部错误"},{"k":"C","v":"模型推理速度过慢"},{"k":"D","v":"模型参数量不足"}],"answer":"A","ref":"","exp":"生成式模型以“下一个 token 的概率最大化”为目标，并不天然具备事实核查能力，因此在知识盲区仍会输出看似合理的内容，需通过 RAG、知识图谱约束、事实校验等手段抑制。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBSSS02","bank":"legacy","no":2,"type":"single","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"在检索增强生成（RAG）链路中，对最终回答质量影响最关键的一环是（　）。","options":[{"k":"A","v":"检索阶段召回内容的相关性与准确性"},{"k":"B","v":"大模型的参数规模"},{"k":"C","v":"前端界面的美观程度"},{"k":"D","v":"向量数据库的部署方式"}],"answer":"A","ref":"","exp":"RAG 遵循“garbage in, garbage out”：若召回片段与问题无关或缺失关键信息，再强的生成模型也无法给出正确答案。故检索（召回+重排）是效果上限的决定因素。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBSSS03","bank":"legacy","no":3,"type":"single","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"向量数据库在 RAG 架构中的主要作用是（　）。","options":[{"k":"A","v":"存储文本的嵌入向量并支持高效相似度检索"},{"k":"B","v":"替代关系型数据库完成事务处理"},{"k":"C","v":"负责模型训练的参数更新"},{"k":"D","v":"承担网络流量负载均衡"}],"answer":"A","ref":"","exp":"向量数据库通过近似最近邻（ANN）索引实现语义级检索，使系统能按“意思相近”而非“字面匹配”找到知识片段，是语义检索的基础设施。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBSSS04","bank":"legacy","no":4,"type":"single","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"衡量多名标注人员标注一致性时常用 Kappa 系数，通常认为达到（　）以上表明一致性良好、标注质量可信。","options":[{"k":"A","v":"0.4"},{"k":"B","v":"0.6"},{"k":"C","v":"0.8"},{"k":"D","v":"1.0"}],"answer":"C","ref":"","exp":"按 Landis 与 Koch 的经典划分：0.41—0.60 为中等一致，0.61—0.80 为高度一致，0.81—1.00 为几乎完全一致。工程实践中通常要求关键字段的 Kappa 达到 0.8 以上。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBSSS05","bank":"legacy","no":5,"type":"single","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"监督微调（SFT）与 RAG 的合理分工是（　）。","options":[{"k":"A","v":"SFT 调整模型的行为方式与表达风格，RAG 提供实时、可追溯的事实知识"},{"k":"B","v":"SFT 负责存储企业知识库，RAG 负责训练模型"},{"k":"C","v":"两者功能完全相同，可任选其一"},{"k":"D","v":"RAG 用于训练，SFT 用于推理"}],"answer":"A","ref":"","exp":"SFT 解决“怎么答”（格式、语气、任务范式），RAG 解决“答什么”（事实、数据、条款）。企业落地通常是“基座模型 + SFT 对齐 + RAG 供知”的组合方案。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBSSS06","bank":"legacy","no":6,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"训练集与测试集存在大量重叠样本，会导致（　）。","options":[{"k":"A","v":"数据泄漏，评测指标虚高，模型泛化能力被高估"},{"k":"B","v":"训练速度显著提升"},{"k":"C","v":"模型参数量自动减少"},{"k":"D","v":"标注成本降低"}],"answer":"A","ref":"","exp":"这是典型的数据泄漏（data leakage）。正确做法是按时间、主体或场景做严格切分，并对近重复样本做去重，确保评测集代表真实分布且未被模型“见过”。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBSSS07","bank":"legacy","no":7,"type":"single","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"合成数据在电力行业数据集建设中的主要价值是（　）。","options":[{"k":"A","v":"缓解故障、极端天气等稀缺场景样本不足的问题，但须保证物理合理性与分布真实性"},{"k":"B","v":"完全替代真实数据采集"},{"k":"C","v":"降低对标注规范的要求"},{"k":"D","v":"可以不受约束地无限生成"}],"answer":"A","ref":"","exp":"合成数据可扩充长尾场景，但若分布偏离真实物理规律会引入“仿真偏差”，必须通过真实数据校验、混合训练与效果对比评估其可用性。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBSSS08","bank":"legacy","no":8,"type":"single","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"与纯向量检索相比，知识图谱在电力专业问答中的突出优势是（　）。","options":[{"k":"A","v":"显式表达实体与关系，支持多跳推理与可解释的路径查询"},{"k":"B","v":"检索速度一定更快"},{"k":"C","v":"不需要任何数据治理"},{"k":"D","v":"可以直接替代大模型"}],"answer":"A","ref":"","exp":"电力领域存在大量强结构化关系（设备—线路—变电站—缺陷—规程条款），图谱可支撑“某线路跳闸可能影响哪些台区”这类多跳推理，且推理路径可解释。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBSSS09","bank":"legacy","no":9,"type":"single","topic":"数据治理与标准","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"数据血缘在模型治理中的核心作用是（　）。","options":[{"k":"A","v":"追溯训练数据来源与加工链路，支撑问题定位、变更影响分析与合规审计"},{"k":"B","v":"提升模型推理速度"},{"k":"C","v":"降低显存占用"},{"k":"D","v":"自动生成标注数据"}],"answer":"A","ref":"","exp":"当模型输出异常或数据合规被质疑时，血缘可快速定位“哪批数据、经过哪些加工、影响了哪些模型与应用”，是模型可追溯性的基础。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBSSS10","bank":"legacy","no":10,"type":"single","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"在设备缺陷识别等分类任务的数据集中，负样本（正常样本）的主要作用是（　）。","options":[{"k":"A","v":"提升模型对正常与异常的区分能力，降低误报率"},{"k":"B","v":"增加数据集文件体积"},{"k":"C","v":"延长训练时间以提升精度"},{"k":"D","v":"替代正样本"}],"answer":"A","ref":"","exp":"仅有正样本会导致模型“见谁都像缺陷”；合理配比的负样本与难负样本挖掘，是控制误报率、提升实际可用性的关键。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LBSSM01","bank":"legacy","no":1,"type":"multi","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"提升 RAG 系统回答效果的手段包括（　）。","options":[{"k":"A","v":"优化文档切分策略（按语义/条款切分，控制块大小与重叠）"},{"k":"B","v":"查询改写与多路召回（关键词检索 + 向量检索混合）"},{"k":"C","v":"引入重排序模型（rerank）对召回结果精排"},{"k":"D","v":"在提示词中要求模型标注引用来源，便于核查"}],"answer":"ABCD","ref":"","exp":"四者分别作用于“切分—召回—精排—生成”四个环节，是 RAG 工程优化的标准动作；此外还包括知识库治理、元数据过滤与答案后校验。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LBSSM02","bank":"legacy","no":2,"type":"multi","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"电力行业构建高质量数据集时，常见的质量问题包括（　）。","options":[{"k":"A","v":"标注错误与标注口径不一致"},{"k":"B","v":"类别分布严重不均衡，长尾场景样本稀缺"},{"k":"C","v":"样本重复、近重复导致训练集与测试集污染"},{"k":"D","v":"数据来源授权不清或含未脱敏的个人信息"}],"answer":"ABCD","ref":"","exp":"质量问题既有“技术性”的（准确性、均衡性、去重），也有“合规性”的（授权、隐私），后者往往被忽视却可能直接导致数据集不可用。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LBSSM03","bank":"legacy","no":3,"type":"multi","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"大模型在电力企业落地应用时的主要风险包括（　）。","options":[{"k":"A","v":"幻觉导致给出错误的操作建议或规程引用"},{"k":"B","v":"员工将敏感数据输入外部模型导致泄露"},{"k":"C","v":"训练语料涉及版权或授权瑕疵"},{"k":"D","v":"输出过程不可解释，难以追溯依据"}],"answer":"ABCD","ref":"","exp":"对应四类风险：内容可靠性、数据安全、知识产权、可解释性。实践中需配套“私有化部署 + 输入脱敏 + 引用溯源 + 人工复核”的防护组合。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LBSSM04","bank":"legacy","no":4,"type":"multi","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"数据治理与人工智能治理的协同点包括（　）。","options":[{"k":"A","v":"统一的元数据与数据血缘体系，支撑数据集与模型的双向追溯"},{"k":"B","v":"共享的数据质量规则库与质量门禁"},{"k":"C","v":"统一的权限、脱敏与审计策略"},{"k":"D","v":"数据集版本与模型版本联动管理"}],"answer":"ABCD","ref":"","exp":"AI 治理不是另起一套体系，而应“长在”数据治理底座上；否则会形成两套目录、两套口径，反而增加管理成本与合规盲区。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LBSSM05","bank":"legacy","no":5,"type":"multi","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"评估数据集质量可采用的方法包括（　）。","options":[{"k":"A","v":"规则校验（格式、取值域、完整性、唯一性）"},{"k":"B","v":"抽样人工复核与专家评审"},{"k":"C","v":"一致性统计（如 Kappa 系数、标注者间一致率）"},{"k":"D","v":"在基准任务上训练评测，与基线模型对比效果"}],"answer":"ABCD","ref":"","exp":"“规则+人工+统计+实验”四类方法互补：规则覆盖规模化检查，人工保证专业性，统计度量一致性，实验验证实际价值。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LBSSM06","bank":"legacy","no":6,"type":"multi","topic":"数字化综合","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"企业级数据智能治理平台应具备的核心能力包括（　）。","options":[{"k":"A","v":"数据资产目录与智能检索（按业务语义找数据）"},{"k":"B","v":"数据质量规则引擎与问题闭环工单"},{"k":"C","v":"数据血缘图谱与变更影响分析"},{"k":"D","v":"分级分类、权限管控与访问审计"}],"answer":"ABCD","ref":"","exp":"平台是治理落地的载体，其价值在于把“制度要求”转化为“系统卡点”，实现可查、可管、可控、可审。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LBSSM07","bank":"legacy","no":7,"type":"multi","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"电力行业语料治理相比通用语料，具有的特殊要求包括（　）。","options":[{"k":"A","v":"专业术语、规程条款表述必须准确，容错度低"},{"k":"B","v":"时序量测数据与文本记录需对齐关联"},{"k":"C","v":"受电力监控系统安全分区约束，涉密与敏感数据须隔离处理"},{"k":"D","v":"需符合电力行业标准与安全生产规程的表述规范"}],"answer":"ABCD","ref":"","exp":"电力属于高安全等级行业，语料既要求“专业准确”，又要求“合规可控”，还需处理大量结构化时序数据与非结构化文本的融合问题。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LBSSJ01","bank":"legacy","no":1,"type":"judge","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"引入 RAG 后即可完全消除大模型的幻觉问题。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。RAG 能显著降低幻觉并提供依据，但若检索缺失、片段冲突或模型过度概括，仍可能产生错误输出，需配合引用校验与人工复核。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LBSSJ02","bank":"legacy","no":2,"type":"judge","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"训练数据与评测数据同源且分布重叠，会使评测指标失去参考价值。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。这是数据泄漏的典型表现，指标虚高会导致对模型能力的误判，上线后效果大幅衰减。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LBSSJ03","bank":"legacy","no":3,"type":"judge","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据标注规范应在标注开始前制定，并先通过小批量试标与一致性检验后再全面铺开。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。试标可暴露规范中的歧义条款，提前统一边界案例的判定口径，避免大规模返工。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LBSSJ04","bank":"legacy","no":4,"type":"judge","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"完成大模型微调后，企业就不再需要建设内部知识库与检索系统。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。微调难以承载高频变化的业务知识与条款更新，且无法提供引用溯源；知识库+RAG 仍是知识供给的主通道，两者互补而非替代。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LBSSJ05","bank":"legacy","no":5,"type":"judge","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"知识图谱与向量检索可以互补，形成“图谱 + 语义”的混合检索方案。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。图谱擅长精确关系与多跳推理，向量检索擅长模糊语义匹配，混合方案可兼顾准确性与召回率。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LBSSJ06","bank":"legacy","no":6,"type":"judge","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据集的版本管理与模型的版本管理应当相互关联、可追溯。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。模型效果变化往往源于数据变化，二者版本必须绑定记录，否则无法复现与归因。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LBSSE01","bank":"legacy","no":1,"type":"short","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"四、简答题","q":"【按方向选做 1 题，10 分】\u003cbr\u003eA（数据智能治理）：说明企业开展“指标治理”的主要难点与系统化解决方案。\u003cbr\u003eB（高质量数据集）：说明面向电力行业大模型训练的数据集，从采集、清洗、标注到评测的完整流程与质量控制要点。\u003cbr\u003eC（数据产品设计）：说明数据产品指标体系的设计方法（原子指标、派生指标、复合指标）及落地要点。\u003cbr\u003eD（场景与生态）：说明电力数据支撑“双碳”监测与绿色低碳服务的数据产品设计思路。","options":[],"answer":"","ref":"A 方向：难点——口径不统一（同名不同义）、来源多头（重复建设）、口径变更无人管、指标与业务脱节。\n解法：①建指标字典，明确业务定义、计算公式、数据来源、统计周期、责任部门“五要素”；②分层设计（原子—派生—复合），避免重复加工；③建立指标注册与变更流程，变更须评估下游影响并同步血缘；④在 BI/报表层统一引用指标服务，禁止私建口径；⑤配套指标质量监控（波动异常、口径漂移告警）。\n\nB 方向：①采集——多源（调度、运检、营销、气象、规程文档）汇聚，先解决授权与分类分级；②清洗——去重去噪、格式与术语归一、缺失与异常处理、时间对齐；③标注——制定规范与示例库，试标校准，多人交叉标注 + 专家仲裁，抽检复核，统计 Kappa；④配比——类别均衡、难例挖掘、必要的数据合成与增强；⑤划分——按时间/主体/场景严格切分，防止泄漏；⑥评测——构建领域基准，覆盖准确率、召回率、幻觉率、拒答率等；⑦运营——数据卡片、版本管理、血缘追溯、反馈回流与定期更新。\n\nC 方向：原子指标＝不可再分的基础度量（如“停电时长”）；派生指标＝原子指标＋业务限定＋统计周期（如“本年度城区户均停电时长”）；复合指标＝多个派生指标运算（如“供电可靠率＝1－户均停电时间/统计期时间”）。落地要点：统一命名规范（域—对象—动作—度量—周期）、锁定数据源与计算逻辑、指标与维度分离（可下钻）、建立指标服务 API 供各系统统一调用、变更留痕并评估下游影响。\n\nD 方向：数据基础——分行业分区域用电量、用电结构、绿电与绿证、线损、分布式光伏出力；产品设计——①区域“电—碳”看板（碳排放总量、强度、结构、趋势）；②企业碳账户与碳足迹核算（以用电数据校核化石能源消耗）；③绿电消费认证与绿证核销辅助；④达峰路径推演与节能诊断建议。关键点：明确核算边界与排放因子来源（保证权威可审计）、区分“测算值/校核值”、对外提供时做好企业级数据脱敏与授权、与生态环境部门及第三方核查机构建立数据互认机制。","exp":"评分要点：A 方向：；B 方向：；C 方向：；D 方向：。按要点分层作答，结合电力业务场景举例可加分。","source":"","tip":"","dup":"","typeName":"简答题"},{"id":"LBSSE02","bank":"legacy","no":2,"type":"short","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷二（安全合规卷）","label":"B卷·专项","paper":"卷二（安全合规卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"四、简答题","q":"【必答，10 分】结合大模型在电力企业的落地实践，论述“数据—模型—场景”闭环的关键环节，并说明各环节的风险控制措施。","options":[],"answer":"","ref":"① 数据环节：关键——构建领域高质量数据集与知识库（规程、缺陷案例、运行日志、量测时序），完成清洗、标注、脱敏与分类分级。风控——来源合法与授权清晰、敏感数据不出域、训练数据可追溯（血缘）、防止测试集污染。\n② 模型环节：关键——选择合适的落地路径（私有化部署、基座+SFT+RAG），建立模型评测与版本管理机制。风控——抑制幻觉（引用溯源、事实校验、置信度阈值与拒答机制）、防止提示注入与越权调用、模型输出留痕可审计、定期开展效果与安全评估。\n③ 场景环节：关键——优先选择“高频、刚需、容错可控”的场景（如规程问答、报告辅助生成、缺陷初筛、客服辅助），以人机协同方式切入，逐步扩大授权范围。风控——涉及调度控制、倒闸操作等安全关键决策必须“人在回路”，模型仅提供辅助建议；建立误答反馈与快速回滚机制。\n④ 闭环机制：场景使用产生反馈数据 → 回流优化数据集与检索库 → 迭代模型 → 再评估上线，形成“用得越多、越准越稳”的正循环；配套建设标注与评测团队、明确责任边界与追责机制。\n加分点：强调“不能为了大模型而大模型”，先判断场景是否真的需要生成式能力；提及成本（算力、推理时延）与国产化适配。","exp":"评分要点：① 数据环节：；② 模型环节：；③ 场景环节：；④ 闭环机制：；加分点：。按要点分层作答，结合电力业务场景举例可加分。","source":"","tip":"","dup":"","typeName":"简答题"},{"id":"LCGGS01","bank":"legacy","no":1,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"数据进入流通交易环节，除产权界定外最基础的前置条件是（　）。","options":[{"k":"A","v":"数据权属清晰、来源合法合规、经过分类分级与必要的脱敏处理"},{"k":"B","v":"数据规模足够大"},{"k":"C","v":"数据全部向社会公开"},{"k":"D","v":"数据集中存储于单一平台"}],"answer":"A","ref":"","exp":"“来源合法、权属清晰、范围可控”是数据流通的三条底线。来源不合法或权属存疑的数据，即使技术处理得再干净，也不具备交易与产品化的合法性基础。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCGGS02","bank":"legacy","no":2,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"公共数据授权运营的基本内涵是（　）。","options":[{"k":"A","v":"在保障安全与公共利益前提下，由政府按规定授权符合条件的运营主体对公共数据进行加工开发，形成数据产品和服务并向社会提供"},{"k":"B","v":"把公共数据无差别免费开放给所有企业"},{"k":"C","v":"由政府部门直接从事数据产品销售"},{"k":"D","v":"将公共数据所有权转让给运营企业"}],"answer":"A","ref":"","exp":"公共数据授权运营是“所有权不转移、使用权有条件让渡”的制度安排，强调“原始数据不出域、数据可用不可见”，并建立收益分配与安全监管机制。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCGGS03","bank":"legacy","no":3,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"根据财政部《企业数据资源相关会计处理暂行规定》，企业内部使用、符合无形资产定义的数据资源，应当计入（　）科目。","options":[{"k":"A","v":"无形资产"},{"k":"B","v":"存货"},{"k":"C","v":"固定资产"},{"k":"D","v":"商誉"}],"answer":"A","ref":"","exp":"用于内部使用与服务管理、符合无形资产定义和确认条件的数据资源，作为无形资产核算；日常活动中持有、用于出售的数据资源，作为存货核算。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCGGS04","bank":"legacy","no":4,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"下列不属于数据资产评估常用基本方法的是（　）。","options":[{"k":"A","v":"成本法"},{"k":"B","v":"收益法"},{"k":"C","v":"市场法"},{"k":"D","v":"清算法"}],"answer":"D","ref":"","exp":"数据资产评估通常采用成本法（重置成本）、收益法（预期收益折现）、市场法（可比交易），实践中常多法并用、交叉验证。清算法并非数据资产评估的基本方法。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCGGS05","bank":"legacy","no":5,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"数据交易所（数据交易机构）的核心功能是（　）。","options":[{"k":"A","v":"提供合规的交易场所、规则体系、登记结算与撮合服务"},{"k":"B","v":"直接生产数据产品"},{"k":"C","v":"替企业决定数据价格"},{"k":"D","v":"负责数据采集与标注"}],"answer":"A","ref":"","exp":"数据交易所本质是“规则+基础设施+服务”的综合平台，提供登记、挂牌、交易、结算、交付、凭证与争议处理等服务，自身不当然是数据供给方。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCGGS06","bank":"legacy","no":6,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"数据产品定价相比传统商品最突出的难点是（　）。","options":[{"k":"A","v":"边际复制成本近乎为零、价值高度依赖具体场景，难以用单一标准衡量"},{"k":"B","v":"生产成本过高"},{"k":"C","v":"运输成本难以核算"},{"k":"D","v":"保质期难以确定"}],"answer":"A","ref":"","exp":"数据可无限复制、复用不损耗，其价格更多取决于“使用方获得的增量价值”，因此常采用按调用量、按效果分成、订阅制等差异化定价方式。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCGGS07","bank":"legacy","no":7,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"企业将数据资源确认入表后，后续应当（　）。","options":[{"k":"A","v":"按规定进行后续计量，并在出现减值迹象时进行减值测试"},{"k":"B","v":"一次性计入当期损益后不再核算"},{"k":"C","v":"按年重估并直接调整资本公积"},{"k":"D","v":"无须任何会计处理"}],"answer":"A","ref":"","exp":"入表不是“一入了之”，需按无形资产或存货的会计准则进行摊销、减值测试与信息披露，否则会形成资产虚增风险。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCGGS08","bank":"legacy","no":8,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"数据产品采用最小可用版本（MVP）策略的主要意义是（　）。","options":[{"k":"A","v":"以最小成本快速验证需求真伪与场景价值，降低试错成本"},{"k":"B","v":"一次性交付全部功能以节省开发时间"},{"k":"C","v":"规避合规审查"},{"k":"D","v":"减少用户参与"}],"answer":"A","ref":"","exp":"MVP 的核心是“验证假设而非交付完整产品”，通过小范围真实用户反馈判断“是否有人用、是否值得继续投入”，避免大规模投入后才发现是伪需求。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCGGS09","bank":"legacy","no":9,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"将用户按用电特征划分为“高耗能连续生产型”“商业楼宇型”“居民峰谷敏感型”，这类成果属于（　）。","options":[{"k":"A","v":"数据标签/画像服务"},{"k":"B","v":"原始数据"},{"k":"C","v":"数据标准"},{"k":"D","v":"数据模型参数"}],"answer":"A","ref":"","exp":"标签是对实体特征的提炼与抽象，标签体系（用户画像）是数据产品中价值密度高、可复用的形态，广泛用于精准服务、风险识别与负荷管理。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCGGS10","bank":"legacy","no":10,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"数据产品需求分析中绘制“用户旅程地图”的主要作用是（　）。","options":[{"k":"A","v":"识别用户在各环节的行为、触点与痛点，定位数据可以介入的价值点"},{"k":"B","v":"确定产品的技术架构"},{"k":"C","v":"核算服务器成本"},{"k":"D","v":"替代需求评审"}],"answer":"A","ref":"","exp":"旅程地图把“用户—场景—任务—痛点”串成链条，帮助产品经理发现“哪一步最耗时、最容易出错、最需要决策支持”，从而精准定义数据产品的切入点。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCGGS11","bank":"legacy","no":11,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"与 API 接口服务相比，SaaS 型数据产品的典型特点是（　）。","options":[{"k":"A","v":"提供完整的交互界面与业务流程，用户开箱即用，无需自行开发集成"},{"k":"B","v":"只能提供原始数据下载"},{"k":"C","v":"不能按订阅收费"},{"k":"D","v":"不涉及权限管理"}],"answer":"A","ref":"","exp":"API 面向有开发能力的客户、嵌入其业务流程；SaaS 面向终端用户、交付完整使用体验。二者常组合使用：底层 API 供集成，上层 SaaS 供直接使用。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCGGS12","bank":"legacy","no":12,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"测算数据产品投入产出比（ROI）时，收益侧通常包括（　）。","options":[{"k":"A","v":"增收（对外创收）、降本（减少人工与损耗）、提效（缩短决策与作业时间）、风险减损"},{"k":"B","v":"仅包括对外销售收入"},{"k":"C","v":"仅包括节省的人力成本"},{"k":"D","v":"仅包括政府补贴"}],"answer":"A","ref":"","exp":"数据产品价值往往以“间接效益”为主，需通过基线对比（上线前后）、替代成本法、风险损失避免额等方式量化，否则难以获得持续投入。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCGGS13","bank":"legacy","no":13,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"“数据要素×”中所说的“乘数效应”，本质是指（　）。","options":[{"k":"A","v":"数据与其他生产要素结合后，通过优化资源配置放大全要素生产率"},{"k":"B","v":"数据数量按倍数增长"},{"k":"C","v":"数据存储成本成倍下降"},{"k":"D","v":"数据交易额逐年翻番"}],"answer":"A","ref":"","exp":"乘数效应强调数据“复用不损耗、融合可增值”的特性：同一份数据在不同场景反复使用，与资本、劳动、技术结合后产生放大效应，而非简单叠加。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCGGS14","bank":"legacy","no":14,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"某数据服务承诺“可用性 99.9%”，按全年 365 天计算，其年度允许不可用时长约为（　）。","options":[{"k":"A","v":"约 8.76 小时"},{"k":"B","v":"约 52 分钟"},{"k":"C","v":"约 3.65 天"},{"k":"D","v":"约 1 小时"}],"answer":"A","ref":"","exp":"全年 8760 小时 ×（1－99.9%）≈ 8.76 小时；99.99% 约为 52.6 分钟，99.9% 是常见的企业级 SLA 水平。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCGGS15","bank":"legacy","no":15,"type":"single","topic":"数据治理与标准","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"数据治理中“数据资产目录”与“数据资源目录”的主要区别是（　）。","options":[{"k":"A","v":"资源目录侧重“有什么数据、在哪里”，资产目录进一步标注权属、价值、质量与可用状态，支撑价值运营"},{"k":"B","v":"两者完全等同"},{"k":"C","v":"资产目录只记录结构化数据"},{"k":"D","v":"资源目录只服务外部客户"}],"answer":"A","ref":"","exp":"资源目录解决“看得见”，资产目录解决“算得清、用得好、管得住”，是数据从资源走向资产的管理抓手。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCGGM01","bank":"legacy","no":1,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"企业数据资产管理的主要环节包括（　）。","options":[{"k":"A","v":"数据资产盘点与登记，形成资产目录"},{"k":"B","v":"权属确认与合规审查，明确可用范围"},{"k":"C","v":"价值评估与会计处理（入表、摊销、减值）"},{"k":"D","v":"资产运营与处置（授权、交易、退出）"}],"answer":"ABCD","ref":"","exp":"数据资产管理是“盘点—确权—估值—入表—运营—处置”的闭环，任一环节缺失都会导致资产“账实不符”或“有账无值”。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LCGGM02","bank":"legacy","no":2,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"数据产品定价可参考的因素包括（　）。","options":[{"k":"A","v":"数据采集、治理与研发的成本"},{"k":"B","v":"使用方因该数据获得的增量价值（收益分成）"},{"k":"C","v":"数据的稀缺性与可替代性"},{"k":"D","v":"合规与安全投入成本（脱敏、审计、保险）"}],"answer":"ABCD","ref":"","exp":"单一成本导向会低估高价值场景数据，单一价值导向又缺乏可验证性；实践中常用“成本保底 + 价值分成”的复合定价。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LCGGM03","bank":"legacy","no":3,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"优秀的数据产品经理应具备的核心能力包括（　）。","options":[{"k":"A","v":"业务理解力：能把业务痛点翻译成数据问题"},{"k":"B","v":"数据理解力：清楚数据可得性、质量与边界"},{"k":"C","v":"产品设计力：能定义指标、形态与交互"},{"k":"D","v":"沟通协调力：能推动业务、技术、合规多方协同"}],"answer":"ABCD","ref":"","exp":"数据产品经理是“翻译官+架构师+项目经理”的复合角色，最忌“只懂技术不懂业务”或“只懂业务不懂数据”。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LCGGM04","bank":"legacy","no":4,"type":"multi","topic":"数据安全与合规","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"数据产品对外发布前应完成的合规审查内容包括（　）。","options":[{"k":"A","v":"数据来源合法性与授权链条完整性"},{"k":"B","v":"是否涉及个人信息、是否取得单独同意或已完成匿名化"},{"k":"C","v":"数据分类分级结果及对外提供的合规性"},{"k":"D","v":"产品使用范围、期限、对象是否被明确限定并可管控"}],"answer":"ABCD","ref":"","exp":"合规审查是数据产品的“准生证”，需形成书面评估记录，并在合同中明确用途限定、禁止转售、违约追责等条款。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LCGGM05","bank":"legacy","no":5,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"数据产品运营阶段应重点关注的指标包括（　）。","options":[{"k":"A","v":"调用量/访问量、活跃用户数与留存率"},{"k":"B","v":"业务渗透率与场景覆盖率"},{"k":"C","v":"服务可用性、响应时延与故障率"},{"k":"D","v":"创收金额或降本提效的量化值"}],"answer":"ABCD","ref":"","exp":"分别对应“用得多不多、铺得广不广、跑得稳不稳、值不值钱”，四类指标共同构成数据产品健康度评价体系。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LCGGM06","bank":"legacy","no":6,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"当前制约数据要素高效流通的主要障碍包括（　）。","options":[{"k":"A","v":"确权难：数据权属边界模糊，多方参与难以界定"},{"k":"B","v":"定价难：缺乏公认的价值评估与定价机制"},{"k":"C","v":"互信难：供给方担心失控、需求方担心质量"},{"k":"D","v":"安全顾虑：泄露与滥用风险导致“不敢供、不敢用”"}],"answer":"ABCD","ref":"","exp":"“四难”是数据要素市场化的核心症结，对应的破题路径分别是产权制度、价格机制、可信流通基础设施与安全合规体系。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LCGGM07","bank":"legacy","no":7,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"关于公共数据开放与公共数据授权运营，理解正确的有（　）。","options":[{"k":"A","v":"开放强调普遍可及、以无偿为主，面向社会公众提供原始或轻度加工数据"},{"k":"B","v":"授权运营强调在安全可控前提下，由特定主体加工形成产品服务"},{"k":"C","v":"两者都需要遵守分类分级与安全审查要求"},{"k":"D","v":"授权运营意味着公共数据所有权发生转移"}],"answer":"ABC","ref":"","exp":"D 项错误。授权运营让渡的是加工使用权与产品经营权，公共数据的所有权（持有权）仍在政府侧，且须接受全程监管。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LCGGM08","bank":"legacy","no":8,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"数据产品生态中通常包含的角色有（　）。","options":[{"k":"A","v":"数据提供方（电网企业、政府部门、第三方机构）"},{"k":"B","v":"数据加工与产品开发方"},{"k":"C","v":"产品运营与渠道分销方"},{"k":"D","v":"监管方与第三方服务机构（评估、审计、公证）"}],"answer":"ABCD","ref":"","exp":"健康的生态需要“供给—加工—运营—渠道—监管—服务”多方分工，通过清晰的权责与收益分配机制形成可持续合作。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LCGGJ01","bank":"legacy","no":1,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据资源确认入表后，无须再评估其价值是否发生减值。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。入表后须按会计准则进行摊销与减值测试；若数据失效、场景消失或技术迭代导致可收回金额低于账面价值，应计提减值。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LCGGJ02","bank":"legacy","no":2,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据产品的边际复制成本接近于零，因此定价应更多参考使用方获得的增量价值，而非仅按成本加成。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。成本加成法会严重低估高价值场景的数据产品，也难以为低价值场景提供合理折扣，价值导向定价更符合数据特性。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LCGGJ03","bank":"legacy","no":3,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"公共数据属于公共资源，可以无条件向社会开放。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。公共数据开放须依法依规，涉及国家安全、商业秘密、个人隐私的数据不得开放，且需分类分级、脱敏处理后按条件开放。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LCGGJ04","bank":"legacy","no":4,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据产品需求分析应从用户场景与业务痛点出发，而不是从“我们已有什么数据”出发。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。以数据找场景容易产出“自嗨型产品”，以场景找数据才能确保产品被真正使用。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LCGGJ05","bank":"legacy","no":5,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据产品上线后应建立用户反馈收集与版本迭代机制。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。上线只是起点，需通过埋点、访谈、工单、NPS 等方式持续收集反馈，形成“使用—反馈—优化”的迭代闭环。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LCGGJ06","bank":"legacy","no":6,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据交易必须通过数据交易所场内完成，场外交易一律属于违法行为。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。我国实行场内场外相结合的多层次市场体系，场外交易在依法合规前提下是允许的，交易所提供的是规范化、可追溯的交易通道。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LCGGJ07","bank":"legacy","no":7,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"同一份数据对不同使用者的价值可能差异巨大，因此“一数一价、一场景一价”是合理的定价思路。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。数据价值随场景、时效、精度、独占性变化，差异化定价（含阶梯定价、按效果分成）在实践中更为普遍。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LCGGJ08","bank":"legacy","no":8,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"MVP（最小可用版本）策略同样适用于数据产品，可先小范围验证再规模化推广。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。数据产品的不确定性主要来自需求而非技术，先用最小成本验证“有没有人用、值不值得用”，可显著降低失败率。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LCGGJ09","bank":"legacy","no":9,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"在多主体合作的数据产品中，收益分配机制可以暂不考虑，先做成再谈分钱。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。收益分配是生态合作的动力基础，前期不谈清极易在商业化阶段产生纠纷，应在合作协议中预先约定分配比例、计量方式与调整机制。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LCGGE01","bank":"legacy","no":1,"type":"short","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·通用","paper":"卷三（数据产品卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"四、简答题","q":"请阐述企业推动数据从“资源”走向“资产”再走向“价值”的管理路径，并说明数据资产运营的关键抓手。（10 分）","options":[],"answer":"","ref":"① 资源化：完成数据盘点与资产目录建设，统一标准与主数据，开展质量治理，使数据“看得见、说得清、信得过”。\n② 资产化：①确权——厘清数据来源、授权链条与使用边界；②估值——综合运用成本法、收益法、市场法；③核算——按准则确认无形资产或存货，规范摊销、减值与披露；④登记——参与数据资产登记、质押融资等创新试点。\n③ 价值化：①场景挖掘——围绕降本、提效、增收、风控四条主线建立场景清单，优先做“高频、刚需、可量化”的场景；②产品化——把数据封装为 API、看板、模型、指数、标签等标准形态；③流通化——通过数据交易所挂牌、可信数据空间实现跨主体供给；④商业模式——订阅、按次调用、效果分成、项目制并行。\n④ 运营抓手：建立数据资产台账与价值看板（有多少、值多少、用得怎样）；设置数据产品经理与运营岗；建立“数据成本—收益”核算机制；配套合规与安全底线；以考核指标（调用量、渗透率、创效额）驱动持续优化。\n加分点：指出“入表不等于增值”，避免为入表而入表；强调价值实现依赖场景与生态，而非单纯的技术封装。","exp":"评分要点：① 资源化：；② 资产化：；③ 价值化：；④ 运营抓手：；加分点：。按要点分层作答，结合电力业务场景举例可加分。","source":"","tip":"","dup":"","typeName":"简答题"},{"id":"LCSSS01","bank":"legacy","no":1,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"数据产品需求调研中采用“5W1H”框架，主要是为了（　）。","options":[{"k":"A","v":"系统厘清用户是谁、在什么场景、什么时间地点、为什么、以何种方式使用数据"},{"k":"B","v":"确定技术架构与服务器规格"},{"k":"C","v":"核算研发人力成本"},{"k":"D","v":"编写测试用例"}],"answer":"A","ref":"","exp":"5W1H（Who/What/When/Where/Why/How）帮助把模糊需求结构化，避免“我要一个数据大屏”这类无法验收的表述。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCSSS02","bank":"legacy","no":2,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"KANO 模型在数据产品需求分析中的作用是（　）。","options":[{"k":"A","v":"区分基本型、期望型、兴奋型与无差异需求，确定投入优先级"},{"k":"B","v":"计算产品的投资回报率"},{"k":"C","v":"评估数据质量等级"},{"k":"D","v":"确定数据分类分级"}],"answer":"A","ref":"","exp":"基本型需求缺失会导致强烈不满（如数据准确性），兴奋型需求能带来超预期体验（如智能预警），资源应优先保障基本型、择机打造兴奋点。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCSSS03","bank":"legacy","no":3,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"数据产品原型设计阶段，最经济高效的做法通常是（　）。","options":[{"k":"A","v":"先用低保真线框图与业务方确认信息结构与流程，再进入高保真设计"},{"k":"B","v":"直接开发完整系统后再给用户看"},{"k":"C","v":"跳过原型直接写需求文档"},{"k":"D","v":"先采购服务器再设计界面"}],"answer":"A","ref":"","exp":"低保真原型沟通成本低、修改代价小，可在早期暴露“信息组织不合理、流程走不通”等结构性问题。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCSSS04","bank":"legacy","no":4,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"敏捷开发中，“用户故事”的标准表述句式是（　）。","options":[{"k":"A","v":"作为〈角色〉，我希望〈功能〉，以便〈价值〉"},{"k":"B","v":"系统应当支持〈功能〉"},{"k":"C","v":"输入 A 输出 B"},{"k":"D","v":"如果〈条件〉则〈结果〉"}],"answer":"A","ref":"","exp":"用户故事强调“角色—目标—价值”，避免脱离使用者的功能堆砌，并为后续验收标准（AC）提供依据。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCSSS05","bank":"legacy","no":5,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"在数据产品中埋点采集用户行为数据，主要目的是（　）。","options":[{"k":"A","v":"量化使用行为，识别功能使用率与流失环节，指导产品优化"},{"k":"B","v":"增加系统存储压力"},{"k":"C","v":"替代业务调研"},{"k":"D","v":"用于对外销售"}],"answer":"A","ref":"","exp":"埋点是产品迭代的“眼睛”，可回答“哪些功能没人用、用户在哪一步放弃、哪类用户最活跃”，避免凭感觉做决策。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCSSS06","bank":"legacy","no":6,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"数据服务 API 设计中强调“幂等性”，其含义是（　）。","options":[{"k":"A","v":"同一请求重复调用多次，对系统状态产生的影响与调用一次相同"},{"k":"B","v":"接口必须加密传输"},{"k":"C","v":"接口响应时间必须小于 1 秒"},{"k":"D","v":"接口只能被调用一次"}],"answer":"A","ref":"","exp":"幂等性可避免网络重试导致的重复扣费、重复写入等问题，通常通过唯一请求号、去重表或状态机实现。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCSSS07","bank":"legacy","no":7,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"数据产品采用灰度发布的主要目的是（　）。","options":[{"k":"A","v":"先面向小范围用户开放，验证稳定性与效果，控制故障影响面"},{"k":"B","v":"一次性全量上线以抢占市场"},{"k":"C","v":"绕过测试环节"},{"k":"D","v":"降低开发成本"}],"answer":"A","ref":"","exp":"灰度发布配合监控与回滚预案，可将“可能的重大故障”转化为“可控的小范围问题”，是数据产品上线的标准动作。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCSSS08","bank":"legacy","no":8,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"数据产品价值评估中，“减少人工统计工时、缩短报表编制周期”属于（　）。","options":[{"k":"A","v":"内部降本提效类价值"},{"k":"B","v":"对外创收类价值"},{"k":"C","v":"品牌溢价类价值"},{"k":"D","v":"合规避险类价值"}],"answer":"A","ref":"","exp":"数据产品价值通常分为对外创收、内部降本提效、风险减损、战略储备四类，内部类价值需通过工时折算、基线对比量化。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCSSS09","bank":"legacy","no":9,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"数据产品失败最常见的原因是（　）。","options":[{"k":"A","v":"需求失真或伪需求，产品上线后无人使用"},{"k":"B","v":"服务器性能不足"},{"k":"C","v":"代码质量不高"},{"k":"D","v":"界面不够美观"}],"answer":"A","ref":"","exp":"“建好了没人用”是数据产品的高频死法，根因多为需求未经真实验证、价值主张不清晰或使用门槛过高。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCSSS10","bank":"legacy","no":10,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"数据产品交付实施阶段，验收环节的核心依据应当是（　）。","options":[{"k":"A","v":"需求文档与合同中约定的功能、性能、数据质量与安全合规指标"},{"k":"B","v":"开发人员的主观判断"},{"k":"C","v":"领导的个人偏好"},{"k":"D","v":"竞品的功能清单"}],"answer":"A","ref":"","exp":"验收须“可度量、可追溯”，提前把指标写进合同（如接口响应时延、数据准确率、服务可用性），避免交付后扯皮。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LCSSM01","bank":"legacy","no":1,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"数据产品需求调研的常用方法包括（　）。","options":[{"k":"A","v":"深度访谈与现场跟班观察"},{"k":"B","v":"问卷调研与用户行为数据分析"},{"k":"C","v":"竞品分析与行业标杆对标"},{"k":"D","v":"工作坊（Workshop）共创与需求评审"}],"answer":"ABCD","ref":"","exp":"访谈挖动机、观察看真实行为、问卷求广度、数据看客观事实、对标找差距、共创求共识，多种方法交叉验证可最大限度还原真实需求。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LCSSM02","bank":"legacy","no":2,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"一份完整的数据产品设计文档通常应包含（　）。","options":[{"k":"A","v":"业务背景、目标用户与核心价值主张"},{"k":"B","v":"功能清单、信息架构与交互流程"},{"k":"C","v":"数据来源、指标定义与算法逻辑"},{"k":"D","v":"非功能要求（性能、安全、合规、可用性）"}],"answer":"ABCD","ref":"","exp":"设计文档是开发、测试、验收、运维的共同依据，尤其“指标定义”与“数据来源”必须写到可执行颗粒度，否则后期口径必然分歧。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LCSSM03","bank":"legacy","no":3,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"数据产品实施交付的关键环节包括（　）。","options":[{"k":"A","v":"数据接入与清洗，保障源头可用"},{"k":"B","v":"模型/算法开发与效果验证"},{"k":"C","v":"接口联调、性能压测与安全测试"},{"k":"D","v":"用户培训、试运行与正式验收"}],"answer":"ABCD","ref":"","exp":"实施是“最后一公里”，多数项目延期源于数据接入受阻与联调不畅，需提前锁定数据供给责任人与接口规范。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LCSSM04","bank":"legacy","no":4,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"数据产品常见的商业模式包括（　）。","options":[{"k":"A","v":"订阅制（按期收费，如年费/月费）"},{"k":"B","v":"按调用量/使用量计费"},{"k":"C","v":"按效果分成（如按促成贷款规模分成）"},{"k":"D","v":"项目制定制开发与服务收费"}],"answer":"ABCD","ref":"","exp":"不同模式适配不同场景：标准化产品适合订阅，外部赋能适合按量，金融等高价值场景适合分成，个性化需求适合项目制。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LCSSM05","bank":"legacy","no":5,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"数据产品上线后的推广运营手段包括（　）。","options":[{"k":"A","v":"标杆场景打造与内部案例宣传"},{"k":"B","v":"用户培训、操作手册与一对一辅导"},{"k":"C","v":"与业务流程/考核制度绑定，形成使用刚性"},{"k":"D","v":"定期发布数据产品价值报告，争取持续投入"}],"answer":"ABCD","ref":"","exp":"数据产品“用起来”比“做出来”更难，需要产品运营把“可用”转化为“必用”，否则极易沦为演示工具。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LCSSM06","bank":"legacy","no":6,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"优化数据产品使用体验的重点方向包括（　）。","options":[{"k":"A","v":"降低使用门槛（简化操作、预置模板、智能推荐）"},{"k":"B","v":"提升响应速度与结果可解释性"},{"k":"C","v":"提供个性化配置与订阅推送"},{"k":"D","v":"完善帮助文档与在线支持"}],"answer":"ABCD","ref":"","exp":"数据产品的用户往往是业务人员而非技术人员，“最后一公里”的体验投入往往比模型精度提升带来更高的使用率。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LCSSM07","bank":"legacy","no":7,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"数据产品建立退出机制时应考虑（　）。","options":[{"k":"A","v":"明确退出触发条件（使用率长期过低、价值不达预期、合规风险）"},{"k":"B","v":"做好数据清理与用户告知，保障数据安全"},{"k":"C","v":"沉淀可复用能力，避免重复建设"},{"k":"D","v":"无限期保留所有产品以维持数量指标"}],"answer":"ABC","ref":"","exp":"D 项错误。“只生不死”会导致资源分散、维护成本高企，建立退出机制是产品组合健康管理的必要环节。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LCSSJ01","bank":"legacy","no":1,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据产品的功能越多，用户使用意愿就越强。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。功能堆砌会抬高学习成本与认知负担，数据产品应聚焦核心场景，做“少而准”而不是“全而杂”。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LCSSJ02","bank":"legacy","no":2,"type":"judge","topic":"数字化综合","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"需求评审中发现需求无法转化为可度量的指标时，应暂缓开发并重新澄清业务目标。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。无法度量的需求既无法验收也无法证明价值，往往是“伪需求”或描述不清的信号。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LCSSJ03","bank":"legacy","no":3,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据产品上线后，即使使用率很低，只要技术先进就应继续保留。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。技术先进性不能替代用户价值，长期低使用率的产品应分析原因，必要时改造或退出，避免资源沉淀。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LCSSJ04","bank":"legacy","no":4,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据产品的成功高度依赖与业务流程的融合，单纯提供数据而不嵌入流程往往难以持续。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。数据只有进入“必须用它才能完成工作”的流程节点，才会形成稳定使用；否则用户会退回原有习惯。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LCSSJ05","bank":"legacy","no":5,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据产品的验收标准应在项目启动阶段就与用户达成一致。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。验收标准前置可避免后期范围蔓延（scope creep）和“做完了但不认可”的争议。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LCSSJ06","bank":"legacy","no":6,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"为快速上线，数据产品可以先不考虑权限控制，后续再补。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。权限是数据产品的安全底座，事后补建往往需要重构数据模型与调用链路，且期间存在越权访问风险。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LCSSE01","bank":"legacy","no":1,"type":"short","topic":"人工智能与高质量数据集","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"四、简答题","q":"【按方向选做 1 题，10 分】\u003cbr\u003eA（数据智能治理）：说明如何通过数据治理提升数据产品的可信度与复用率。\u003cbr\u003eB（高质量数据集）：说明面向电力设备智能巡检，如何设计并构建一个可评测、可迭代的图像数据集。\u003cbr\u003eC（数据产品设计）：以“企业用电能效诊断”为例，说明从需求分析到上线运营的完整产品设计过程与关键交付物。\u003cbr\u003eD（场景与生态）：说明数据产品在跨行业生态中（如电力+金融、电力+交通）如何设计商业模式与收益分配机制。","options":[],"answer":"","ref":"A 方向：①可信度——统一口径与指标字典消除“同名不同义”；建立质量规则与门禁（完整性、准确性、及时性校验），不合格数据不进入产品；提供数据血缘与来源说明，让用户“知其所以然”；输出数据质量报告与置信度提示。\n②复用率——按“主题域+实体”组织数据资产目录，支持按业务语义检索；沉淀公共维度与标签，避免各产品重复加工；以 API/指标服务方式统一供给，一次治理多方复用；建立复用度统计与激励。\n\nB 方向：①任务定义——明确缺陷类别（如绝缘子破损、销钉缺失、异物悬挂）与判定边界，确定检测/分类任务形态；②采集——覆盖不同设备类型、光照、天气、拍摄角度与分辨率，保证场景多样性与长尾覆盖；③标注——制定标注规范与典型示例，明确最小可辨尺寸、遮挡与模糊样本的处理规则；多人交叉标注+专家仲裁，抽检计算 Kappa；④清洗与配比——去重（同塔同角度连拍）、剔除无效图、类别均衡、难例挖掘；⑤划分——按线路/杆塔划分训练/验证/测试集，避免同一目标跨集泄漏；⑥评测——采用 mAP、召回率、误报率等指标，构建领域基准并做跨站所泛化测试；⑦迭代——现场误报漏报样本回流，定期更新版本，维护数据卡片与血缘。\n\nC 方向：①需求分析——用户为企业的能源管理员/园区运营方，痛点是“不知道钱花在哪、不知道从哪省”；访谈+用能账单分析+现场走访，明确核心价值为“找浪费、给建议、算收益”。②产品定义——功能包括用能画像、峰谷分析与需量预警、同类企业对标、节能改造建议与投资回收期测算；形态为 Web 看板+月度诊断报告+API。③设计——指标体系（单位产值能耗、峰谷电量占比、需量峰值、功率因数）、算法（负荷分解、异常识别、对标分位）、交互原型。④实施——接入营销计量与气象数据，完成模型开发与联调，选择 3—5 家企业试点。⑤上线——合规审查（企业数据脱敏、授权）、灰度发布、培训。⑥运营——按“诊断报告采纳率、节能措施落地率、节省电费额”评估，持续迭代。关键交付物：需求说明书、指标字典、产品原型、算法验证报告、合规评估、试点效果报告、运营看板。\n\nD 方向：①模式设计——数据不出域，通过隐私计算/可信空间输出“核验结果”或“评分标签”，避免原始数据交易；②收费方式——按查询次数、按年度订阅、按业务效果分成（如按促成贷款规模的一定比例）；③定价依据——覆盖数据治理与合规成本，同时让渡部分增量价值给合作方以实现共赢；④收益分配——按“数据提供方—技术加工方—渠道运营方”贡献度约定比例，设置保底+分成结构，明确计量口径与结算周期；⑤治理机制——签订多方协议，明确用途限定、禁止转售、数据销毁、违约责任；由第三方审计或区块链存证保障履约；⑥风险控制——防止过度授信与歧视性定价，落实个人信息保护与消费者权益要求。","exp":"评分要点：A 方向：；B 方向：；C 方向：；D 方向：。按要点分层作答，结合电力业务场景举例可加分。","source":"","tip":"","dup":"","typeName":"简答题"},{"id":"LCSSE02","bank":"legacy","no":2,"type":"short","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷三（数据产品卷）","label":"C卷·专项","paper":"卷三（数据产品卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"四、简答题","q":"【必答，10 分】某电网企业计划将“电力看经济”系列数据产品推向政府、金融、产业园区等外部客户。请分析其面临的主要挑战，并提出产品化与商业化落地的实施路径。","options":[],"answer":"","ref":"① 主要挑战：合规——数据对外提供的合法性、企业及个人信息保护、分类分级与授权边界；质量——口径不统一、样本代表性不足导致结论偏差；价值——客户对“电力数据能说明什么”认知不足，付费意愿待培养；竞争——统计部门、第三方数据商已有同类产品；能力——缺乏面向市场的产品、销售与运营体系。\n② 产品化路径：场景分级（区域经济监测、行业景气、园区活力、企业信用辅助），先做“高价值、低敏感”的指数类产品；统一指标体系与算法模型，形成标准化指数（如工业用电景气指数、区域经济活跃度指数）；以 API、报告、看板三种形态组合交付；建立数据产品目录与定价体系。\n③ 商业化路径：先内部试点验证（服务公司经营决策）→ 政府合作试点（与统计、发改部门联合发布，借助权威背书）→ 金融机构付费（征信辅助、贷后预警）→ 园区与产业链客户订阅；渠道上采用直销+生态伙伴分销；建立标杆案例与效果评估报告作为销售素材。\n④ 保障机制：合规前置审查与合同约束；建立数据产品运营团队与考核激励；完善交付与售后（SLA、培训、答疑）；持续投入算法迭代与场景拓展，形成“数据—产品—客户—反馈”的闭环。\n加分点：警惕“数据万能论”，明确电力数据是“辅助指标”而非“替代统计”；强调与政府部门的数据互认与联合发布机制。","exp":"评分要点：① 主要挑战：；② 产品化路径：；③ 商业化路径：；④ 保障机制：；加分点：。按要点分层作答，结合电力业务场景举例可加分。","source":"","tip":"","dup":"","typeName":"简答题"},{"id":"LDGGS01","bank":"legacy","no":1,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"“六网协同”通常是指以电网为纽带，推动电力与（　）等网络型基础设施的协同规划、建设与运行。","options":[{"k":"A","v":"交通网、通信网、水务网、燃气网、热力网"},{"k":"B","v":"公路网、铁路网、航空网、水运网、管道网"},{"k":"C","v":"政务网、金融网、教育网、医疗网、安防网"},{"k":"D","v":"局域网、城域网、广域网、接入网、核心网"}],"answer":"A","ref":"","exp":"六网协同强调网络型基础设施之间的数据互通与运行协同，电力作为能源枢纽与各类网络深度耦合，是协同的关键纽带（具体口径以赛事官方解释为准）。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDGGS02","bank":"legacy","no":2,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"“交能融合”的核心内涵是（　）。","options":[{"k":"A","v":"交通系统与能源系统在规划、建设、运行、服务层面的深度协同，实现绿色低碳与高效互济"},{"k":"B","v":"把公路改造为发电场"},{"k":"C","v":"由交通部门接管电力供应"},{"k":"D","v":"仅指在高速公路服务区建设充电桩"}],"answer":"A","ref":"","exp":"交能融合覆盖“源—网—荷—储—车”协同，包括充电基础设施布局、车网互动（V2G）、港口岸电、轨道交通与机场节能、交通用能电气化等多个方向。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDGGS03","bank":"legacy","no":3,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"V2G（Vehicle-to-Grid，车网互动）指的是（　）。","options":[{"k":"A","v":"电动汽车不仅从电网充电，还可在需要时向电网或负荷反向放电，作为分布式储能资源参与电网调节"},{"k":"B","v":"车辆通过 5G 网络连接电网信息系统"},{"k":"C","v":"把电网设备装载到移动车辆上"},{"k":"D","v":"电动车充电桩的联网计费功能"}],"answer":"A","ref":"","exp":"V2G 使电动汽车成为可调度的移动储能，可参与削峰填谷、调频、备用等，但受电池循环寿命、充放电成本与用户意愿约束。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDGGS04","bank":"legacy","no":4,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"电力数据能够用于研判宏观经济走势，其基本逻辑是（　）。","options":[{"k":"A","v":"用电量与经济活动高度相关，且具有实时性好、覆盖面广、颗粒度细的特点，可作为经济运行的先行或同步指标"},{"k":"B","v":"电力数据可以直接替代 GDP 核算"},{"k":"C","v":"电价变动决定经济增长速度"},{"k":"D","v":"用电量越大的地区一定越发达"}],"answer":"A","ref":"","exp":"电力数据是经济运行的“温度计”，但需与产业结构、价格因素、气温等变量联合建模，且只能作为辅助研判而非替代统计核算。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDGGS05","bank":"legacy","no":5,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"电力气象服务的基础数据通常包括（　）。","options":[{"k":"A","v":"数值天气预报产品与电网设备参数、运行数据、地理信息"},{"k":"B","v":"电网财务报表与人力数据"},{"k":"C","v":"电力市场交易价格与合同"},{"k":"D","v":"用户投诉工单与满意度"}],"answer":"A","ref":"","exp":"电力气象的本质是“气象要素 × 电力设施 × 运行决策”的耦合分析，需要将格点气象数据与杆塔坐标、线路走向、设备型号等空间信息对齐。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDGGS06","bank":"legacy","no":6,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"输电线路覆冰监测与预警主要防范的风险是（　）。","options":[{"k":"A","v":"倒塔、断线、绝缘子冰闪与导线舞动造成的电网事故"},{"k":"B","v":"变压器油温过高"},{"k":"C","v":"电缆隧道积水"},{"k":"D","v":"配电变压器过载"}],"answer":"A","ref":"","exp":"覆冰会显著增加导线与杆塔荷载，诱发舞动与冰闪，严重时导致倒塔断线；需结合微气象、拉力、倾角、图像等多源监测手段预警并触发融冰。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDGGS07","bank":"legacy","no":7,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"需求响应中的“可中断负荷”是指（　）。","options":[{"k":"A","v":"用户与电网签订协议，承诺在电网需要时按指令削减或中断部分负荷，并获得相应补偿"},{"k":"B","v":"电网可以随时无补偿拉闸限电"},{"k":"C","v":"用户自愿长期停产"},{"k":"D","v":"负荷永久退出电网"}],"answer":"A","ref":"","exp":"可中断负荷是需求侧资源参与电力平衡的重要形式，需明确中断容量、响应时间、持续时间、补偿标准与违约条款，属于市场化激励机制。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDGGS08","bank":"legacy","no":8,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"数据中心、5G 基站等新型负荷快速增长的突出特点是（　）。","options":[{"k":"A","v":"单体容量大、增长快、对供电可靠性和电能质量要求高，且负荷曲线相对平稳"},{"k":"B","v":"负荷极小可忽略"},{"k":"C","v":"完全依靠自备电厂供电"},{"k":"D","v":"不需要配套电网增容"}],"answer":"A","ref":"","exp":"算力负荷具有“高密度、高可靠、连续运行”特征，对配电网规划、容量预留与供电保障提出新要求，同时也具备通过算力调度参与需求响应的潜力。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDGGS09","bank":"legacy","no":9,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"分布式光伏大规模接入配电网后，最典型的技术挑战是（　）。","options":[{"k":"A","v":"反向重过载、电压越限与孤岛运行风险，以及保护整定配合困难"},{"k":"B","v":"系统频率必然升高"},{"k":"C","v":"线路阻抗自动降低"},{"k":"D","v":"变压器容量自动增大"}],"answer":"A","ref":"","exp":"高渗透分布式光伏在午间大发时造成功率反送，引发台区变压器反向重载与末端电压越上限；同时并网逆变器需具备防孤岛保护，配网保护需重新整定。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDGGS10","bank":"legacy","no":10,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"企业碳排放核算中，“范围二”排放指的是（　）。","options":[{"k":"A","v":"外购电力、热力、蒸汽等能源所产生的间接排放"},{"k":"B","v":"企业自有锅炉燃烧产生的直接排放"},{"k":"C","v":"供应链上下游产生的其他间接排放"},{"k":"D","v":"员工通勤产生的排放"}],"answer":"A","ref":"","exp":"范围一为直接排放（自有燃烧、工艺过程、逸散），范围二为外购能源的间接排放，范围三为价值链其他间接排放；电力数据是校核范围二排放的关键依据。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDGGS11","bank":"legacy","no":11,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"关于绿电交易与绿证的关系，理解正确的是（　）。","options":[{"k":"A","v":"绿电交易在电量交易的同时一并完成绿证划转，绿证也可脱离电量单独交易"},{"k":"B","v":"绿证可以凭空发行，与电量无关"},{"k":"C","v":"绿电交易不需要核发绿证"},{"k":"D","v":"两者完全独立、互不影响"}],"answer":"A","ref":"","exp":"绿电交易实现“电证合一”，用户既获得电量也获得环境属性；绿证交易则单独买卖环境属性，需防止同一度电的环境权益被重复计算（双重计算）。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDGGS12","bank":"legacy","no":12,"type":"single","topic":"数据安全与合规","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"电力数据服务普惠金融，必须坚持的合规前提是（　）。","options":[{"k":"A","v":"取得企业明确授权、遵循最小必要、限定使用用途并全程可审计"},{"k":"B","v":"只要银行提出需求即可提供"},{"k":"C","v":"数据可以自由共享给任何金融机构"},{"k":"D","v":"无需告知企业即可使用"}],"answer":"A","ref":"","exp":"电力数据涉及企业经营信息，对外提供须有明确授权基础与合同约束，通过隐私计算等技术实现“可用不可见”，并防范数据被转售或超范围使用。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDGGS13","bank":"legacy","no":13,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"在“数据要素×”气象服务领域，最具代表性的融合应用是（　）。","options":[{"k":"A","v":"新能源功率预测、灾害性天气预警与电力设施气象风险评估"},{"k":"B","v":"气象主播的智能播报"},{"k":"C","v":"天气预报短信推送"},{"k":"D","v":"气象观测设备销售"}],"answer":"A","ref":"","exp":"气象与能源、交通、农业等行业的融合是“数据要素×”的重点方向，电力侧典型场景包括功率预测、覆冰/舞动/山火预警、负荷气象敏感性分析。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDGGS14","bank":"legacy","no":14,"type":"single","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"产业链用电数据用于研判产业运行状况，其突出价值在于（　）。","options":[{"k":"A","v":"可高频、细颗粒度反映企业开工率与产能利用情况，弥补传统统计的时滞"},{"k":"B","v":"能够精确计算企业利润"},{"k":"C","v":"可替代工商登记信息"},{"k":"D","v":"可直接用于税收征管"}],"answer":"A","ref":"","exp":"用电数据具有“周度甚至日度、到户级”的颗粒度优势，可构建产业链景气指数、开工率指数，为政府产业政策与金融机构风控提供参考。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDGGS15","bank":"legacy","no":15,"type":"single","topic":"可信数据空间与隐私计算","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"一、单选题","q":"多主体协同场景中，数据“可用不可见”通常依靠（　）实现。","options":[{"k":"A","v":"隐私计算技术（安全多方计算、联邦学习、可信执行环境等）"},{"k":"B","v":"把所有数据复制到中心数据库"},{"k":"C","v":"关闭数据网络访问"},{"k":"D","v":"签署保密协议即可"}],"answer":"A","ref":"","exp":"“可用不可见”需要技术手段保障：各方数据不出本地，通过加密计算、模型参数交换或可信硬件环境完成联合分析，法律协议是必要但不充分的保障。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDGGM01","bank":"legacy","no":1,"type":"multi","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"“六网协同”可落地的典型场景包括（　）。","options":[{"k":"A","v":"电力与交通协同：充电设施布局、车网互动、港口岸电"},{"k":"B","v":"电力与通信协同：基站备电共享、通信杆塔与电力杆塔资源共享"},{"k":"C","v":"电力与水务协同：泵站用电优化、防汛与排涝联动"},{"k":"D","v":"电力与燃气热力协同：多能互补、热电联供与综合能源服务"}],"answer":"ABCD","ref":"","exp":"协同的落脚点在于“规划一张图、运行一盘棋、数据一个源”，通过共享通道资源、负荷特性与运行状态，提升城市基础设施整体效率与韧性。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LDGGM02","bank":"legacy","no":2,"type":"multi","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"交能融合的主要推进方向包括（　）。","options":[{"k":"A","v":"科学布局充换电基础设施，实现“车—桩—网”协同规划"},{"k":"B","v":"推广车网互动（V2G），发挥电动汽车储能价值"},{"k":"C","v":"推进港口岸电、机场与轨道交通的用能电气化与节能改造"},{"k":"D","v":"建设交通与能源一体化监测平台，实现数据共享"}],"answer":"ABCD","ref":"","exp":"交能融合既是能源替代（油改电），也是资源互济（车作为储能），更是数据融合（交通流与电力流耦合分析）。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LDGGM03","bank":"legacy","no":3,"type":"multi","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"电力气象融合的典型应用场景包括（　）。","options":[{"k":"A","v":"新能源功率预测与消纳能力评估"},{"k":"B","v":"输电线路覆冰、舞动、山火、雷电等灾害预警"},{"k":"C","v":"气象敏感的负荷预测与短期用电需求研判"},{"k":"D","v":"电网建设施工与抢修作业的气象保障"}],"answer":"ABCD","ref":"","exp":"气象要素贯穿“发—输—配—用—修”全链条，是电力系统运行决策中不确定性最主要的来源之一。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LDGGM04","bank":"legacy","no":4,"type":"multi","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"在普惠金融服务中，电力数据可以发挥的作用包括（　）。","options":[{"k":"A","v":"辅助核验企业经营真实性（是否真实生产、是否持续经营）"},{"k":"B","v":"作为信用评价的补充维度，缓解小微企业缺抵押、缺报表问题"},{"k":"C","v":"贷后风险预警（用电骤降可能预示经营异常）"},{"k":"D","v":"直接决定授信额度与利率，替代银行风控决策"}],"answer":"ABC","ref":"","exp":"D 项错误。电力数据只能作为辅助参考，授信决策须由金融机构依据完整风控体系作出，避免单一数据源导致误判与歧视性定价。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LDGGM05","bank":"legacy","no":5,"type":"multi","topic":"可信数据空间与隐私计算","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"构建跨主体数据产品生态，必须具备的机制包括（　）。","options":[{"k":"A","v":"统一的数据标准与接口规范"},{"k":"B","v":"清晰的权责划分与收益分配机制"},{"k":"C","v":"可信流通技术基础设施与审计存证"},{"k":"D","v":"各方各自封闭、仅做一次性数据买卖"}],"answer":"ABC","ref":"","exp":"D 项与生态理念相悖。生态的特征是“持续协作、价值共创”，一次性买卖难以形成稳定生态。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LDGGM06","bank":"legacy","no":6,"type":"multi","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"虚拟电厂可聚合的资源类型包括（　）。","options":[{"k":"A","v":"可调节的工业与商业负荷"},{"k":"B","v":"用户侧分布式光伏等分布式电源"},{"k":"C","v":"用户侧与独立共享储能"},{"k":"D","v":"具备双向充放电能力的电动汽车"}],"answer":"ABCD","ref":"","exp":"虚拟电厂的聚合对象覆盖“荷、源、储、车”，通过统一接入、可观可测可调可控，形成对外呈现为单一电厂的调节能力。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LDGGM07","bank":"legacy","no":7,"type":"multi","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"支撑“双碳”监测的数据来源包括（　）。","options":[{"k":"A","v":"分行业分区域用电量与用电结构数据"},{"k":"B","v":"能源统计数据（煤、油、气消费量）"},{"k":"C","v":"权威排放因子库与碳核算方法学"},{"k":"D","v":"绿电交易、绿证核销与碳市场数据"}],"answer":"ABCD","ref":"","exp":"碳排放核算是多源数据交叉校核的过程，电力数据在“范围二”核算与实时监测方面具有独特优势。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LDGGM08","bank":"legacy","no":8,"type":"multi","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"二、多选题","q":"一个数据应用场景要真正落地并可持续，通常需要具备（　）。","options":[{"k":"A","v":"真实且足够痛的业务需求，用户有改变现状的意愿"},{"k":"B","v":"可得、可用、可合规使用的数据基础"},{"k":"C","v":"清晰的价值闭环：有人付费或有明确的效益产出"},{"k":"D","v":"可复制的标准化能力，避免每个项目都从零定制"}],"answer":"ABCD","ref":"","exp":"场景落地的四个必要条件缺一不可：痛点真、数据通、价值实、可复制。很多项目失败在于“演示很漂亮，但没人愿意为它买单”。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LDGGJ01","bank":"legacy","no":1,"type":"judge","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"“六网协同”只是技术层面的系统对接，不涉及体制机制与利益分配的调整。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。跨行业协同的最大障碍往往不是技术，而是数据权责、建设投资分摊、运行调度权限与考核机制，必须配套制度设计。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LDGGJ02","bank":"legacy","no":2,"type":"judge","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"交能融合就是建设充电桩，与电网规划、车网互动没有关系。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。充电桩只是交能融合的一部分，完整内涵还包括配电网承载力协同、V2G 互动、交通用能电气化与数据融合。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LDGGJ03","bank":"legacy","no":3,"type":"judge","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"V2G 的规模化推广目前仍受电池循环寿命、充放电成本与用户参与意愿的约束。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。频繁充放电会加速电池衰减，需要合理的补偿机制与电池健康管理策略，商业模式仍在探索中。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LDGGJ04","bank":"legacy","no":4,"type":"judge","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"电力数据可以直接替代统计数据用于 GDP 核算。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。电力数据是重要辅助指标，但 GDP 核算有严格的统计方法与口径，二者不能互相替代，只能相互印证。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LDGGJ05","bank":"legacy","no":5,"type":"judge","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"极端天气是新能源功率预测误差的主要来源之一。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。云量突变、阵风、沙尘、寒潮等都会显著改变出力，提升预测精度高度依赖高时空分辨率气象数据与 AI 订正技术。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LDGGJ06","bank":"legacy","no":6,"type":"judge","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"在普惠金融场景中，电力数据可以直接作为银行授信决策的唯一依据。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。单一数据源存在偏差与误判风险，电力数据应作为辅助维度纳入综合风控模型，且须防范对特定群体的歧视性影响。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LDGGJ07","bank":"legacy","no":7,"type":"judge","topic":"数据安全与合规","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"同一数据产品复用到新的行业场景时，需要重新评估合规边界与授权范围。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。原授权往往限定了用途、对象与期限，跨场景复用可能超出授权范围，必须重新评估并取得相应授权。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LDGGJ08","bank":"legacy","no":8,"type":"judge","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"产业链用电数据可以辅助判断区域产业景气度与产能利用水平。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。通过分行业用电量增速、开工率、负荷曲线形态等特征，可构建产业景气指数，为政策制定与金融风控提供参考。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LDGGJ09","bank":"legacy","no":9,"type":"judge","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据应用场景只要能在汇报中演示成功，就算落地完成。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。演示成功不等于业务采纳，真正的落地标准是“进入业务流程、形成稳定使用、产生可量化价值”。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LDGGE01","bank":"legacy","no":1,"type":"short","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·通用","paper":"卷四（场景生态卷）","module":"通用模块","modTitle":"通用模块（50 分）","groupName":"四、简答题","q":"结合“六网协同”与“交能融合”，论述电力数据在推动城市基础设施协同运行中的作用，并说明落地过程中需要破解的难点。（10 分）","options":[],"answer":"","ref":"① 作用一：规划协同。以电力负荷与电网承载力数据为基础，叠加交通流量、充电需求、通信基站布局、水务泵站与燃气热力负荷，支撑“一张图”规划，避免道路反复开挖、通道资源浪费与配套滞后。\n② 作用二：运行协同。在迎峰度夏、极端天气、重大活动保障等场景，通过多网运行状态联合监测，实现负荷互济（如数据中心、充电桩参与需求响应）、应急联动（停电影响交通信号与通信基站时的快速处置）。\n③ 作用三：服务协同。面向用户提供一体化服务，如“充电+停车+用能”组合服务、园区综合能源服务、基于用电与出行数据的便民服务。\n④ 作用四：价值共创。以数据为纽带催生新业态，如车网互动聚合运营、港口岸电与绿电交易、城市级碳监测与绿色出行积分。\n⑤ 落地难点：一是数据壁垒——各行业数据标准、接口、更新频率不一，缺乏统一目录与共享规则；二是权责不清——数据共享后的安全责任、事故责任难以界定；三是机制缺失——建设投资与收益分配缺乏跨部门结算机制，考核体系各自为政；四是安全约束——电力监控系统安全分区限制数据外送，需通过脱敏、汇聚、隐私计算等方式合规输出；五是能力短板——缺乏既懂电力又懂交通/城建的复合型人才。\n⑥ 破解路径：由政府牵头建立跨部门协同机制与数据共享责任清单；先试点后推广，选择“小切口、高价值”场景（如充电设施选址）；建设城市级可信数据空间，实现“数据不出域、结果可共享”；同步建立标准规范、安全评估与收益分配规则。\n加分点：指出“协同不是把数据都交出去”，而是建立规则下的有限共享；强调试点评估与复制推广的方法论。","exp":"评分要点：① 作用一：规划协同。；② 作用二：运行协同。；③ 作用三：服务协同。；④ 作用四：价值共创。；⑤ 落地难点：；⑥ 破解路径：；加分点：。按要点分层作答，结合电力业务场景举例可加分。","source":"","tip":"","dup":"","typeName":"简答题"},{"id":"LDSSS01","bank":"legacy","no":1,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"数据应用场景设计的正确起点是（　）。","options":[{"k":"A","v":"识别业务痛点与决策链条，明确“谁在什么环节需要什么信息做判断”"},{"k":"B","v":"先梳理企业有哪些数据"},{"k":"C","v":"先确定使用哪种算法模型"},{"k":"D","v":"先搭建技术平台"}],"answer":"A","ref":"","exp":"场景设计遵循“痛点—决策—信息—数据”的倒推逻辑：先找到需要改进的决策点，再确定所需信息，最后反推数据与算法需求。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDSSS02","bank":"legacy","no":2,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"商业模式画布中的“价值主张”在数据产品中回答的核心问题是（　）。","options":[{"k":"A","v":"我们为客户解决了什么问题、创造了什么独特价值"},{"k":"B","v":"我们的技术架构如何设计"},{"k":"C","v":"我们的团队有多少人"},{"k":"D","v":"我们的服务器放在哪里"}],"answer":"A","ref":"","exp":"价值主张是商业模式的起点，须清晰到“客户愿意为此付费或改变行为”的程度，而非笼统的“提升效率、赋能管理”。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDSSS03","bank":"legacy","no":3,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"数据产品企业在生态中构建竞争壁垒，最有效的“卡位”方式是（　）。","options":[{"k":"A","v":"占据不可替代的数据源或深度场景 know-how，并持续迭代形成迁移成本"},{"k":"B","v":"单纯依靠低价竞争"},{"k":"C","v":"频繁更换技术栈"},{"k":"D","v":"尽量少与伙伴合作"}],"answer":"A","ref":"","exp":"数据产品的护城河来自“独占数据 + 场景理解 + 网络效应 + 切换成本”，单纯的技术或价格都难以形成长期壁垒。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDSSS04","bank":"legacy","no":4,"type":"single","topic":"可信数据空间与隐私计算","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"跨主体数据合作中坚持“最小必要”原则，具体是指（　）。","options":[{"k":"A","v":"仅采集和使用实现特定目的所必需的最少数据项与最短保存期限"},{"k":"B","v":"数据量越小越好，不必考虑效果"},{"k":"C","v":"只使用结构化数据"},{"k":"D","v":"只与一家伙伴合作"}],"answer":"A","ref":"","exp":"最小必要包含“字段最小、范围最小、频次最小、期限最短”四层含义，是个人信息保护与数据安全合规的核心原则之一。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDSSS05","bank":"legacy","no":5,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"一个数据应用场景从一个行业复制到另一个行业，成功的关键是（　）。","options":[{"k":"A","v":"沉淀标准化的产品内核，同时针对本地数据条件与业务规则做适配"},{"k":"B","v":"完全照搬不做任何调整"},{"k":"C","v":"每次全部重新开发"},{"k":"D","v":"只复制界面不复制逻辑"}],"answer":"A","ref":"","exp":"“标准化内核 + 本地化适配”是规模化的通用范式；忽视本地差异会导致“水土不服”，完全定制又无法形成规模效益。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDSSS06","bank":"legacy","no":6,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"选择生态合作伙伴时，首要考虑的因素应当是（　）。","options":[{"k":"A","v":"能力互补性与合规可控性（数据来源合法、安全能力达标）"},{"k":"B","v":"对方规模越大越好"},{"k":"C","v":"合作费用越低越好"},{"k":"D","v":"对方承诺的收益越高越好"}],"answer":"A","ref":"","exp":"生态合作的本质是能力互补，但前提是合规可控；与数据来源不清或安全能力不足的伙伴合作，可能带来连带合规风险。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDSSS07","bank":"legacy","no":7,"type":"single","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"数据产品在生态中形成“网络效应”的典型表现是（　）。","options":[{"k":"A","v":"参与的主体与数据越多，产品对每个用户的价值越大"},{"k":"B","v":"用户越多，服务器成本越低"},{"k":"C","v":"功能越多，价格越高"},{"k":"D","v":"合作伙伴越少，议价能力越强"}],"answer":"A","ref":"","exp":"网络效应是数据产品规模化的重要杠杆，如用电企业信用标签覆盖越广，金融机构风控越准，进而吸引更多机构接入。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDSSS08","bank":"legacy","no":8,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"评估一个数据应用场景优先级时，常用的“价值—可行性”矩阵中，“可行性”主要考察（　）。","options":[{"k":"A","v":"数据可得性、技术成熟度、合规约束与实施成本"},{"k":"B","v":"市场规模与收入潜力"},{"k":"C","v":"领导重视程度"},{"k":"D","v":"竞争对手的数量"}],"answer":"A","ref":"","exp":"价值维度看“能带来多少收益”，可行性维度看“能不能做成、合不合规、要花多少”，优先做“高价值、高可行”的场景。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDSSS09","bank":"legacy","no":9,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"跨行业数据融合面临的最深层障碍通常是（　）。","options":[{"k":"A","v":"数据标准不统一、权责边界不清与激励不足，导致“不愿共、不敢共、不会共”"},{"k":"B","v":"服务器算力不足"},{"k":"C","v":"缺少编程人员"},{"k":"D","v":"没有合适的数据库产品"}],"answer":"A","ref":"","exp":"技术可以采购，机制难以速成。跨行业融合的关键是建立标准、明确权责、设计激励，技术只是实现手段。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDSSS10","bank":"legacy","no":10,"type":"single","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"一、单选题","q":"评价一个数据应用场景是否真正落地，最可靠的依据是（　）。","options":[{"k":"A","v":"业务指标是否改善、是否形成稳定使用与可量化价值"},{"k":"B","v":"系统是否成功上线"},{"k":"C","v":"汇报演示是否顺利"},{"k":"D","v":"代码行数与功能数量"}],"answer":"A","ref":"","exp":"“上线”只是技术事件，“落地”是业务事件。判断标准应是使用率、流程嵌入度与效益产出，而非系统是否建成。","source":"","tip":"","dup":"","typeName":"单选题"},{"id":"LDSSM01","bank":"legacy","no":1,"type":"multi","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"系统挖掘数据应用场景的常用方法包括（　）。","options":[{"k":"A","v":"沿着业务价值链逐环节梳理痛点与决策点"},{"k":"B","v":"分析现有数据与业务的“错配点”，寻找未被满足的信息需求"},{"k":"C","v":"对标国内外标杆案例，做本地化改造"},{"k":"D","v":"组织业务、数据、技术多方参与的场景工作坊"}],"answer":"ABCD","ref":"","exp":"场景挖掘既要“向内看流程”，也要“向外看标杆”，更要“多方共创”，单一视角容易遗漏高价值机会。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LDSSM02","bank":"legacy","no":2,"type":"multi","topic":"可信数据空间与隐私计算","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"跨主体数据生态协同需要建立的机制包括（　）。","options":[{"k":"A","v":"统一的数据标准、接口规范与质量要求"},{"k":"B","v":"清晰的权责约定与安全责任划分"},{"k":"C","v":"合理的收益分配与成本分摊机制"},{"k":"D","v":"争议解决、审计与退出机制"}],"answer":"ABCD","ref":"","exp":"生态的可持续性取决于“规则是否公平、责任是否清晰、收益是否合理”，技术平台只是承载规则的工具。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LDSSM03","bank":"legacy","no":3,"type":"multi","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"交能融合场景下，电力数据可以支撑的具体应用包括（　）。","options":[{"k":"A","v":"充电设施选址与容量配置，匹配配电网承载力"},{"k":"B","v":"台区负荷预测与充电高峰错峰引导"},{"k":"C","v":"V2G 资源聚合参与电网调节"},{"k":"D","v":"交通枢纽、港口、机场的综合能源优化"}],"answer":"ABCD","ref":"","exp":"电力数据在交能融合中既服务于“规划”（选址定容），也服务于“运行”（错峰、互动），还服务于“交易”（绿电与辅助服务）。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LDSSM04","bank":"legacy","no":4,"type":"multi","topic":"新型电力系统与生产运行","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"面向新能源场站的电力气象增值服务可以包括（　）。","options":[{"k":"A","v":"高精度功率预测与预测误差订正服务"},{"k":"B","v":"极端天气（大风、覆冰、沙尘、雷暴）预警与停机保护建议"},{"k":"C","v":"设备气象风险画像与运维窗口期推荐"},{"k":"D","v":"发电量与收益的气象敏感性分析"}],"answer":"ABCD","ref":"","exp":"气象服务正从“提供预报”转向“提供决策建议”，按效果付费（如按预测精度提升幅度分成）是常见的商业模式。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LDSSM05","bank":"legacy","no":5,"type":"multi","topic":"数据安全与合规","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"电力数据服务普惠金融时，必须落实的合规要求包括（　）。","options":[{"k":"A","v":"取得企业（用户）明确授权，明确用途、范围与期限"},{"k":"B","v":"遵循最小必要，仅提供与风控直接相关的数据或衍生结果"},{"k":"C","v":"通过隐私计算等技术实现“可用不可见”，防止原始数据外流"},{"k":"D","v":"建立数据使用审计与退出销毁机制"}],"answer":"ABCD","ref":"","exp":"此外还需关注《征信业管理条例》对信用信息服务资质的要求，避免未经许可从事个人征信业务。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LDSSM06","bank":"legacy","no":6,"type":"multi","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"设计数据产品商业模式时，需要明确的关键要素包括（　）。","options":[{"k":"A","v":"目标客户与付费方（谁受益、谁买单）"},{"k":"B","v":"收费方式与定价依据（订阅、按量、分成）"},{"k":"C","v":"成本结构与盈亏平衡点"},{"k":"D","v":"渠道与交付方式（直销、代理、平台化）"}],"answer":"ABCD","ref":"","exp":"特别要识别“使用者”与“付费者”不一致的情况（如政府购买服务、企业使用），这直接决定产品形态与销售策略。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LDSSM07","bank":"legacy","no":7,"type":"multi","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"二、多选题","q":"推动数据应用场景规模化复制时，应重点做好（　）。","options":[{"k":"A","v":"沉淀标准化组件与可配置能力，降低单点实施成本"},{"k":"B","v":"建立实施方法论与交付模板（含合规检查清单）"},{"k":"C","v":"培养本地化实施与运营团队"},{"k":"D","v":"要求每个项目完全定制以满足个性需求"}],"answer":"ABC","ref":"","exp":"D 项错误。完全定制会摧毁规模经济，正确的做法是“内核标准、参数可配、场景适配”。","source":"","tip":"","dup":"","typeName":"不定项选择题"},{"id":"LDSSJ01","bank":"legacy","no":1,"type":"judge","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据应用场景的价值大小，主要取决于所用技术的先进性。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。技术只是实现手段，场景价值取决于痛点强度、覆盖规模与可量化收益；过度追求先进技术往往是“技术自嗨”。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LDSSJ02","bank":"legacy","no":2,"type":"judge","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"在跨行业场景中，“使用者”与“付费者”不一定是同一主体，商业模式设计需分别考虑。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。例如政府购买数据服务供中小企业使用，付费方是政府、使用方是企业，产品形态与推广方式需据此调整。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LDSSJ03","bank":"legacy","no":3,"type":"judge","topic":"数据安全与合规","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"生态合作中，只要签订了数据保密协议，就可以不再做技术层面的安全防护。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。协议是必要不充分条件，须配合访问控制、加密、脱敏、审计与存证等技术手段，形成“制度+技术”双重保障。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LDSSJ04","bank":"legacy","no":4,"type":"judge","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"场景复制时应保持核心逻辑一致，但需针对本地数据条件与制度环境做适配。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。“标准内核 + 本地适配”是跨区域、跨行业复制的通行做法。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LDSSJ05","bank":"legacy","no":5,"type":"judge","topic":"数字化综合","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"一个场景如果无法量化价值，通常也难以获得持续的资源和预算支持。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"A","ref":"","exp":"正确。价值量化是争取投入与证明成效的基础，无法量化的场景容易被当作“锦上添花”而优先削减。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LDSSJ06","bank":"legacy","no":6,"type":"judge","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"三、判断题（正确选 A，错误选 B）","q":"数据产品在生态中应尽量独占全部环节，不与伙伴分工合作。","options":[{"k":"A","v":"正确（√）"},{"k":"B","v":"错误（×）"}],"answer":"B","ref":"","exp":"错误。数据产品链条长，独占全部环节既不经济也不现实；应聚焦自身最具优势的环节（数据或场景理解），通过分工放大整体价值。","source":"","tip":"","dup":"","typeName":"判断题"},{"id":"LDSSE01","bank":"legacy","no":1,"type":"short","topic":"可信数据空间与隐私计算","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"四、简答题","q":"【按方向选做 1 题，10 分】\u003cbr\u003eA（数据智能治理）：说明在跨主体数据协同场景中，如何通过治理手段保障数据“可信、可控、可追溯”。\u003cbr\u003eB（高质量数据集）：面向“电力+气象”融合应用，说明所需数据集构成与融合治理方法。\u003cbr\u003eC（数据产品设计）：说明如何为“园区综合能源服务”设计数据产品体系与实施路径。\u003cbr\u003eD（场景与生态）：选择一个你最熟悉的电力数据应用场景，完整说明“痛点—数据—产品—模式—生态”的设计逻辑。","options":[],"answer":"","ref":"A 方向：可信——建立数据质量规则与准入校验，出具数据质量报告与数据卡片，让使用方“知其来源、知其精度”；可控——基于分类分级实施差异化授权，采用隐私计算/可信数据空间实现“可用不可见、可控可计量”，设置用途、期限、次数的硬约束；可追溯——全链路血缘记录数据来源与加工过程，操作日志与区块链存证确保不可篡改，支持事后审计与责任追溯；配套多方协议明确权责与违约条款，并建立定期审计与退出销毁机制。\n\nB 方向：数据集构成：①气象侧——格点数值预报（风速、辐照、温度、湿度、降水）、实况观测（气象站、测风塔、卫星云图、雷达）、灾害预警信息；②电力侧——场站装机与设备参数、历史出力与限电记录、机组状态与检修计划、输电通道地理信息；③融合标签——覆冰/舞动/山火等历史事件标注、异常天气下的故障记录。\n融合治理：时空对齐（统一坐标系、时区与时间分辨率，格点插值到杆塔/场站）；质量控制（气象数据缺测插补、异常值剔除，电力数据清洗与标幺化）；特征工程（构建微地形、迎风坡、通道走廊等衍生特征）；标注规范（事件定义、影响范围、时间窗）；版本管理与血缘追溯；按时间切分训练/测试集防止泄漏；建立精度评测基准（功率预测误差、预警命中率与虚警率）。\n\nC 方向：产品体系分三层：①数据底座层——园区用能数据汇聚（电、水、气、热）、设备台账、气象数据，形成统一数据模型；②分析服务层——能效诊断（单位产值能耗、设备能效比）、负荷预测、光伏出力预测、需量预警、碳排核算；③应用层——园区能效看板、节能改造建议与投资收益测算、绿电交易与碳资产管理、需求响应代理。\n实施路径：试点选取 1—2 个园区 → 完成数据接入与模型验证 → 输出诊断报告验证价值 → 打磨标准化产品 → 向同类园区复制（标准内核+本地适配）→ 建立运营团队与收费模式（SaaS 订阅/节能分成）。关键交付物：数据接入规范、指标体系、算法模型与验证报告、产品原型、实施方法论、运营指标看板。\n\nD 方向（以电力数据服务普惠金融为例）：痛点——小微企业缺抵押、缺规范报表，银行尽调成本高、风险难判；数据——企业用电量、用电趋势、缴费记录、负荷特征、行业对标；产品——企业经营活力指数、用电信用标签、贷前核验 API、贷后预警服务；模式——按查询次数收费或按促成贷款规模分成，与银行、征信机构、担保机构分工；生态——电网企业供数（不出域）、科技公司做加工与建模、金融机构做应用、监管部门做监督，通过可信数据空间实现多方协作；保障——企业授权、最小必要、用途限定、审计存证、退出销毁，并防范歧视性定价与过度授信。","exp":"评分要点：A 方向：；B 方向：；C 方向：；D 方向（以电力数据服务普惠金融为例）：。按要点分层作答，结合电力业务场景举例可加分。","source":"","tip":"","dup":"","typeName":"简答题"},{"id":"LDSSE02","bank":"legacy","no":2,"type":"short","topic":"数据资产与数据要素","scope":"四套模拟卷 · 卷四（场景生态卷）","label":"D卷·专项","paper":"卷四（场景生态卷）","module":"专项模块","modTitle":"专项模块（50 分）","groupName":"四、简答题","q":"【必答，10 分】数据产品从“内部可用”走向“对外赋能”时，价值实现方式与风险结构都会发生变化。请论述这一转变过程中的关键问题与应对策略。","options":[],"answer":"","ref":"① 价值实现方式的变化：内部以“降本提效”为主，价值通过工时节省、决策提速间接体现；对外则以“创收、分成、订阅”为主，需明确付费方、定价依据与交付标准，价值必须可被客户感知与验证。\n② 关键问题一：合规边界扩大。内部使用受企业制度约束，对外则涉及数据出境、个人信息、商业秘密、行业监管等多重约束。应对：建立对外提供的前置合规审查清单，明确授权链条、脱敏要求、用途限定与合同条款，必要时通过可信数据空间交付。\n③ 关键问题二：质量与责任加重。对外产品的数据错误可能引发客户损失与法律责任。应对：建立数据质量 SLA、结果置信度提示与免责条款，完善错误反馈与快速修正机制。\n④ 关键问题三：产品形态需重构。内部工具往往依赖“懂业务的人”使用，对外必须做到“开箱即用”。应对：抽象为标准 API/报告/指数，配套文档、培训与技术支持，降低使用门槛。\n⑤ 关键问题四：商业模式与组织能力不足。应对：明确收费模式（订阅、按量、分成），建立定价与结算体系；组建产品运营与销售团队，或以生态伙伴渠道分销。\n⑥ 关键问题五：生态协同与利益分配。对外赋能往往需要多方参与。应对：以协议明确数据提供方、加工方、渠道方的权责与分配比例，建立计量、结算与审计机制。\n⑦ 保障：设置试点先行、灰度放量、效果评估与退出机制，形成“试点—验证—复制—优化”的闭环。\n加分点：强调“对外不是把内部报表开放出去”，而是重新定义产品；提醒防止数据转售与二次扩散。","exp":"评分要点：① 价值实现方式的变化：；② 关键问题一：合规边界扩大。；③ 关键问题二：质量与责任加重。；④ 关键问题三：产品形态需重构。；⑤ 关键问题四：商业模式与组织能力不足。；⑥ 关键问题五：生态协同与利益分配。；⑦ 保障：；加分点：。按要点分层作答，结合电力业务场景举例可加分。","source":"","tip":"","dup":"","typeName":"简答题"}]}</script>
<script>
(function(){
"use strict";
const BANK = JSON.parse(document.getElementById('bank-data').textContent);
const QS = BANK.questions;
const MAP = {}; QS.forEach(q=>MAP[q.id]=q);
const META = BANK.meta, EXAM = META.exam;
const KEY = 'dl_theory_2026_v1';
const TYPES = ['single','multi','judge','short'];
const TN = {single:'单选题',multi:'不定项选择题',judge:'判断题',short:'简答题'};
const $ = s=>document.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!==undefined)n.innerHTML=h;return n;};
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

let S = {
  mode:'official', answers:{}, judged:{}, wrong:{}, fav:{}, self:{},
  showAll:false, hideDup:true, filter:{type:'all',topic:'all',vol:'all',kw:''},
  exam:null, mix:'balanced', minutes:90, useLegacy:false
};
try{const raw=localStorage.getItem(KEY); if(raw){const o=JSON.parse(raw); S=Object.assign(S,o);
  S.filter=Object.assign({type:'all',topic:'all',vol:'all',kw:''},o.filter||{});}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
/* 考试模式答案与练习模式隔离，避免练习时做过的题在卷面上被预填 */
function getAns(id){return S.mode==='exam'&&S.exam?((S.exam.answers||{})[id]||''):(S.answers[id]||'')}
function setAns(id,v){
  if(S.mode==='exam'&&S.exam){S.exam.answers=S.exam.answers||{};if(v)S.exam.answers[id]=v;else delete S.exam.answers[id]}
  else{if(v)S.answers[id]=v;else delete S.answers[id]}
}

const MODES = [
  {k:'official',n:'官方样例题库',d:META.officialCount+' 题 · 逐题精练'},
  {k:'mock',n:'新编模拟题',d:META.mockCount+' 题 · 按征集说明补范围'},
  {k:'legacy',n:'四套模拟卷',d:META.legacyCount+' 题 · 旧版题库并入'},
  {k:'exam',n:'模拟考试',d:'40/20/10/2 · 100 分'},
  {k:'wrong',n:'错题本',d:'自动收集 · 集中攻克'},
  {k:'fav',n:'收藏题',d:'星标题目'},
  {k:'info',n:'考试说明',d:'征集说明与命题依据'},
];

/* ---------------- 工具 ---------------- */
function poolList(){
  let arr;
  if(S.mode==='official') arr=QS.filter(q=>q.bank==='official');
  else if(S.mode==='mock') arr=QS.filter(q=>q.bank==='mock');
  else if(S.mode==='legacy') arr=QS.filter(q=>q.bank==='legacy');
  else if(S.mode==='wrong') arr=Object.keys(S.wrong).map(k=>MAP[k]).filter(Boolean);
  else if(S.mode==='fav') arr=Object.keys(S.fav).map(k=>MAP[k]).filter(Boolean);
  else if(S.mode==='exam') arr=S.exam?S.exam.ids.map(k=>MAP[k]).filter(Boolean):[];
  else arr=QS.slice();
  if(S.mode==='official'||S.mode==='mock'||S.mode==='legacy'||S.mode==='all'){
    if(S.hideDup) arr=arr.filter(q=>!q.dup);
    arr=arr.filter(q=>S.filter.type==='all'||q.type===S.filter.type)
           .filter(q=>S.filter.topic==='all'||q.topic===S.filter.topic);
    if(S.mode==='legacy'&&S.filter.vol!=='all') arr=arr.filter(q=>q.label===S.filter.vol);
    const kw=S.filter.kw.trim();
    if(kw) arr=arr.filter(q=>(q.q+q.exp+q.topic+(q.ref||'')).indexOf(kw)>=0);
  }
  return arr;
}
function sortedAns(s){return String(s||'').split('').sort().join('')}
function isRight(q){
  if(q.type==='short') return false;
  const a=getAns(q.id);
  return !!a && sortedAns(a)===sortedAns(q.answer);
}
function statsOf(list){
  let done=0,right=0;
  list.forEach(q=>{if(S.judged[q.id]){done++;if(S.judged[q.id]==='right')right++}});
  return {done,right,rate:done?Math.round(right/done*100):0,total:list.length};
}
function renderProgress(){
  const list=poolList(), st=statsOf(list);
  $('#prog').style.width = st.total? (st.done/st.total*100).toFixed(1)+'%':'0%';
}
