/* ---------------- 组卷 ---------------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startExam(){
  const ratio={official:.75,balanced:.55,mock:.3}[S.mix]||.55;
  const ids=[];
  TYPES.forEach(t=>{
    const need=EXAM[t];
    const all=QS.filter(q=>q.type===t&&!q.dup&&(S.useLegacy||q.bank!=='legacy'));
    const off=shuffle(all.filter(q=>q.bank==='official').slice());
    const moc=shuffle(all.filter(q=>q.bank==='mock'||(S.useLegacy&&q.bank==='legacy')).slice());
    const takeOff=Math.min(off.length,Math.round(need*ratio));
    const pick=off.slice(0,takeOff).concat(moc.slice(0,need-takeOff));
    if(pick.length<need){
      const rest=shuffle(all.filter(q=>pick.indexOf(q)<0).slice());
      pick.push(...rest.slice(0,need-pick.length));
    }
    ids.push(...pick.slice(0,need).map(q=>q.id));
  });
  S.exam={ids,submitted:false,remain:S.minutes*60,started:Date.now(),self:{},answers:{},running:S.minutes>0,score:null};
  S.mode='exam'; save(); render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function submitExam(){
  if(!S.exam||S.exam.submitted)return;
  if(!confirm('确定交卷？交卷后将显示答案与解析。'))return;
  S.exam.submitted=true;
  const list=S.exam.ids.map(k=>MAP[k]);
  list.forEach(q=>{
    if(q.type==='short')return;
    const ok=isRight(q);
    S.judged[q.id]=ok?'right':'wrong';
    if(ok)delete S.wrong[q.id]; else S.wrong[q.id]=1;
  });
  save();render();window.scrollTo({top:0,behavior:'smooth'});
}
function examScore(){
  const g={single:{n:0,ok:0,score:0},multi:{n:0,ok:0,score:0},judge:{n:0,ok:0,score:0},short:{n:0,ok:0,score:0}};
  (S.exam?S.exam.ids:[]).forEach(id=>{
    const q=MAP[id]; if(!q)return;
    g[q.type].n++;
    if(q.type==='short'){g.short.score+=(Number((S.exam.self||{})[id])||0)}
    else if(isRight(q)){g[q.type].ok++;g[q.type].score+=EXAM.score[q.type]}
  });
  const total=Object.keys(g).reduce((s,k)=>s+g[k].score,0);
  return {g,total};
}
function resultBox(){
  const {g,total}=examScore();
  const box=el('div','result');
  box.appendChild(el('h2','','交卷结果'));
  const h=el('div','','<span class="score">'+total.toFixed(1)+'</span><small> / 100 分</small>');
  box.appendChild(h);
  let rows='<table class="rtable"><tr><th>题型</th><th>题量</th><th>答对 / 自评</th><th>得分</th></tr>';
  TYPES.forEach(t=>{
    const x=g[t];
    rows+='<tr><td>'+TN[t]+'</td><td>'+x.n+'</td><td>'+(t==='short'?('自评 '+x.score+' 分'):(x.ok+' / '+x.n))+'</td><td>'+x.score.toFixed(1)+'</td></tr>';
  });
  rows+='</table>';
  const tbl=el('div','',rows);box.appendChild(tbl);
  const wrongs=(S.exam.ids||[]).filter(id=>S.wrong[id]);
  box.appendChild(el('p','muted','错题 '+wrongs.length+' 道已自动进入错题本；简答题请在题卡内对照参考答案完成自评，总分会实时更新。'));
  return box;
}

/* ---------------- 计时 ---------------- */
let tick=null;
function fmt(s){s=Math.max(0,Math.floor(s));const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function updateTimer(){
  const t=$('#timer'); if(!t)return;
  if(!S.exam){t.textContent='--:--';return}
  t.textContent=fmt(S.exam.remain);
  t.className='timer'+(S.exam.remain<300?' low':'');
  $('#btnTimer').textContent=(S.exam.running?'暂停':'开始')+'计时';
  $('#btnTimer').disabled=!!S.exam.submitted||S.minutes===0;
}
function loop(){
  if(tick)clearInterval(tick); tick=null;
  if(S.mode!=='exam'||!S.exam||S.exam.submitted||!S.exam.running||S.minutes===0)return;
  tick=setInterval(()=>{
    if(!S.exam||S.exam.submitted||!S.exam.running){clearInterval(tick);tick=null;return}
    S.exam.remain=Math.max(0,S.exam.remain-1);updateTimer();
    if(S.exam.remain<=0){clearInterval(tick);tick=null;S.exam.running=false;alert('考试时间到，已自动交卷。');S.exam.submitted=true;save();
      (S.exam.ids||[]).forEach(id=>{const q=MAP[id];if(!q||q.type==='short')return;const ok=isRight(q);S.judged[id]=ok?'right':'wrong';if(ok)delete S.wrong[id];else S.wrong[id]=1});
      save();render()}
  },1000);
}

/* ---------------- 题卡 ---------------- */
function answerText(q){
  if(q.type==='short')return '见参考答案';
  return q.answer.split('').join('、');
}
function buildQ(q,idx){

      const b=el('button',((S.exam.self||{})[q.id]===v?'on':''),label);
      b.onclick=()=>{
        S.exam.self=S.exam.self||{};S.exam.self[q.id]=v;save();

        S.self[q.id]=v;

function choose(q,k){
  if(S.mode==='exam'&&S.exam&&S.exam.submitted)return;
  if(S.judged[q.id]&&S.mode!=='exam')return;
  if(q.type==='multi'){
    const cur=new Set(getAns(q.id).split(''));
    if(cur.has(k))cur.delete(k);else cur.add(k);
    setAns(q.id,Array.from(cur).sort().join(''));
    save();paintQ(q.id);return;
  }
  setAns(q.id,k);save();
  if(S.mode==='exam'){paintQ(q.id);return}
  check(q.id);
}
function check(id){
  const q=MAP[id]; if(!q||q.type==='short')return;
  if(!getAns(id))return;
  const ok=isRight(q);
  S.judged[id]=ok?'right':'wrong';
  if(ok)delete S.wrong[id];else S.wrong[id]=1;
  save();paintQ(id);renderProgress();updateStatsPanel();
}
function review(id){
  const q=MAP[id];if(!q)return;
  S.judged[id]='review';save();paintQ(id);renderProgress();updateStatsPanel();
}
function redo(id){
  setAns(id,'');
  if(S.mode==='exam'){save();paintQ(id);return}
  delete S.judged[id];delete S.wrong[id];delete S.self[id];
  if(S.exam&&S.exam.self)delete S.exam.self[id];
  save();paintQ(id);renderProgress();updateStatsPanel();
}
function updateStatsPanel(){
  const p=$('#topPanel .stat'); if(!p)return;
  const st=statsOf(poolList());
  const vs=p.querySelectorAll('.v'); if(vs.length===4){vs[1].textContent=st.done;vs[2].textContent=st.right;vs[3].textContent=st.done?st.rate+'%':'—'}
}
function paintQ(id){
  const card=document.querySelector('.q[data-id="'+id+'"]'); if(!card)return;
  const q=MAP[id]; if(!q)return;
  const examMode=S.mode==='exam';
  const submitted=examMode&&S.exam&&S.exam.submitted;
  const reveal=examMode?!!submitted:(S.showAll||!!S.judged[id]);
  const chosen=getAns(id).split('');
  card.querySelectorAll('.opt').forEach(op=>{
    const k=op.dataset.k; op.className='opt';
    if(chosen.indexOf(k)>=0)op.classList.add('on');
    if(reveal){
      if(q.answer.indexOf(k)>=0)op.classList.add('right');
      else if(chosen.indexOf(k)>=0)op.classList.add('miss');
    }
  });
  const ta=card.querySelector('textarea'); if(ta)ta.readOnly=!!submitted;
  const fb=card.querySelector('[data-role=fb]'); fb.className='fb';
  if(reveal){
    card.classList.toggle('show',true);
    if(q.type==='short'){
      if(S.judged[id]==='review'){fb.className='fb rev';fb.textContent='已对照参考答案，请自评掌握程度';}
    }else{
      const ok=isRight(q);
      fb.className=ok?'fb ok':'fb no';
      fb.textContent=ok?'✓ 回答正确':'✗ 回答错误 · 正确答案 '+answerText(q)+(chosen.length?'':'（未作答）');
      card.classList.toggle('right',ok);card.classList.toggle('wrong',!ok);
    }
  }else{
    card.classList.remove('show','right','wrong');
    fb.textContent='';
  }
  const confirm=card.querySelector('[data-act=confirm]');
  if(confirm)confirm.style.display=(!examMode&&!S.judged[id])?'inline-block':'none';
  const rev=card.querySelector('[data-act=review]');
  if(rev)rev.style.display=examMode?'none':(S.judged[id]?'none':'inline-block');
  const rd=card.querySelector('[data-act=redo]');
  if(rd)rd.style.display=(examMode&&submitted)?'none':((chosen.length||S.judged[id])?'inline-block':'none');
  const f=card.querySelector('.fav'); if(f){f.className='fav'+(S.fav[id]?' on':'');f.textContent=S.fav[id]?'★':'☆'}
}

/* ---------------- 列表渲染 ---------------- */
function renderList(){
  const box=$('#list'); box.innerHTML='';
  if(S.mode==='info')return;
  if(S.mode==='exam'&&!S.exam){
    box.appendChild(el('div','empty','还没有试卷。点击上方「重新组卷」生成一套 100 分模拟卷。'));
    return;
  }
  const list=poolList();
  if(!list.length){box.appendChild(el('div','empty',S.mode==='wrong'?'错题本还是空的，先去练几题吧。':'没有符合条件的题目，试试调整筛选条件。'));return}
  const groups={}; list.forEach(q=>{(groups[q.type]=groups[q.type]||[]).push(q)});
  let n=0;
  TYPES.forEach(t=>{
    const arr=groups[t]; if(!arr||!arr.length)return;
    const cnt=arr.length;
    const hd=el('div','mod-h');
    hd.appendChild(el('h2','',TN[t]));
    hd.appendChild(el('p','',S.mode==='exam'?(t==='short'?'每题 10 分，对照参考答案自评':'每题 '+EXAM.score[t]+' 分'):'点选作答 · 即时判题 · 附解析与依据'));
    hd.appendChild(el('div','cnt',cnt+' 题'));
    box.appendChild(hd);
    arr.forEach(q=>{box.appendChild(buildQ(q,n));paintQ(q.id);n++});
  });
  renderProgress();
}
function render(){
  renderTabs();renderTools();renderPanel();renderList();
  document.body.classList.toggle('exam-locked', S.mode==='exam' && !(S.exam && S.exam.submitted));
  if(S.mode==='exam')loop();
}

/* ---------------- 按钮 ---------------- */
$('#btnAnswer').onclick=()=>{S.showAll=!S.showAll;save();render()};
$('#btnPrint').onclick=()=>{
  const locked=S.mode==='exam'&&!(S.exam&&S.exam.submitted);
  const old=S.showAll;
  if(!locked){S.showAll=true;document.querySelectorAll('.q').forEach(c=>c.classList.add('show'))}
  window.print();
  if(!locked){S.showAll=old;save();render()}
};
$('#btnReset').onclick=()=>{
  if(!confirm('确定清空全部作答、错题、收藏和试卷进度？（题目与解析不受影响）'))return;
  S.answers={};S.judged={};S.wrong={};S.fav={};S.self={};S.exam=null;S.showAll=false;
  save();render();
};
$('#btnSubmit').onclick=submitExam;
$('#btnTimer').onclick=()=>{
  if(!S.exam||S.exam.submitted||S.minutes===0)return;
  S.exam.running=!S.exam.running;save();updateTimer();loop();
};

render();
})();
</script>
</body>
</html>
